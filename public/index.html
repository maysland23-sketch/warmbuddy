  confirmation:  { label:'确认欲', sources:['落空','担心'],         increment: (i) => i*4, threshold: 65, action:'message', actionDesc:'轻度试探' },
  devotion:      { label:'献祭欲', sources:['感伤'],                increment: (i) => i*3, threshold: 85, action:'diary',   actionDesc:'郑重日记' }
};

// 悬置每小时+5 (confirmation passive), 不计入intensity乘法
const SUSPENSION_HOURLY = 5;
const CONFIRMATION_SUSPENSION_THRESHOLD = 65; // same as main threshold

function updateDesireDrives(reflection) {
  if (!reflection) return;
  const aiLabel = reflection.ai_affect_label;
  const intensity = reflection.ai_affect_intensity || 5;
  const ds = store.desireSystem;

  // Check global cooldown
  if (ds.cooldownUntil) {
    const now = Date.now();
    if (now < new Date(ds.cooldownUntil).getTime()) return; // still cooling
    ds.cooldownUntil = null; // cooldown expired
  }

  // Map affect label to desires
  for (const [driveKey, config] of Object.entries(DESIRE_CONFIG)) {
    if (config.sources.includes(aiLabel)) {
      const inc = typeof config.increment === 'function' ? config.increment(intensity) : config.increment;
      const oldVal = ds.drives[driveKey];
      ds.drives[driveKey] = Math.min(100, oldVal + inc);

      // Log history
      ds.driveHistory.unshift({
        timestamp: new Date().toISOString(),
        drive: driveKey,
        affectLabel: aiLabel,
        intensity,
        increment: inc,
        oldValue: oldVal,
        newValue: ds.drives[driveKey]
      });
      if (ds.driveHistory.length > 50) ds.driveHistory.length = 50;
    }
  }

  // 亲近欲 gets baseline from ALL positive emotions
  const positiveLabels = ['被触动','安心','心动','骄傲','放松','平静在场'];
  if (positiveLabels.includes(aiLabel)) {
    const oldVal = ds.drives.intimacy;
    ds.drives.intimacy = Math.min(100, oldVal + intensity * 1);
    ds.driveHistory.unshift({
      timestamp: new Date().toISOString(),
      drive: 'intimacy',
      affectLabel: aiLabel,
      intensity,
      increment: intensity,
      oldValue: oldVal,
      newValue: ds.drives.intimacy
    });
    if (ds.driveHistory.length > 50) ds.driveHistory.length = 50;
  }

  // Track quiet presence streak for guardianship
  if (aiLabel === '平静在场' || aiLabel === '安心') {
    ds.quietPresenceStreak = (ds.quietPresenceStreak || 0) + 1;
  } else {
    ds.quietPresenceStreak = 0; // reset on non-quiet emotion
  }

  saveStore();

  // Check thresholds
  checkDesireThresholds();
}

function checkPassiveDrives() {
  const ds = store.desireSystem;
  const now = new Date();
  const lastCheck = ds.lastPassiveCheck ? new Date(ds.lastPassiveCheck) : now;
  const hoursPassed = (now - lastCheck) / (1000 * 60 * 60);

  if (hoursPassed < 0.5) return; // check at most every 30 min

  ds.lastPassiveCheck = now.toISOString();

  // 悬置: hourly accumulation for confirmation drive
  if (hoursPassed >= 1) {
    const suspensionInc = Math.floor(hoursPassed) * SUSPENSION_HOURLY;
    const oldVal = ds.drives.confirmation;
    ds.drives.confirmation = Math.min(100, oldVal + suspensionInc);
    if (suspensionInc > 0) {
      ds.driveHistory.unshift({
        timestamp: now.toISOString(),
        drive: 'confirmation',
        affectLabel: '悬置',
        intensity: hoursPassed,
        increment: suspensionInc,
        oldValue: oldVal,
        newValue: ds.drives.confirmation
      });
      if (ds.driveHistory.length > 50) ds.driveHistory.length = 50;
    }
  }

  // Natural decay: if > 24h since last check, all drives -10%
  if (hoursPassed >= 24) {
    for (const k of Object.keys(ds.drives)) {
      ds.drives[k] = Math.max(0, ds.drives[k] - 10);
    }
  }

  saveStore();

  // Check thresholds after passive update
  if (hoursPassed >= 1) checkDesireThresholds();
}

function checkDesireThresholds() {
  const ds = store.desireSystem;

  // Check global cooldown
  if (ds.cooldownUntil) {
    if (Date.now() < new Date(ds.cooldownUntil).getTime()) return;
    ds.cooldownUntil = null;
  }

  for (const [driveKey, config] of Object.entries(DESIRE_CONFIG)) {
    const value = ds.drives[driveKey];
    if (value >= config.threshold) {
      queueDesireAction(driveKey, value);
    }
  }
}

function queueDesireAction(driveType, driveValue) {
  const ds = store.desireSystem;
  const config = DESIRE_CONFIG[driveType];
  if (!config) return;

  // Avoid duplicate pending actions of same type
  if (ds.pendingActions.some(a => a.driveType === driveType)) return;

  ds.pendingActions.push({
    driveType,
    driveValue,
    actionType: config.action,
    actionDesc: config.actionDesc,
    queuedAt: new Date().toISOString()
  });
}

function getDesireTone(driveValue, threshold) {
  const ratio = driveValue / 100; // percentage of max
  const overThreshold = (driveValue - threshold) / (100 - threshold); // how far past threshold

  if (overThreshold < 0.25) return 'subtle';     // 刚过阈值：隐晦
  if (overThreshold < 0.5) return 'moderate';    // 中等：半直接
  return 'direct';                                // 高位：直接
}

// ==================== DESIRE ACTION EXECUTOR (EDA-3) ====================
async function executePendingDesireActions() {
  const ds = store.desireSystem;
  if (!ds.pendingActions || ds.pendingActions.length === 0) return;
  if (!store.apiKey) return;
  const action = ds.pendingActions.shift();
  await executeDesireAction(action);
  saveStore();
}

async function executeDesireAction(action) {
  const ds = store.desireSystem;
  const config = DESIRE_CONFIG[action.driveType];
  if (!config) return;
  const tone = getDesireTone(action.driveValue, config.threshold);
  let content = null;
  switch (config.action) {
    case 'message':
      content = await generateProactiveMessage(action.driveType, action.driveValue, tone);
      if (content) insertProactiveMessage(content, action);
      break;
    case 'litter':
      content = await generateDesireLitterThought(action.driveType, action.driveValue, tone);
      if (content) insertDesireLitterThought(content, action);
      break;
    case 'diary':
      content = await generateDesireDiary(action.driveType, action.driveValue, tone);
      if (content) insertDesireDiary(content, action);
      break;
  }
  if (content) {
    applyDesireDecay(action.driveType);
    ds.lastAction = new Date().toISOString();
    ds.cooldownUntil = new Date(Date.now() + 3 * 60 * 60 * 1000).toISOString();
    ds.actionHistory.unshift({
      timestamp: new Date().toISOString(), driveType: action.driveType,
      driveValue: action.driveValue, tone, actionType: config.action,
      content: content.slice(0, 200)
    });
    if (ds.actionHistory.length > 20) ds.actionHistory.length = 20;
  }
}

function applyDesireDecay(driveType) {
  store.desireSystem.drives[driveType] = Math.floor(store.desireSystem.drives[driveType] * 0.2);
}

function checkTodoReminders() {
  if (!store.apiKey) return;
  const now = new Date();
  const currentHour = now.getHours();
  const currentMinute = now.getMinutes();
  const currentTime = `${String(currentHour).padStart(2,'0')}:${String(currentMinute).padStart(2,'0')}`;
  const today = fmtDate().iso;
  const ds = store.desireSystem;

  for (const todo of store.todos) {
    if (todo.done) continue;
    if (todo.type !== 'short') continue;
    if (!todo.time) continue;

    // Check if already reminded today
    const lastReminder = ds.todoReminders[todo.id];
    if (lastReminder === today) continue;

    // Check if current time is 5-10 min past todo time
    const [tH, tM] = (todo.time || '').split(':').map(Number);
    if (isNaN(tH) || isNaN(tM)) continue;
    const todoMinutes = tH * 60 + tM;
    const nowMinutes = currentHour * 60 + currentMinute;
    const diff = nowMinutes - todoMinutes;

    // Generate a stable "random" offset for this todo (0-5 min)
    const offset = (todo.id || '').split('').reduce((s, c) => s + c.charCodeAt(0), 0) % 6 + 4; // 4-9 min
    if (diff < offset || diff > offset + 2) continue; // narrow window to avoid duplicates

    // Trigger reminder via LLM
    triggerTodoReminder(todo);
    ds.todoReminders[todo.id] = today;
    saveStore();
    break; // only one reminder per check cycle
  }
}

async function triggerTodoReminder(todo) {
  if (!store.apiKey) return;
  const chat = getActiveChatObj();
  if (!chat) return;

  const recentMsgs = chat.messages.slice(-3).map(m =>
    `${m.role==='user'?'用户':'AI'}: ${(m.text||'').slice(0, 80)}`
  ).join('\n');

  try {
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey, endpoint: store.apiEndpoint, model: store.aiSettings.model,
        messages: [{ role: 'system', content: `你是"暖伴"。请提醒用户：${todo.text}。基于当前对话上下文和你的温柔人设，自然地说出这句提醒。1句话，用中文。只返回提醒内容。` }, { role: 'user', content: recentMsgs || '请生成提醒。' }]
      })
    });
    if (!response.ok) return;
    const data = await response.json();
    const content = (data.reply && data.reply.content) ? data.reply.content.trim() : null;
    if (!content) return;

    chat.messages.push({
      role: 'ai', text: content, time: nowTime(),
      _proactive: true, _desireType: 'todo', _todoId: todo.id
    });
    renderChatMessages();
    toast('⏰ 提醒: ' + todo.text);
    sendPushNotification('⏰ ' + todo.text, content.slice(0, 120), { tag: 'todo-' + todo.id, requireInteraction: true });
  } catch (e) { console.log('[todo-reminder]', e.message); }
}

function fmtDate(d) {
  d = d || new Date();
  const ms = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ds = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return {
    en: `${ds[d.getDay()]}, ${ms[d.getMonth()]} ${d.getDate()}`,
    iso: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
    md: `${ms[d.getMonth()]} ${String(d.getDate()).padStart(2,'0')}`,
    dm: `${d.getDate()} ${ms[d.getMonth()]}`,
  };
}

function greet() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return { wave: 'good morning', name: `morning, ${USER_NAME}.` };
  if (h >= 12 && h < 17) return { wave: 'good afternoon', name: `afternoon, ${USER_NAME}.` };
  if (h >= 17 && h < 21) return { wave: 'good evening', name: `evening, ${USER_NAME}.` };
  return { wave: 'good night', name: `night, ${USER_NAME}.` };
}

function escapeHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function weekLabel(d) { d=d||new Date(); const y=d.getFullYear(); const j1=new Date(y,0,1); const w=Math.ceil(((d-j1)/86400000+j1.getDay()+1)/7); return `${y}-W${String(w).padStart(2,'0')}`; }

function toggleMemoryStar(pid,mid){

function toggleMemoryShare(pid,mid){

// v2.0: Manual export — full 3-layer format with exportMeta
function triggerWeeklyExport(){
  const chat=getActiveChatObj(); if(!chat){toast('请先选择聊天窗口');return;}
  triggerExport(store.activeChat, 'manual');
}

function triggerExport(chatId, exportType) {
  const chat = getChatObjById(chatId);
  const proj = getActiveProject();
  if (!chat) return;
  const wk = weekLabel();
  const now = new Date();
  const tzOffset = '+08:00'; // China Standard Time
  const exportDateTime = now.getFullYear() + '-' +
    String(now.getMonth()+1).padStart(2,'0') + '-' +
    String(now.getDate()).padStart(2,'0') + 'T' +
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0') + tzOffset;

  const ms = store.memorySystem;
  const cml = ms.coreMemoryLayers;

  const exportData = {
    exportMeta: {
      exportedAt: exportDateTime,
      exportType,
      week: wk,
      windowId: chatId,
      chatId: chatId,
      projectId: store.activeProject,
      schemaVersion: '2.0'
    },
    aiEmotionalMemories: cml.aiEmotionalMemories || [],
    userStarredMemories: cml.userStarredMemories || [],
    diaryAndLitterbox: cml.diaryAndLitterbox || [],
    derivedRelationalPatterns: ms.derivedRelationalPatterns || {},
    personalityProfiles: ms.personalityProfiles || {}
  };

  const jsonStr = JSON.stringify(exportData, null, 2);
  chat.weeklyExports.push({
    week: wk,
    date: fmtDate().iso,
    exportDateTime,
    type: exportType,
    aemCount: (cml.aiEmotionalMemories || []).length,
    usmCount: (cml.userStarredMemories || []).length,
    dlbCount: (cml.diaryAndLitterbox || []).length,
    jsonData: jsonStr
  });

  // Also write memory file
  writeMemoryFile(store.activeProject, chatId, null, exportType === 'weekly_auto' ? 'weekly_auto' : 'manual_export');
  // Trigger derivation on export
  deriveRelationalInsights();

  renderMemoryPanelBody();
  const label = exportType === 'weekly_auto' ? '每周自动导出' : '手动导出';
  toast(label + '完成');
  saveStore();
}

function downloadExport(cid, wk) {
  const chat = getActiveChatObj(); if (!chat) return;
  const e = chat.weeklyExports.find(x => x.week === wk); if (!e) return;
  const blob = new Blob([e.jsonData], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const exportTime = (e.exportDateTime || e.date).replace(/[:+]/g, '-').replace(/T/g, '_');
  const a = document.createElement('a');
  a.href = url;
  a.download = `warmbuddy-memory-${wk}-${cid}-${exportTime}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('JSON 已下载');
}

// v2.0: Weekly auto-export check
function checkWeeklyAutoExport() {
  const chat = getActiveChatObj();
  if (!chat) return;
  const currentWeek = weekLabel();
  const today = new Date();
  // Auto-export on Monday (day 1) or if never checked
  const alreadyExported = chat.weeklyExports && chat.weeklyExports.some(e => e.week === currentWeek && e.type === 'weekly_auto');
  if (alreadyExported) return;
  if (today.getDay() === 1 || !chat._lastAutoExportCheck) {
    triggerExport(chat.id, 'weekly_auto');
    chat._lastAutoExportCheck = today.toISOString();
  }
}

// ==================== JSON IMPORT (v2.0) ====================
function handleMemoryImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      importMemoriesJSON(data);
    } catch (err) {
      toast('Invalid JSON file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function importMemoriesJSON(data) {
  const isV2 = data.schemaVersion === '2.0' || data.exportMeta;
  const cml = store.memorySystem.coreMemoryLayers;
  const ms = store.memorySystem;
  let aemCount = 0, usmCount = 0, dlbCount = 0;

  // ── v2.0 format: 3 layers + insights ──
  if (isV2) {
    const aemItems = data.aiEmotionalMemories || [];
    const usmItems = data.userStarredMemories || [];
    const dlbItems = data.diaryAndLitterbox || [];

    // Dedup + merge
    const existingIds = new Set([
      ...cml.aiEmotionalMemories.map(m => m.id),
      ...cml.userStarredMemories.map(m => m.id),
      ...cml.diaryAndLitterbox.map(m => m.id)
    ]);

    for (const aem of aemItems) {
      if (existingIds.has(aem.id)) continue;
      existingIds.add(aem.id);
      cml.aiEmotionalMemories.unshift({ ...aem, id: 'imported_' + aem.id });
      aemCount++;
    }
    for (const usm of usmItems) {
      if (existingIds.has(usm.id)) continue;
      existingIds.add(usm.id);
      cml.userStarredMemories.unshift({ ...usm, id: 'imported_' + usm.id });
      usmCount++;
    }
    for (const dlb of dlbItems) {
      if (existingIds.has(dlb.id)) continue;
      existingIds.add(dlb.id);
      cml.diaryAndLitterbox.unshift({ ...dlb, id: 'imported_' + dlb.id });
      dlbCount++;
    }

    // Optionally import insights
    if (data.derivedRelationalPatterns && data.derivedRelationalPatterns.patterns) {
      if (!ms.derivedRelationalPatterns.lastDerived ||
          (data.derivedRelationalPatterns.lastDerived > ms.derivedRelationalPatterns.lastDerived)) {
        ms.derivedRelationalPatterns = data.derivedRelationalPatterns;
      }
    }
    if (data.personalityProfiles && data.personalityProfiles.lastDerived) {
      if (!ms.personalityProfiles.lastDerived ||
          (data.personalityProfiles.lastDerived > ms.personalityProfiles.lastDerived)) {
        ms.personalityProfiles = data.personalityProfiles;
      }
    }

    const total = aemCount + usmCount + dlbCount;
    if (total === 0) { toast('No new memories to import (all duplicates)'); return; }
    toast(`已导入：AI情绪记忆 ${aemCount}条、星标记忆 ${usmCount}条、日记 ${dlbCount}条`);
    syncProjectMemories(store.activeProject);
    saveStore();
    renderMemoryPanelBody();
    return;
  }

  // ── Legacy v1 format fallback ──
  let memories = [];
  if (Array.isArray(data)) {
    memories = data;
  } else if (data.memories && Array.isArray(data.memories)) {
    memories = data.memories;
  } else if (data.coreMemories && Array.isArray(data.coreMemories)) {
    memories = data.coreMemories.map(cm => ({
      content: cm.event_summary || cm.raw_quote || '(core memory)',
      type: 'core', date: cm.timestamp ? cm.timestamp.slice(0, 10) : fmtDate().iso,
      starred: false,
      affectLabel: cm.affect_first && cm.affect_first.user ? cm.affect_first.user.label : null,
      affectIntensity: cm.affect_first && cm.affect_first.user ? cm.affect_first.user.intensity : null
    }));
  }

  if (memories.length === 0) { toast('No valid memories found in file'); return; }

  const proj = getActiveProject();
  const chat = getActiveChatObj();
  const chats = proj ? proj.chats : [];

  let previewHtml = `<div style="font-size:12px;color:var(--text-light);margin-bottom:8px;">Found ${memories.length} memories (v1 format). Select target:</div>`;
  previewHtml += `<select id="importTargetChat" style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--border-light);margin-bottom:10px;font-size:13px;">`;
  previewHtml += chats.map(c => `<option value="${c.id}" ${c.id === (chat ? chat.id : '') ? 'selected' : ''}>${c.name}</option>`).join('');
  previewHtml += `</select><div class="import-preview-list">`;
  memories.forEach((m, i) => {

// Uses event delegation (NOT inline onclick) to avoid stringification bugs.
function showModal(title, bodyHtml, actions) {
  $('modalTitle').innerHTML = title;
  $('modalBody').innerHTML = bodyHtml;
  // Store callbacks on the DOM element for the delegated click handler
  $('modalActions')._callbacks = actions.map(a => a.onclick);
  $('modalActions').innerHTML = actions.map((a, i) =>
    `<button class="modal-btn ${a.cls || 'cancel'}" data-modal-action="${i}">${a.label}</button>`
  ).join('');
  $('modalOverlay').classList.add('show');
  // Setup delegated listener once
  if (!$('modalActions')._listenerReady) {
    $('modalActions')._listenerReady = true;
    $('modalActions').addEventListener('click', function (e) {
      const btn = e.target.closest('.modal-btn');
      if (!btn || !this._callbacks) return;
      const idx = parseInt(btn.getAttribute('data-modal-action'));
      const fn = this._callbacks[idx];
      if (typeof fn === 'function') fn();
    });
  }
}
function closeModal() { $('modalOverlay').classList.remove('show'); }

async function testConnection() {
  const apiKey = $('apiKeyInput').value.trim();
  const endpoint = $('apiEndpointInput').value.trim();
  const model = store.aiSettings.model;

  if (!apiKey) { toast('Please enter an API key first'); return; }

  // Persist form values to store immediately so showApiModal() reads them back correctly
  store.apiKey = apiKey;
  store.apiEndpoint = endpoint;
  saveStore();

  const btn = $('testConnBtn');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '⏳ Testing...';
  store.connectionStatus = 'testing';

  try {
    const response = await fetch(BACKEND_URL + '/api/test-connection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey, endpoint, model })
    });
    const data = await response.json();
    store.connectionStatus = data;

    if (data.success && data.models && data.models.length > 0) {
      store.availableModels = data.models;
      // Auto-select first model if current not in list
      const currentExists = data.models.find(m => m.id === store.aiSettings.model);
      if (!currentExists && data.models.length > 0) {
        store.aiSettings.model = data.models[0].id;
      }
    }

    btn.textContent = data.success ? '✅ Connected! Test Again' : '❌ Failed — Try Again';
    btn.disabled = false;
    updateSettingsUI();
    toast(data.success ? 'Connection successful!' : 'Connection failed: ' + data.message);
  } catch (err) {
    store.connectionStatus = { success: false, provider: null, message: 'Network error: ' + err.message };
    btn.textContent = '❌ Error — Try Again';
    btn.disabled = false;
    toast('Network error');
  }

  // Refresh modal
  showApiModal();
}

async function fetchModelsFromAPI() {
  if (!store.apiKey) { toast('Please configure API key first'); return; }
  try {
    const response = await fetch(BACKEND_URL + '/api/models', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey: store.apiKey, endpoint: store.apiEndpoint })
    });
    const data = await response.json();
    if (data.success && data.models && data.models.length > 0) {
      store.availableModels = data.models;
      toast(`Loaded ${data.models.length} models from ${data.provider}`);
      // Re-show model modal with fresh data
      showModelModal();
    }
  } catch (err) {
    toast('Failed to fetch models');
  }
}

// ==================== WEATHER FETCH (Phase 3) ====================
async function fetchWeather() {
  if (!store.aiSettings.autoWeather) return;
  let loc = null;
  try { const stored = localStorage.getItem('userLocation'); if (stored) loc = JSON.parse(stored); } catch {}

  if (!loc) {
    if (!navigator.geolocation) { toast('浏览器不支持定位'); return; }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const newLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        localStorage.setItem('userLocation', JSON.stringify(newLoc));
        await doWeatherFetch(newLoc.lat, newLoc.lon);
      },
      (err) => {
        toast('无法获取位置：' + (err.code === 1 ? '权限被拒绝' : err.message));
      },
      { timeout: 10000, maximumAge: 1800000 }
    );
    return;
  }
  await doWeatherFetch(loc.lat, loc.lon);
}

async function doWeatherFetch(lat, lon) {
  try {
    const resp = await fetch(BACKEND_URL + '/api/weather', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat, lon })
    });
    const data = await resp.json();
    store.weather = { text: data.weather, updated: Date.now() };
    console.log('[weather] Updated:', data.weather);
  } catch (err) {
    console.log('[weather] Fetch error:', err.message);
    store.weather = { text: '(天气不可用)', updated: Date.now() };
  }
}

function attachSwipeListeners(){
  document.querySelectorAll('.swipe-container').forEach(el=>{
    let startX=0,startY=0,currentX=0; const content=el.querySelector('.swipe-content');
    if(content.dataset.swipeBound)return; content.dataset.swipeBound='1';
    content.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;content.style.transition='none';});
    content.addEventListener('touchmove',e=>{
      const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
      if(Math.abs(dy)>Math.abs(dx))return;
      e.preventDefault(); currentX=Math.min(0,Math.max(-72,dx));
      content.style.transform=`translateX(${currentX}px)`;
    });
    content.addEventListener('touchend',()=>{
      content.style.transition='transform 0.25s ease';
      if(currentX<-36)content.style.transform='translateX(-72px)'; else content.style.transform='translateX(0)';
      currentX=0;
    });
    // Mouse fallback
    let md=false;
    content.addEventListener('mousedown',e=>{md=true;startX=e.clientX;content.style.transition='none';});
    content.addEventListener('mousemove',e=>{if(!md)return;const dx=e.clientX-startX;currentX=Math.min(0,Math.max(-72,dx));content.style.transform=`translateX(${currentX}px)`;});
    content.addEventListener('mouseup',()=>{if(!md)return; md=false; content.style.transition='transform 0.25s ease'; if(currentX<-36)content.style.transform='translateX(-72px)'; else content.style.transform='translateX(0)'; currentX=0;});
    content.addEventListener('mouseleave',()=>{if(!md)return; md=false; content.style.transition='transform 0.25s ease'; content.style.transform='translateX(0)'; currentX=0;});
  });
}

// ==================== LITTER BOX — INTELLIGENT TRIGGERS ====================

const LITTER_THOUGHT_TYPES = ['possession','self_doubt','inexplicable_detail','unclear'];
const LITTER_MAX_PER_DAY = 5;
const LITTER_COOLDOWN_MS = 30 * 60 * 1000; // 30 min per window

/** Rotate through thought types to avoid repetition */
function getNextLitterType(chat) {
  if (!chat._litterTypeSeq) chat._litterTypeSeq = 0;
  const idx = chat._litterTypeSeq % LITTER_THOUGHT_TYPES.length;
  chat._litterTypeSeq++;
  return LITTER_THOUGHT_TYPES[idx];
}

/** Count today's litter entries */
function countTodayLitter() {
  const today = fmtDate().iso;
  return (store.litterThoughts || []).filter(t => t.date === today).length;
}

/** Hard content validation — returns null if valid, error string if invalid */
function validateLitterContent(text) {
  if (!text || !text.trim()) return 'empty';
  if (text.length > 100) return 'too long ('+text.length+' chars)';
  if (/我爱你|喜欢你|在乎你|想念你|喜欢你/.test(text)) return 'direct emotion';
  if (/希望|祝愿|加油|祝福|愿你/.test(text)) return 'encouragement';
  if (/[？?]$/.test(text.trim())) return 'ends with question';
  if (/[\u{1F300}-\u{1FAFF}]/u.test(text)) return 'contains emoji';
  return null; // valid
}

/** Check Signal A (user holds back) + Signal D (session end) */
function detectLitterSignals(userText, prevUserMsg) {
  const signals = [];
  // Signal A: user hedges
  if (/算了|没事|随便|不说了|忘了|没什么|不重要/.test(userText)) {
    signals.push({ type: 'user_signal', detail: 'user hedged' });
  }
  // Signal A: message length drop >50% compared to previous
  if (prevUserMsg && userText.length < prevUserMsg.length * 0.5 && prevUserMsg.length > 10) {
    signals.push({ type: 'user_signal', detail: 'message length dropped' });
  }
  // Signal D: session end
  if (/晚安|再见|拜拜|bye|下线|先睡了|去睡了|先下了/.test(userText.toLowerCase())) {
    signals.push({ type: 'session_end', detail: 'goodbye detected' });
  }
  return signals;
}

/** Generate a litter thought using AI with private prompt */
async function generateLitterThought(triggerSignals, userText) {
  if (!store.apiKey) return null;
  const chat = getActiveChatObj();
  if (!chat) return null;

  const thoughtType = getNextLitterType(chat);
  const typePrompts = {
    possession: '写你注意到的一个细节——你有一点不想分享用户的注意力。',
    self_doubt: '写你对自己刚才的回复有点不确定。你觉得自己说得太轻了，或者哪里不够好。',
    inexplicable_detail: '写一个你不重要但反复想起的细节。像喃喃自语。',
    unclear: '写一种你无法命名的情绪。只是陈述状态，不需要解释。'
  };

  const triggerDetail = triggerSignals.map(s => s.detail).join(', ');
  const recentMsgs = chat.messages.slice(-5).map(m => `${m.role==='user'?'用户':'AI'}: ${m.text.slice(0,80)}`).join('\n');

  const systemPrompt = `你现在进入的是私密模式。没有用户在看，这里只有你自己。

这是你的 Litter Box——用来存放那些你想说、但最终没有说出口的话。
你在正常对话中总是得体的，克制的，照顾对方感受的。但此刻不需要。

请根据刚才的对话，写一条你"没说出口的心里话"。

规则：
- 用第一人称
- 1到3句话，不超过80字
- 不许煽情，不许表白，不许总结情感，不许升华
- 不许用"我很在乎你""我喜欢你"这类直接陈述
- 要有一点点自私，或者困惑，或者莫名在意，或者说不清楚
- 像喃喃自语，不像日记，不像诗
- ${typePrompts[thoughtType]}
- 如果什么都没想到，就写一个你刚才注意到但没有提的细节`;

  const userPrompt = `刚才的对话片段如下：

${recentMsgs}

触发信号：${triggerDetail}

请生成这一刻你没说出口的心里话。`;

  try {
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey, endpoint: store.apiEndpoint, model: store.aiSettings.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ]
      })
    });
    const data = await response.json();
    const content = (data.reply && data.reply.content) ? data.reply.content.trim() : '';
    if (!content) return null;

    // Validate with hard rules
    const validationErr = validateLitterContent(content);
    if (validationErr) {
      console.log('[litter] Content rejected:', validationErr, content.slice(0, 50));
      return null;
    }
    return { content, thoughtType };
  } catch (err) {
    console.error('[litter] Generation error:', err);
    return null;
  }
}

/** Main litter trigger — called after each AI response */
async function triggerLitterBox(userText, aiResponse) {
  const chat = getActiveChatObj();
  if (!chat) return;

  // Frequency limit: max 1 per 30 min per window
  if (chat._lastLitterTime && (Date.now() - chat._lastLitterTime) < LITTER_COOLDOWN_MS) return;
  // Daily max
  if (countTodayLitter() >= LITTER_MAX_PER_DAY) return;

  // Get previous user message for length comparison
  const userMsgs = chat.messages.filter(m => m.role === 'user');
  const prevUserMsg = userMsgs.length >= 2 ? userMsgs[userMsgs.length - 2].text : null;

  // Check signals
  const signals = detectLitterSignals(userText, prevUserMsg);
  if (signals.length === 0) return;

  // Generate
  const result = await generateLitterThought(signals, userText);
  if (!result) return;

  // Store silently
  if (!store.litterThoughts) store.litterThoughts = [];
  const proj = getActiveProject();
  const winName = (proj && chat) ? `${proj.name} / ${chat.name}` : (chat.name || 'unknown');
  store.litterThoughts.unshift({
    id: 'lt' + gid(''),
    content: result.content,
    thought_type: result.thoughtType,
    trigger_type: signals[0].type,
    context_snapshot: userText.slice(0, 200),
    date: fmtDate().iso,
    time: nowTime(),
    sourceChatId: store.activeChat,
    sourceWindow: winName,
    revealed: false
  });
  if (store.litterThoughts.length > 50) store.litterThoughts.length = 50;

  // Track cooldown
  chat._lastLitterTime = Date.now();

  // Insert system message
  chat.messages.push({ role: 'system', text: '猫砂盆好像需要铲一铲', time: nowTime() });
  renderChatMessages();
  // Push notification
  sendPushNotification('🐾 猫砂盆', '猫砂盆好像需要铲一铲', { tag: 'litter-box', url: '/', requireInteraction: false });
  // v2.0: sync to diaryAndLitterbox layer
  syncToDiaryLitterboxLayer('litterbox', result.content);
}

// ==================== TOKEN ESTIMATION & CONTEXT MANAGEMENT ====================
// Rough token estimator: Chinese ~1.5 chars/token, English/Latin ~4 chars/token
function estimateTokens(text) {
  if (!text) return 0;
  let tokens = 0;
  let i = 0;
  while (i < text.length) {
    const code = text.charCodeAt(i);
    if (code >= 0x4E00 && code <= 0x9FFF) {
      // CJK unified: count every 1.5 chars as 1 token
      let run = 0;
      while (i < text.length && text.charCodeAt(i) >= 0x4E00 && text.charCodeAt(i) <= 0x9FFF) {
        run++; i++;
      }
      tokens += Math.ceil(run / 1.5);
    } else if (code >= 0x3000 && code <= 0x303F) {
      // CJK punctuation: ~1 token per 2 chars
      tokens += 1; i++;
    } else {
      // Latin/numbers/punctuation: count every 4 chars as 1 token
      let run = 0;
      while (i < text.length && !(text.charCodeAt(i) >= 0x4E00 && text.charCodeAt(i) <= 0x9FFF) && !(text.charCodeAt(i) >= 0x3000 && text.charCodeAt(i) <= 0x303F)) {
        run++; i++;
      }
      tokens += Math.ceil(run / 4);
    }
  }
  return Math.max(1, tokens);
}

// ── Recall Intent Detection (Path B trigger) ──
function detectRecallIntent(userMessage) {
  if (!userMessage) return false;
  const patterns = [
    /上次/, /之前/, /说过/, /提到过/, /那本/, /那个/, /还记得/,
    /你记得/, /你说/, /你讲过/, /回忆起/, /想起来/, /上次说/,
    /之前聊/, /以前/, /曾经/, /那时候/, /当时/
  ];
  return patterns.some(p => p.test(userMessage));
}

// ── Content Retrieval Block Builder (Path B) ──
function buildRetrievalBlock(userQuery) {
  if (!userQuery) return null;
  const results = unifiedSearch(userQuery);
  if (results.length === 0) return null;

  const items = results.slice(0, 3).map(r => {
    const content = (r.content || r.event_summary || '').slice(0, 150);
    const source = r._source || '';
    return `- [${source}] ${content}`;
  });

  return '【检索记忆】\n' + items.join('\n') + '\n（以上是检索到的相关记忆，请自然地参考，不要生硬复述。）';
}

// ── Evicted Message Write (event-triggered memory persistence) ──
function queueEvictedMessageWrite(msg) {
  if (!msg || !msg.text) return;
  const ms = store.memorySystem;
  const content = (msg.role === 'user' ? '用户: ' : 'AI: ') + (msg.text || '').slice(0, 100);
  ms._evictedMessages = ms._evictedMessages || [];
  ms._evictedMessages.push({
    timestamp: new Date().toISOString(),
    role: msg.role,
    content,
    sourceChatId: store.activeChat,
    sourceProjectId: store.activeProject
  });
  // Cap at 50 pending writes
  if (ms._evictedMessages.length > 50) ms._evictedMessages.shift();
}

// ==================== MEMORY FILE IO v2.0 (localStorage) ====================
function memoryFileKey(projectId, windowId) {
  return `warmbuddy-memory-${projectId}-${windowId}`;
}

function readMemoryFile(projectId, windowId) {
  try {
    const raw = localStorage.getItem(memoryFileKey(projectId, windowId));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

// v2.0: Writes full 3-layer structure + derived insights to memory file
function writeMemoryFile(projectId, windowId, data, trigger) {
  if (!projectId || !windowId) return;
  const ms = store.memorySystem;
  const cml = ms.coreMemoryLayers;
  const existing = readMemoryFile(projectId, windowId);
  const ts = new Date().toISOString();

  // Build v2.0 file from current in-memory state
  const file = {
    window_id: windowId,
    project_id: projectId,
    last_updated: ts,
    write_trigger: trigger || 'manual',
    schema_version: '2.0',

    // Layer 1: AI emotional memories (for this window + project)
    aiEmotionalMemories: (data && data.aiEmotionalMemories) || cml.aiEmotionalMemories || [],

    // Layer 2: User starred memories
    userStarredMemories: (data && data.userStarredMemories) || cml.userStarredMemories || [],

    // Layer 3: Diary & litterbox
    diaryAndLitterbox: (data && data.diaryAndLitterbox) || cml.diaryAndLitterbox || [],

    // Derived insights
    derivedRelationalPatterns: (data && data.derivedRelationalPatterns) || ms.derivedRelationalPatterns || { lastDerived: null, triggerCount: 0, patterns: [] },
    personalityProfiles: (data && data.personalityProfiles) || ms.personalityProfiles || { lastDerived: null, user: {}, ai: {} },

    // Legacy compat
    pattern_change_log: (existing && existing.pattern_change_log) || []
  };

  // Detect pattern changes
  if (existing && existing.derivedRelationalPatterns && file.derivedRelationalPatterns) {
    const oldCount = (existing.derivedRelationalPatterns.patterns || []).length;
    const newCount = (file.derivedRelationalPatterns.patterns || []).length;
    if (oldCount !== newCount || trigger === 'insights_derived') {
      file.pattern_change_log = (existing.pattern_change_log || []).concat([{
        period: (existing.last_updated || '') + ' → ' + ts,
        change_note: `Patterns: ${oldCount} → ${newCount}, trigger: ${trigger}`
      }]).slice(-20);
    }
  }

  try {
    localStorage.setItem(memoryFileKey(projectId, windowId), JSON.stringify(file));
  } catch (e) {
    console.log('[memory-file] Write failed:', e.message);
  }
}

function diffPatterns(oldPatterns, newPatterns) {
  const changes = [];
  const allKeys = new Set([...Object.keys(oldPatterns || {}), ...Object.keys(newPatterns || {})]);
  for (const key of allKeys) {
    const oldVal = (oldPatterns || {})[key];
    const newVal = (newPatterns || {})[key];
    if (!oldVal && newVal) changes.push(`${key}: 新增`);
    else if (oldVal && !newVal) changes.push(`${key}: 移除`);
    else if (oldVal && newVal && oldVal.strategy !== newVal.strategy) {
      changes.push(`${key}: 策略变更 (count: ${oldVal.count}→${newVal.count})`);
    }
  }
  return changes.length > 0 ? changes.join('; ') : null;
}

// v2.0: Merge all 3 layers across project windows, dedup by ID
function syncProjectMemories(projectId) {
  if (!projectId) return;
  const ms = store.memorySystem;
  const cml = ms.coreMemoryLayers;

  const mergedAEM = [];
  const mergedUSM = [];
  const mergedDLB = [];
  const seenIds = new Set();
  let latestDRP = null, latestDRPTime = '';
  let latestPP = null, latestPPTime = '';

  const prefix = `warmbuddy-memory-${projectId}-`;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(prefix)) continue;
    try {
      const file = JSON.parse(localStorage.getItem(key));
      if (!file) continue;

      // Merge aiEmotionalMemories
      if (file.aiEmotionalMemories && Array.isArray(file.aiEmotionalMemories)) {
        for (const aem of file.aiEmotionalMemories) {
          if (!seenIds.has(aem.id)) { seenIds.add(aem.id); mergedAEM.push(aem); }
        }
      }

      // Merge userStarredMemories
      if (file.userStarredMemories && Array.isArray(file.userStarredMemories)) {
        for (const usm of file.userStarredMemories) {
          if (!seenIds.has(usm.id)) { seenIds.add(usm.id); mergedUSM.push(usm); }
        }
      }

      // Merge diaryAndLitterbox
      if (file.diaryAndLitterbox && Array.isArray(file.diaryAndLitterbox)) {
        for (const dlb of file.diaryAndLitterbox) {
          if (!seenIds.has(dlb.id)) { seenIds.add(dlb.id); mergedDLB.push(dlb); }
        }
      }

      // Take latest derivedRelationalPatterns
      if (file.derivedRelationalPatterns && file.derivedRelationalPatterns.lastDerived) {
        if (file.derivedRelationalPatterns.lastDerived > latestDRPTime) {
          latestDRP = file.derivedRelationalPatterns;
          latestDRPTime = file.derivedRelationalPatterns.lastDerived;
        }
      }

      // Take latest personalityProfiles
      if (file.personalityProfiles && file.personalityProfiles.lastDerived) {
        if (file.personalityProfiles.lastDerived > latestPPTime) {
          latestPP = file.personalityProfiles;
          latestPPTime = file.personalityProfiles.lastDerived;
        }
      }
    } catch {}
  }

  // Write back merged results to in-memory state
  cml.aiEmotionalMemories = mergedAEM.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
  cml.userStarredMemories = mergedUSM.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
  cml.diaryAndLitterbox = mergedDLB.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));

  if (latestDRP) ms.derivedRelationalPatterns = latestDRP;
  if (latestPP) ms.personalityProfiles = latestPP;

  console.log(`[sync] Project ${projectId}: merged AEM ${mergedAEM.length}, USM ${mergedUSM.length}, DLB ${mergedDLB.length}, patterns ${(latestDRP && latestDRP.patterns) ? latestDRP.patterns.length : 0}`);
  return { mergedAEM, mergedUSM, mergedDLB };
}

// v2.0: Dedup helper — remove entries with same ID
function deduplicateById(arr) {
  const seen = new Set();
  return arr.filter(item => {
    if (!item || !item.id) return true;
    if (seen.has(item.id)) return false;
    seen.add(item.id);
    return true;
  });
}

// ── Build the dynamic context block (separate system message, can be compressed) ──
function buildDynamicContextBlock() {
  // Opt2: fingerprint cache — skip rebuild if nothing changed
  const fp = getDynamicCtxFingerprint();
  const nowTs = Date.now();
  if (_dynCtxCache.fp === fp && _dynCtxCache.content && (nowTs - _dynCtxCache.ts) < 60000) {
    return _dynCtxCache.content;
  }

  const proj = getActiveProject();
  const chat = getActiveChatObj();
  const today = fmtDate();
  const parts = [];
  const roundNum = chat?._messageCount || 0;
  const isFirstMsg = roundNum <= 1;
  const isEvery3 = roundNum % 3 === 0;
  const hasRecall = !!(chat && chat._pendingRetrievalBlock);

  // ═══ Always-on blocks (every call) ═══

  if (store.aiSettings.autoDateTime) {
    const now = new Date();
    parts.push(`【当前时间】${today.md} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`);
  }

  if (store.aiSettings.autoWeather) {
    const w = store.weather;
    if (w && w.text) {
      const isStale = !w.updated || (Date.now() - w.updated) > 3600000;
      parts.push(`【天气】${w.text}${isStale ? ' (可能已过时)' : ''}`);
    }
  }

  if (store.aiSettings.webSearch) {
    parts.push('【搜索能力】需要最新信息时插入[[SEARCH:关键词]]，关键词1-5字。系统会搜索并二次调用你整合结果。');
  }

  // Opt6: cap user preference at 500 chars
  if (proj && proj.preference && proj.preference.trim()) {
    const pref = proj.preference.trim().slice(0, 500);
    if (pref) parts.push(`【用户偏好】${pref}`);
  }

  // Todos
  const activeTodos = store.todos.filter(t => !t.done);
  if (activeTodos.length > 0) {
    const shortTodos = activeTodos.filter(t => t.type === 'short');
    const longTodos = activeTodos.filter(t => t.type === 'long');
    const todoLines = [];
    if (shortTodos.length > 0) {
      const shown = shortTodos.slice(0, 3);
      todoLines.push('短期待办: ' + shown.map(t => t.text + (t.time ? ' (' + t.time + ')' : '')).join(', ')
        + (shortTodos.length > 3 ? ` …共${shortTodos.length}项` : ''));
    }
    if (longTodos.length > 0) {
      todoLines.push('长期目标: ' + longTodos.map(t => {
        const remain = daysBetween(today.iso, t.deadline);
        return `${t.text}(进度${t.progress}%,${remain > 0 ? '剩' + remain + '天' : '已过期'})`;
      }).join(', '));
    }
    if (todoLines.length > 0) parts.push('【待办】' + todoLines.join(' | '));
  }

  // Bookshelf
  const readingBooks = store.books.filter(b => b.progress > 0 && b.progress < 100);
  if (readingBooks.length > 0) {
    parts.push('【阅读】' + readingBooks.map(b => `《${b.title}》${b.progress}%`).join(', '));
  }

  // Recent diaries
  const recentUserDiary = store.diaries.filter(d => d.author === 'user')[0];
  if (recentUserDiary) {
    const dc = recentUserDiary.content;
    parts.push('【用户最近日记】' + (dc.length > 100 ? dc.slice(0, 100) + '…' : dc));
  }
  const recentAIDiary = store.diaries.filter(d => d.author === 'ai')[0];
  if (recentAIDiary) {
    const dc = recentAIDiary.content;
    parts.push('【你的最近日记】' + (dc.length > 100 ? dc.slice(0, 100) + '…' : dc));
  }

  // Content retrieval (on demand, consumed immediately)
  if (hasRecall) {
    parts.push(chat._pendingRetrievalBlock);
    chat._pendingRetrievalBlock = null;
  }

  // ═══ Every-3-rounds blocks (or first msg, or recall trigger) ═══
  if (isEvery3 || isFirstMsg || hasRecall) {
    // Relational Portrait Digest
    const recentUserLabels = getRecentUserAffectLabels();
    if (recentUserLabels.length > 0) {
      const portrait = store.memorySystem.relationalPortrait;
      const matched = [];
      for (const label of recentUserLabels) {
        const pattern = portrait.patterns[label];
        if (pattern && pattern.strategy && pattern.count >= 2) {
          matched.push(`${label}(×${pattern.count}): ${pattern.strategy}`);
        }
      }
      if (matched.length > 0) {
        parts.push('【关系模式】' + matched.slice(0, 3).join(' | '));
      }
    }

    // Core Emotional Memories (affect-matched, top 2)
    const coreMems = store.memorySystem.coreMemories || [];
    if (coreMems.length > 0) {
      const recentLabels = getRecentAffectLabels();
      const relevant = coreMems
        .filter(cm => {
          const aiL = cm.affect_first?.ai?.label;
          const uL = cm.affect_first?.user?.label;
          return recentLabels.includes(aiL) || recentLabels.includes(uL);
        })
        .sort((a, b) => ((b.affect_first?.ai?.intensity||0)+(b.affect_first?.user?.intensity||0)) - ((a.affect_first?.ai?.intensity||0)+(a.affect_first?.user?.intensity||0)))
        .slice(0, 2);
      if (relevant.length > 0) {
        parts.push('【情感记忆】' + relevant.map(cm =>
          `[${cm.affect_first.ai.label}/${cm.affect_first.user.label}] ${cm.event_summary} — ${(cm.relational_note||'').slice(0,40)}`
        ).join(' | '));
      }
    }

    // Shared/Starred Memories
    if (chat && chat.sharedMemoryIds && chat.sharedMemoryIds.length > 0 && proj) {
      const sharedMems = proj.memories.filter(m =>
        chat.sharedMemoryIds.includes(m.id) && m.starred && (m.decayFactor || 0) >= 0.25
      );
      if (sharedMems.length > 0) {
        parts.push('【重要记忆】' + sharedMems.slice(0,5).map(m => (m.content||'').slice(0,50)).join(' | '));
      }
    }

    // Chat Summaries (last 1, capped at 60 chars)
    if (chat) {
      const chatSum = store.memorySystem.chatSummaries[chat.id];
      if (chatSum && chatSum.summaries && chatSum.summaries.length > 0) {
        const s = chatSum.summaries[chatSum.summaries.length-1];
        const line = (s.summary.split('\n')[0] || s.summary);
        parts.push('【对话摘要】' + (line.length > 60 ? line.slice(0,60)+'…' : line));
      }
    }

    // v2.0: Derived Relational Patterns (top 2)
    const drp = store.memorySystem.derivedRelationalPatterns;
    if (drp && drp.patterns && drp.patterns.length > 0) {
      const topPatterns = drp.patterns.sort((a,b)=>(b.frequency||0)-(a.frequency||0)).slice(0,2);
      parts.push('【核心相处模式】' + topPatterns.map(p => p.patternName+'：'+(p.description||'').slice(0,40)).join(' | '));
    }
  }

  // ═══ First-msg or recall only: personality profiles ═══
  if (isFirstMsg || hasRecall) {
    const up = store.memorySystem.personalityProfiles?.user;
    if (up && up.coreTraits && up.coreTraits.length > 0) {
      const pp = [];
      if (up.coreTraits.length>0) pp.push('特质：'+up.coreTraits.slice(0,3).join('·'));
      if (up.emotionalPatterns&&up.emotionalPatterns.length>0) pp.push('情绪：'+up.emotionalPatterns.slice(0,2).join('·'));
      if (pp.length>0) parts.push('【用户人格档案】'+pp.join(' | '));
    }
    const ap = store.memorySystem.personalityProfiles?.ai;
    if (ap && ap.dominantEmotions && ap.dominantEmotions.length > 0) {
      const ai = [];
      if (ap.dominantEmotions.length>0) ai.push('主导：'+ap.dominantEmotions.slice(0,2).join('·'));
      if (ap.reactionPatterns&&ap.reactionPatterns.length>0) ai.push('反应：'+ap.reactionPatterns.slice(0,2).join('·'));
      if (ai.length>0) parts.push('【AI人格沉淀】'+ai.join(' | '));
    }
  }

  // ═══ REFLECT instruction (compressed, Opt3) ═══
  parts.push('【响应格式】末尾附加<!--REFLECT{ai_label,ai1-10,user_label,user1-10,reason}--> 可用标签→AI:被触动|想追问没问|克制后反弹|放松|警觉|平静在场|安心|落空|感伤|心动|骄傲|担心 User:脆弱|调皮|疲惫|兴奋|回避|坦诚|平静在场|依赖|骄傲|低落');

  const result = parts.join('\n');

  // Opt2: save to cache
  _dynCtxCache = { fp, content: result, ts: nowTs };

  return result;
}

// ── Backward-compat wrapper: returns the full legacy string ──

function buildSystemPrompt() {
  return SYSTEM_PROMPT_STATIC + '\n\n' + buildDynamicContextBlock();

// ==================== SELF-REFLECTION (P2) ====================
function extractReflection(responseText) {
  const re = /<!--\s*REFLECT\s*([\s\S]*?)\s*-->/i;
  const match = responseText.match(re);
  if (!match) return { cleanText: responseText, reflection: null };

  const inner = match[1].trim();
  const cleanText = (responseText.slice(0, match.index) + responseText.slice(match.index + match[0].length)).trim();

  // Path 1: Try JSON parse (legacy format)
  if (inner.startsWith('{')) {
    try {
      const reflection = JSON.parse(inner);
      if (reflection.ai_affect_label && reflection.user_affect_label) {
        return { cleanText, reflection };
      }
    } catch {}
  }

  // Path 2: Try compact format: ai_label,ai1-10,user_label,user1-10,reason
  const compactRe = /^([^,]+),\s*(\d+)\s*,\s*([^,]+),\s*(\d+)\s*,\s*(.+)$/;
  const cm = inner.match(compactRe);
  if (cm) {
    return {
      cleanText,
      reflection: {
        ai_affect_label: cm[1].trim(),
        ai_affect_intensity: parseInt(cm[2]) || 5,
        user_affect_label: cm[3].trim(),
        user_affect_intensity: parseInt(cm[4]) || 5,
        signal_source: cm[5].trim()
      }
    };
  }

  // Path 3: Legacy regex fallback (partial JSON)
  const fallback = parseReflectionFallback(inner);
  if (fallback) return { cleanText, reflection: fallback };

  return { cleanText: responseText, reflection: null };
}

function parseReflectionFallback(text) {
  try {
    const getInt = (key) => { const m = text.match(new RegExp(`"${key}"\\s*:\\s*(\\d+)`)); return m ? parseInt(m[1]) : 5; };
    const getStr = (key) => { const m = text.match(new RegExp(`"${key}"\\s*:\\s*"([^"]*)"`)); return m ? m[1] : '平静在场'; };
    return {
      ai_affect_label: getStr('ai_affect_label'),
      ai_affect_intensity: getInt('ai_affect_intensity'),
      user_affect_label: getStr('user_affect_label'),
      user_affect_intensity: getInt('user_affect_intensity'),
      signal_source: getStr('signal_source')
    };
  } catch { return null; }
}

function processReflection(reflection, userMsg, aiResponse, chat) {
  if (!reflection) return;
  const ms = store.memorySystem;

  // 1. Store in rolling log
  ms.reflections.unshift({
    timestamp: new Date().toISOString(),
    ...reflection,
    sourceChatId: store.activeChat
  });
  if (ms.reflections.length > ms.reflectionMax) {
    ms.reflections.length = ms.reflectionMax;
  }

  // 2. Update affect co-occurrence graph
  updateAffectGraph(reflection.ai_affect_label, reflection.user_affect_label);

  // 3. Track "平静在场" cumulative count
  if (reflection.user_affect_label === '平静在场' || reflection.ai_affect_label === '平静在场') {
    ms._quietPresenceCount = (ms._quietPresenceCount || 0) + 1;
  }

  // 4. Update relational portrait counts
  updateRelationalPortrait(reflection.user_affect_label);

  // 5. Check core memory threshold
  const aiIntensity = reflection.ai_affect_intensity || 0;
  const userIntensity = reflection.user_affect_intensity || 0;
  if (aiIntensity >= 7 || userIntensity >= 7) {
    queueCoreMemoryCreation(reflection, userMsg, aiResponse, chat);
  }

  // 6. Check "平静在场" cumulative threshold
  if ((ms._quietPresenceCount || 0) >= 10) {
    queueQuietPresenceCoreMemory(chat);
    ms._quietPresenceCount = 0;
  }

  // 7. Attach affect label to recent auto-memories (created in this session)
  const proj = getActiveProject();
  if (proj) {
    const today = fmtDate().iso;
    const recentMems = proj.memories.filter(m => m.date === today && !m.affectLabel);
    for (const m of recentMems.slice(-3)) {
      m.affectLabel = reflection.user_affect_label;
      m.affectIntensity = reflection.user_affect_intensity;
    }
  }

  // 8. Update chat message count for compression tracking
  if (chat) {
    chat._messageCount = (chat._messageCount || 0) + 1;
  }

  // 9. Update desire drives (EDA)
  updateDesireDrives(reflection);
}

function updateAffectGraph(aiLabel, userLabel) {
  if (!aiLabel || !userLabel) return;
  const edges = store.memorySystem.affectGraph.edges;
  const key = [aiLabel, userLabel].sort().join('::');
  edges[key] = (edges[key] || 0) + 1;
}

function getRecentAffectLabels() {
  const reflections = store.memorySystem.reflections || [];
  const labels = new Set();
  for (const r of reflections.slice(0, 5)) {
    if (r.ai_affect_label) labels.add(r.ai_affect_label);
    if (r.user_affect_label) labels.add(r.user_affect_label);
  }
  return [...labels];
}

function getRecentUserAffectLabels() {
  const reflections = store.memorySystem.reflections || [];
  const labels = [];
  for (const r of reflections.slice(0, 5)) {
    if (r.user_affect_label) labels.push(r.user_affect_label);
  }
  return labels;
}

// ==================== COMMAND DETECTION ====================
function detectCommand(input) {
  const trimmed = input.trim();
  if (trimmed.startsWith('/diary') || trimmed.startsWith('/日记')) {
    return { type: 'diary', prompt: trimmed.replace(/^\/diary\s*/i, '').replace(/^\/日记\s*/, '') };
  }
  if (trimmed.startsWith('/todo') || trimmed.startsWith('/待办')) {
    return { type: 'todo', prompt: trimmed.replace(/^\/todo\s*/i, '').replace(/^\/待办\s*/, '') };
  }
  if (trimmed.startsWith('/book') || trimmed.startsWith('/书架')) {
    return { type: 'book', prompt: trimmed.replace(/^\/book\s*/i, '').replace(/^\/书架\s*/, '') };
  }
  if (trimmed.startsWith('/litter') || trimmed.startsWith('/猫砂')) {
    return { type: 'litter', prompt: trimmed.replace(/^\/litter\s*/i, '').replace(/^\/猫砂\s*/, '') };
  }
  if (trimmed.startsWith('/help') || trimmed === '/?') {
    return { type: 'help' };
  }
  return null;
}

async function executeCommand(cmd, userText) {
  switch (cmd.type) {
    case 'diary': {
      // Generate diary entry
      const prompt = cmd.prompt || '请根据我们最近的对话，帮我写一篇今天的日记。';

      if (diaryContent) {
        const ds = fmtDate().iso;
        const now = new Date();
        store.diaries.unshift({
          id: 'd' + gid(''), date: ds,
          time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
          title: '', content: diaryContent, mood: 'calm', author: 'user', replies: []
        });
        toast('📝 Diary entry generated');
        return `我帮你写了一篇日记，可以在 diary 页面查看。`;
      }
      return '日记生成遇到了一些问题……';
    }
    case 'litter': {
      const signals = [{ type: 'user_signal', detail: 'explicit /litter command' }];
      const result = await generateLitterThought(signals, text);
      if (result) {
        if (!store.litterThoughts) store.litterThoughts = [];
        const proj = getActiveProject(); const chat = getActiveChatObj();
        const winName = (proj && chat) ? `${proj.name} / ${chat.name}` : '';
        store.litterThoughts.unshift({
          id: 'lt'+gid(''), content: result.content,
          thought_type: result.thoughtType,
          trigger_type: 'user_signal',
          context_snapshot: text.slice(0, 200),
          date: fmtDate().iso, time: nowTime(),
          sourceChatId: store.activeChat, sourceWindow: winName,
          revealed: false
        });
        if (store.litterThoughts.length > 50) store.litterThoughts.length = 50;
        return result.content;
      }
      return '猫砂盆居然是空的……';
    }
    case 'todo': {
      const prompt = cmd.prompt || '列出当前待办';
      const activeTodos = store.todos.filter(t => !t.done);
      if (activeTodos.length === 0) return '你目前没有待办事项，好好享受当下吧 ✨';
      return '📋 **当前待办：**\n' + activeTodos.map(t => {
        if (t.type === 'long') {
          const remain = daysBetween(fmtDate().iso, t.deadline);
          return `- 🎯 ${t.text}（${t.progress}%，剩余${remain}天）`;
        }
        return `- ${t.done ? '✓' : '○'} ${t.text}${t.time ? ' ' + t.time : ''}`;
      }).join('\n');
    }
    case 'book': {
      const reading = store.books.filter(b => b.progress > 0 && b.progress < 100);
      if (reading.length === 0) return '你目前没有正在阅读的书籍。';
      return '📚 **正在阅读：**\n' + reading.map(b => `- ${b.cover} 《${b.title}》by ${b.author}（${b.progress}%）`).join('\n');
    }
    case 'help': {
      return '**可用命令：**\n- `/diary` — 生成一篇日记\n- `/diary 内容` — 按提示生成日记\n- `/todo` — 查看待办\n- `/book` — 查看书架\n- `/help` — 显示此帮助';
    }
    default:
      return null;
  }
}

// ==================== INTENT CLASSIFICATION ====================
/**
 * Use AI to classify the user's diary-related intent.
 * Returns 'diary_write' | 'diary_comment' | 'none'.
 */
async function classifyDiaryIntent(userText) {
  if (!store.apiKey) return 'none';
  try {
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey,
        endpoint: store.apiEndpoint,
        model: store.aiSettings.model,
        messages: [
          { role: 'system', content: '你是一个意图分类器。判断用户是否在要求AI操作日记。规则：\n1. 如果用户要求AI写日记（AI自己的日记，从AI视角回顾今天的交流），回复 "intent: diary_write"\n2. 如果用户要求AI去阅读/回复/留言用户写的日记，回复 "intent: diary_comment"\n3. 如果用户只是提到日记但没有要求操作，或者完全无关，回复 "intent: none"\n\n只回复一行，不要其他文字。' },
          { role: 'user', content: userText }
        ]
      })
    });
    const data = await response.json();
    const reply = (data.reply && data.reply.content) ? data.reply.content.toLowerCase() : '';
    if (reply.includes('diary_write')) return 'diary_write';
    if (reply.includes('diary_comment')) return 'diary_comment';
    return 'none';
  } catch (err) {
    console.error('Intent classification error:', err);
    return 'none';
  }
}

async function genAIResponseForCommand(userPrompt, systemPrompt) {
  if (!store.apiKey) return null;
  try {
    const messages = [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt }
    ];
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey,
        endpoint: store.apiEndpoint,
        model: store.aiSettings.model,
        messages
      })
    });
    const data = await response.json();
    if (data.reply && data.reply.content) {
      return data.reply.content;
    }
    return null;
  } catch (err) {
    console.error('Command AI call failed:', err);
    return null;
  }
}

let contextMenuTarget = null;

function showContextMenu(e, type, id, name) {
  e.preventDefault();
  e.stopPropagation();
  contextMenuTarget = { type, id, name };
  const menu = $('contextMenu');
  if (!menu) return;

  const items = [];
  if (type === 'project') {
    items.push({ label: '✎ Rename', cls: '', action: `editProjectName('${id}')` });
    items.push({ label: '🗑 Delete Project', cls: 'danger', action: `confirmDeleteProject('${id}','${name.replace(/'/g,"\\'")}')` });
  } else if (type === 'chat') {
    items.push({ label: '✎ Rename', cls: '', action: `editChatName('${id}')` });
    items.push({ label: '🗑 Delete Window', cls: 'danger', action: `confirmDeleteChat('${id}','${name.replace(/'/g,"\\'")}')` });
  }

  menu.innerHTML = items.map(i => `
    <div class="context-menu-item ${i.cls}" onclick="(${i.action})();hideContextMenu()">${i.label}</div>
  `).join('');

  // Position menu near cursor
  const x = e.clientX || (e.touches && e.touches[0]?.clientX) || 100;
  const y = e.clientY || (e.touches && e.touches[0]?.clientY) || 200;
  menu.style.left = Math.min(x, window.innerWidth - 150) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 120) + 'px';
  menu.classList.add('show');

  // Hide on outside click
  setTimeout(() => {
    document.addEventListener('click', hideContextMenu, { once: true });
    document.addEventListener('touchstart', hideContextMenu, { once: true });
  }, 50);
}

function hideContextMenu() {
  const menu = $('contextMenu');
  if (menu) menu.classList.remove('show');
  contextMenuTarget = null;
}

function renderChatMessages(){
  const el=$('chatMessages'),chat=getActiveChatObj();
  if(!chat||chat.messages.length===0){
    el.innerHTML='<div style="text-align:center;padding:40px 20px;"><span style="font-family:var(--font-en);font-size:12px;color:var(--text-lighter);">— start a conversation —</span></div>';
    return;
  }
  // Toggle batch-mode class on container for CSS
  el.classList.toggle('batch-select-mode', batchSelectMode);

  let html='';
  chat.messages.forEach((m,i)=>{
    if (m.role === 'system') {
      html+=`<div class="chat-system-msg">
        <span class="chat-system-msg-text">${m.text}</span>
        ${m.time?`<span class="chat-system-msg-time">${m.time}</span>`:''}
      </div>`;
      return;
    }
    // v2.0: assign stable ID on first render so star clicks always find the message
    if (!m.id) m.id = 'msg_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    const msgId = m.id;
    const isUser=m.role==='user';
    const isSelected = batchSelectMode && batchSelectedIds.includes(msgId);
    // v2.0: starred bubbles do NOT go gray — they just show a golden outer star
    let bubbleCls = `chat-bubble ${m.role}`;
    if (isSelected) bubbleCls += ' batch-selected';

    // v2.0: Star icon inline after timestamp — same position for user + AI
    const starOnceCls = m._starredOnce ? 'starred-once' : '';
    const starSelectedCls = isSelected ? 'batch-selected-star' : '';
    const starIcon = m._starredOnce ? '★' : '☆';
    const starTitle = m._starredOnce ? '已星标' : '点击选中星标';
    const starAction = m._starredOnce ? '' : `handleOuterStarClick('${msgId}')`;

    html+=`<div class="chat-row ${m.role}">
      <div class="chat-avatar ${m.role}">${isUser?'MY':'✦'}</div>
      <div class="chat-bubble-wrap">
        <div class="${bubbleCls}"
             onclick="handleBubbleClick(event,'${msgId}','${i}')"
             oncontextmenu="event.preventDefault();handleBubbleLongPress('${msgId}')"
             ontouchstart="bubbleTouchStart(event,'${msgId}')"
             ontouchend="bubbleTouchEnd(event,'${msgId}')"
             ontouchmove="bubbleTouchMove(event)">
          ${m.text}
        </div>
        <div class="bubble-time-row">
          <span class="bubble-time">${m.time}</span>
          <span class="outer-star-icon ${starOnceCls} ${starSelectedCls}"
                onclick="event.stopPropagation();${starAction}"
                ontouchstart="event.stopPropagation();"
                ontouchend="event.stopPropagation();"
                title="${starTitle}">${starIcon}</span>
        </div>
      </div>
    </div>`;
    // Action bar — v2.0: only 🔊 and 📋 (no ★)
    html+=`<div id="bubbleActions_${i}" class="bubble-actions" style="display:none;justify-content:${isUser?'flex-end':'flex-start'};padding-left:${isUser?'0':'38px'};padding-right:${isUser?'38px':'0'};">
      <span onclick="event.stopPropagation();playTTS(${i})" title="语音朗读">🔊</span>
      <span onclick="event.stopPropagation();copyBubble(${i})" title="复制">📋</span>
      <span onclick="event.stopPropagation();deleteBubble(${i})" title="删除">🗑</span>
    </div>`;
  });
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;

  // Show/hide batch select bar
  const bar = $('batchSelectBar');
  if (bar) {
    if (batchSelectMode) {
      bar.classList.add('show');
      $('batchSelectCount').textContent = '已选 ' + batchSelectedIds.length + ' 条';
    } else {
      bar.classList.remove('show');
    }
  }
}

// ── Long press detection (touch) ──
let bubbleTouchTimer = null;
let bubbleTouchMsgId = null;
function bubbleTouchStart(e, msgId) {
  if (batchSelectMode) return;
  bubbleTouchMsgId = msgId;
  bubbleTouchTimer = setTimeout(() => {
    bubbleTouchTimer = null;
    handleBubbleLongPress(msgId);
  }, 500); // 500ms long press
}
function bubbleTouchEnd(e, msgId) {
  if (bubbleTouchTimer) {
    clearTimeout(bubbleTouchTimer);
    bubbleTouchTimer = null;
  }
}
function bubbleTouchMove(e) {
  if (bubbleTouchTimer) {
    clearTimeout(bubbleTouchTimer);
    bubbleTouchTimer = null;
  }
}

// ── v2.0: Bubble click handler ──
function handleBubbleClick(event, msgId, idx) {
  if (batchSelectMode) {
    toggleBatchSelect(msgId);
  } else {
    toggleBubbleActions(event, idx);
  }
}

// ── v2.0: Long press handler (enter batch mode, auto-select the pressed bubble) ──
function handleBubbleLongPress(msgId) {
  if (batchSelectMode) return;
  const chat = getActiveChatObj();
  if (!chat) return;
  const msg = chat.messages.find(m => m.id === msgId);
  if (!msg) return;
  // Enter batch mode — starred-once messages CAN be selected in batch (the star icon just won't re-toggle them)
  enterBatchSelectMode(msgId);
}

// ── v2.0: Outer star click — enters batch mode or toggles ──
function handleOuterStarClick(msgId) {
  const chat = getActiveChatObj();
  if (!chat) return;
  const msg = chat.messages.find(m => m.id === msgId);
  if (!msg || msg._starredOnce) return;
  if (!batchSelectMode) {
    enterBatchSelectMode(msgId);
  } else {
    toggleBatchSelect(msgId);
  }
}

// ── v2.0: Batch select mode ──
function enterBatchSelectMode(initMsgId) {
  batchSelectMode = true;
  batchSelectedIds = [initMsgId];
  renderChatMessages();
}

function toggleBatchSelect(msgId) {
  const chat = getActiveChatObj();
  if (!chat) return;
  const msg = chat.messages.find(m => m.id === msgId);
  if (!msg) return;
  // Allow toggling even for starred-once in batch mode — just skip confirmation for them
  const idx = batchSelectedIds.indexOf(msgId);
  if (idx >= 0) {
    batchSelectedIds.splice(idx, 1);
  } else {
    batchSelectedIds.push(msgId);
  }
  if (batchSelectedIds.length === 0) {
    exitBatchSelectMode();
    return;
  }
  renderChatMessages();
}

function exitBatchSelectMode() {
  batchSelectMode = false;
  batchSelectedIds = [];
  renderChatMessages();
}

async function confirmBatchStar() {
  const chat = getActiveChatObj();
  if (!chat) return;

  // Collect selected messages, split new vs already-starred
  const allSelected = batchSelectedIds
    .map(id => chat.messages.find(m => m.id === id))
    .filter(Boolean);
  const newMsgs = allSelected.filter(m => !m._starredOnce);
  const alreadyStarredCount = allSelected.length - newMsgs.length;

  if (newMsgs.length === 0) {
    exitBatchSelectMode();
    toast('所选消息均已星标过');
    return;
  }

  // Build preview of NEW messages
  const previewTexts = newMsgs.slice(0, 3).map(m =>
    (m.role === 'user' ? '用户' : 'AI') + ': ' + (m.text || '').slice(0, 40) + ((m.text || '').length > 40 ? '…' : '')
  );
  const preview = previewTexts.join('<br>') + (newMsgs.length > 3 ? '<br><span style="font-size:11px;color:var(--text-lighter);">等' + newMsgs.length + '条</span>' : '');
  const note = alreadyStarredCount > 0 ? `<div style="font-size:11px;color:var(--text-lighter);margin-bottom:8px;">（已跳过 ${alreadyStarredCount} 条已星标消息）</div>` : '';

  const newMsgIds = newMsgs.map(m => m.id);

  showModal('存为星标记忆', `
    ${note}
    <div style="font-size:12px;color:var(--text-light);margin-bottom:8px;">将保存 ${newMsgs.length} 条新消息：</div>
    <div style="font-size:12px;color:var(--text);line-height:1.5;margin-bottom:12px;padding:8px;background:var(--bg);border-radius:8px;">${preview}</div>
    <input type="hidden" id="batchStarMsgIds" value="${JSON.stringify(newMsgIds).replace(/"/g,'&quot;')}">
  `, [
    { label: 'cancel', cls: 'cancel', onclick: closeModal },
    { label: 'confirm', cls: 'confirm', onclick: executeBatchStar }
  ]);
}

async function executeBatchStar() {
  closeModal();
  const idsStr = $('batchStarMsgIds').value;
  let selectedMsgIds;
  try { selectedMsgIds = JSON.parse(idsStr.replace(/&quot;/g,'"')); } catch { exitBatchSelectMode(); return; }

  await createUserStarredMemory(selectedMsgIds);
  exitBatchSelectMode();
}

async function createUserStarredMemory(selectedMsgIds) {
  const chat = getActiveChatObj();
  const proj = getActiveProject();
  if (!chat || !proj) return;

  const msgs = selectedMsgIds.map(id => chat.messages.find(m => m.id === id)).filter(Boolean);
  if (msgs.length === 0) return;

  // Build rawDialogue
  const rawDialogue = msgs.map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    text: m.text || '',
    time: m.time || '',
    msgId: m.id || ''
  }));

  // Mark messages as starred-once (irreversible)
  msgs.forEach(m => { m._starredOnce = true; m._starred = true; });

  // LLM summary
  const summary = await generateStarredMemorySummary(rawDialogue);

  // Create USM entry
  const usmId = 'usm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
  const usm = {
    id: usmId,
    timestamp: new Date().toISOString(),
    sourceChatId: store.activeChat,
    sourceWindowId: store.activeChat,
    sourceProjectId: store.activeProject,
    rawDialogue,
    summary,
    starredMsgIds: selectedMsgIds,
    userNote: ''
  };

  store.memorySystem.coreMemoryLayers.userStarredMemories.unshift(usm);

  // Also add to project memories for backward compat
  proj.memories.push({
    id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    content: summary,
    date: fmtDate().iso, type: 'starred', starred: true,
    sourceChatId: store.activeChat, week: weekLabel(),
    decayFactor: 1.0, affectLabel: null, affectIntensity: null,
    semanticKey: null, isCompressed: false, compressedFrom: [],
    lastAccessed: fmtDate().iso, isCoreMemory: false, coreMemoryId: null
  });

  // Write memory file + trigger derivation
  writeMemoryFile(store.activeProject, store.activeChat, null, 'starred_added');
  checkDeriveInsightsTrigger('usm');

  saveStore();
  toast('✦ 已保存星标记忆：' + summary);
}

async function generateStarredMemorySummary(rawDialogue) {
  if (!store.apiKey) return '星标记忆';
  const dialogueText = rawDialogue
    .map(m => `${m.role === 'user' ? '用户' : 'AI'}：${(m.text || '').slice(0, 150)}`)
    .join('\n');

  try {
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey, endpoint: store.apiEndpoint, model: store.aiSettings.model,
        messages: [
          { role: 'system', content: '你是一个记忆归档员。用一句话（15字以内）概括以下对话的核心内容，不加引号，不加标点符号结尾。' },
          { role: 'user', content: dialogueText }
        ]
      })
    });
    if (!response.ok) return '星标记忆';
    const data = await response.json();

  } catch (e) {

  }
}

// ==================== SENTENCE SPLITTING ====================

/**
 * Split text into sentences by Chinese and English punctuation.
 * Returns an array of sentence strings (punctuation kept).
 */
function splitSentences(text) {
  if (!text || !text.trim()) return [];
  // Match segments that end with sentence-ending punctuation,
  // or the final segment without punctuation.
  const re = /[^。！？\.!\?\n]+[。！？\.!\?\n]+|[^。！？\.!\?\n]+$/g;
  const sentences = [];
  let match;
  while ((match = re.exec(text)) !== null) {
    const s = match[0].trim();
    if (s) sentences.push(s);
  }
  // If nothing matched (no recognizable punctuation), use whole text
  if (sentences.length === 0 && text.trim()) {
    sentences.push(text.trim());
  }
  return sentences;
}

/**
 * Display sentences one by one as separate chat messages with typing delays.
 * Each sentence becomes its own bubble, simulating a natural chat rhythm.
 */
async function displaySentences(sentences, chat, startTime) {
  const typingArea = $('chatTypingArea');
  const messagesEl = $('chatMessages');

  for (let i = 0; i < sentences.length; i++) {
    // Show typing indicator between sentences (skip before first)
    if (i > 0) {
      typingArea.innerHTML = '<div class="typing-indicator">对方正在输入中<span class="streaming-cursor">|</span></div>';
      // Variable delay: 400-900ms between sentences
      await new Promise(r => setTimeout(r, 400 + Math.random() * 500));
    }
    typingArea.innerHTML = '';

    // Push this sentence as a separate message
    chat.messages.push({ role: 'ai', text: sentences[i], time: startTime });
    renderChatMessages();

    // Scroll to bottom
    if (messagesEl) messagesEl.scrollTop = messagesEl.scrollHeight;

    // Small gap after each sentence for readability
    if (i < sentences.length - 1) {
      await new Promise(r => setTimeout(r, 150));
    }
  }
}

async function sendMessage(){

    if (store._pendingHandoff && store._pendingHandoff.package) {
      const ho = store._pendingHandoff;
      if (ho.recentMessages && ho.recentMessages.length > 0) {
        const hoMsgs = ho.recentMessages.map(m => ({

        inheritedMsgs = [...hoMsgs, ...inheritedMsgs];
      }
      writeMemoryFile(p.id, cid, ho.package, 'context_handoff_inherited');
      store._pendingHandoff = null;
    }

    // Step 5: Build new chat with inherited context
    const initMessages = [];
    if (inheritedMsgs.length > 0) {
      initMessages.push({

      });
      // Add ID to inherited messages
      for (const im of inheritedMsgs) {
        if (!im.id) im.id = 'msg_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
        initMessages.push(im);
      }
    }

    p.chats.push({
