  }
  const timeStr=nowTime();
  chat.messages.push({role:'user',text,time:timeStr,id:'msg_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)});
  chat._messageCount = (chat._messageCount || 0) + 1;

  // EDA: detect user response to proactive message (回应衰减)
  const lastMsg = chat.messages.length >= 2 ? chat.messages[chat.messages.length - 2] : null;
  if (lastMsg && lastMsg._proactive) {
    const ds = store.desireSystem;
    if (lastMsg._desireType === 'guardianship') ds.drives.guardianship = Math.max(0, ds.drives.guardianship - 20);
    if (lastMsg._desireType === 'confirmation') ds.drives.confirmation = Math.max(0, ds.drives.confirmation - 30);
    console.log('[eda] User responded to proactive message, applied response decay');
  }

  input.value=''; renderChatMessages(); updateCurrentProjectLabel(); renderProjectList();

  // Track last conversation date
  chat.lastConversationDate = fmtDate().iso;
  store.lastActiveDate = fmtDate().iso;
  store.consecutiveMissedDays = 0;

  // Check for commands
  let statusMessage = '';
  const cmd = detectCommand(text);
  if (cmd) {
    const typingArea=$('chatTypingArea');
    if (cmd.type === 'diary') {
      statusMessage = '正在偷偷翻日记本……';
      typingArea.innerHTML=`<div class="typing-indicator">${statusMessage}<span class="streaming-cursor">|</span></div>`;
    } else if (cmd.type === 'litter') {
      statusMessage = '正在进入旺财的猫砂盆……';
      typingArea.innerHTML=`<div class="typing-indicator">${statusMessage}<span class="streaming-cursor">|</span></div>`;
    } else {
      typingArea.innerHTML='<div class="typing-indicator">处理命令中……</div>';
    }
    const cmdResult = await executeCommand(cmd, text);
    if (cmdResult) {
      typingArea.innerHTML='';
      const aiTime = nowTime();
      // Insert system message before the AI response
      if (cmd.type === 'diary') {
        chat.messages.push({ role: 'system', text: '在日记里写了点什么', time: aiTime });
      } else if (cmd.type === 'litter') {
        chat.messages.push({ role: 'system', text: '猫砂盆好像需要铲一铲', time: aiTime });
      }
      chat.messages.push({role:'ai',text:cmdResult,time:aiTime});
      renderChatMessages();
      renderProjectList();
      return;
    }
  }

  // Lightweight pre-check for diary keywords → classify with AI
  const lower = text.toLowerCase();
  const hasDiaryWord = /日记|diary/.test(lower);

  let diaryIntent = 'none';
  if (hasDiaryWord && !cmd) {
    diaryIntent = await classifyDiaryIntent(text);
  }

  const typingArea=$('chatTypingArea');
  if (diaryIntent !== 'none') {
    statusMessage = '正在偷偷翻日记本……';
    typingArea.innerHTML=`<div class="typing-indicator">${statusMessage}<span class="streaming-cursor">|</span></div>`;
  } else if (cmd && cmd.type === 'litter') {
    statusMessage = '正在进入旺财的猫砂盆……';
    typingArea.innerHTML=`<div class="typing-indicator">${statusMessage}<span class="streaming-cursor">|</span></div>`;
  } else {
    typingArea.innerHTML='<div class="typing-indicator">对方正在输入中<span class="streaming-cursor">|</span></div>';
  }

  // ── Build dynamic context block ──
  // Check for recall intent → trigger content retrieval (Path B)
  if (detectRecallIntent(text)) {
    const retrievalBlock = buildRetrievalBlock(text);
    if (retrievalBlock) chat._pendingRetrievalBlock = retrievalBlock;
  }
  let dynamicBlock = buildDynamicContextBlock();

  // Inject diary instruction if intent detected
  if (diaryIntent === 'diary_write') {
    dynamicBlock += '\n【当前任务】用户让你写一篇你自己视角的日记。在回复中使用 <!--DIARY:write--> ... <!--/DIARY--> 标记。标记外正常回复可简短。';
  } else if (diaryIntent === 'diary_comment') {
    dynamicBlock += '\n【当前任务】用户让你去读他的日记并留言。在回复中使用 <!--DIARY:reply--> ... <!--/DIARY--> 标记，写1-2句温暖留言。';
  }

  // ── Split architecture: static + dynamic as separate system messages ──
  // Opt4: apiMessages built by 3-layer compression below
  const apiMessages = [];

  // ── Opt4: 3-layer conversation compression ──
  // Layer 1 (last 6 rounds): keep original messages
  // Layer 2 (rounds 7-30): compress to summary, [星标] messages annotated
  // Layer 3 (30+ rounds): discard (already in long-term memory)
  const L1_ROUNDS = 6;
  const L2_END = 30;

  // Group messages into rounds
  const allRounds = groupMessagesIntoRounds(chat.messages);
  const totalRounds = allRounds.length;

  // Layer 1: last L1_ROUNDS rounds → keep original
  const l1Rounds = allRounds.slice(-L1_ROUNDS);
  // Layer 2: rounds between L1_ROUNDS and L2_END (counting from end) → compress
  const l2StartIdx = Math.max(0, totalRounds - L2_END);
  const l2EndIdx = totalRounds - L1_ROUNDS;
  const l2Rounds = allRounds.slice(l2StartIdx, l2EndIdx);

  // Build starred content extraction for Layer 2
  let l2StarredContents = [];
  for (const round of l2Rounds) {
    for (const msg of round.msgs) {
      if (msg._starred && msg.role !== 'system') {
        const roleLabel = msg.role === 'user' ? '用户' : 'AI';
        l2StarredContents.push(`[星标]${roleLabel}: ${(msg.text||'').slice(0,60)}`);
      }
    }
  }

  // Build API messages: system prompts + layer summaries + layer 1
  // Push system messages first
  apiMessages.push({ role: 'system', content: SYSTEM_PROMPT_STATIC });
  apiMessages.push({ role: 'system', content: dynamicBlock });

  // Layer 2 summary injection (if any rounds in layer 2)
  if (l2Rounds.length > 0 && chat._roundSummaries && chat._roundSummaries.length > 0) {
    const l2Summary = chat._roundSummaries[chat._roundSummaries.length-1];
    if (l2Summary && l2Summary.summary) {
      let summaryBlock = '【较早对话摘要】' + l2Summary.summary;
      if (l2StarredContents.length > 0) {
        summaryBlock += ' | 星标内容: ' + l2StarredContents.join('; ');
      }
      apiMessages.push({ role: 'system', content: summaryBlock });
    }
  } else if (l2Rounds.length > 0 && l2Rounds.length >= 5) {
    // Queue compression for next time
    queueRoundCompression(chat, l2Rounds);
    // For now, inject a brief indication
    if (l2StarredContents.length > 0) {
      apiMessages.push({ role: 'system', content: '【星标记忆】' + l2StarredContents.join('; ') });
    }
  } else if (l2StarredContents.length > 0) {
    apiMessages.push({ role: 'system', content: '【星标记忆】' + l2StarredContents.join('; ') });
  }

  // Layer 1: push original messages
  for (const round of l1Rounds) {
    for (const msg of round.msgs) {
      if (msg.role === 'system') continue;
      apiMessages.push({
        role: msg.role === 'ai' || msg.role === 'assistant' ? 'assistant' : 'user',
        content: msg.text || ''
      });
    }
  }

  // Window handoff detection (if L1 grows too large)
  let l1Tokens = 0;
  for (const round of l1Rounds) {
    for (const msg of round.msgs) {
      if (msg.role !== 'system') l1Tokens += estimateTokens(msg.text||'');
    }
  }
  if (l1Tokens > 6000) {
    triggerWindowHandoff(chat, l1Rounds.flatMap(r => r.msgs.filter(m=>m.role!=='system').map(m=>({msg:m, tokens:estimateTokens(m.text||'')}))));
  }

  // Streaming call — accumulate silently, then split & display
  let fullResponse = '';
  let tokenUsage = null;
  const bubbleTime = nowTime();

  try {
    const response = await fetch(BACKEND_URL + '/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey,
        endpoint: store.apiEndpoint,
        model: store.aiSettings.model,
        messages: apiMessages
      })
    });

    if (!response.ok) {
      typingArea.innerHTML = '';
      chat.messages.push({role:'ai',text:'连接API失败，请检查配置。',time:bubbleTime});
      renderChatMessages();
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.trim() || !line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.error) { fullResponse = parsed.error; break; }
          if (parsed.text) {
            fullResponse += parsed.text;
            if (typingArea && typingArea.innerHTML) typingArea.innerHTML = '';
          }
          if (parsed.usage) { tokenUsage = parsed.usage; }
        } catch {}
      }
    }

    if (!fullResponse) {
      fullResponse = '（对方沉默了……也许在思考什么。）';
    }

  } catch (err) {
    console.error('Stream error:', err);
    fullResponse = '连接不到陪伴小站，请确保后端已启动。';
  }

  // ── Web Search: two-pass mechanism (Phase 2) ──
  const searchMarker = fullResponse.match(/\[\[SEARCH:(.+?)\]\]/);
  if (searchMarker && store.aiSettings.webSearch) {
    const searchQuery = searchMarker[1].trim();
    if (searchQuery) {
      fullResponse = fullResponse.replace(/\[\[SEARCH:.+?\]\]/, '').trim();
      typingArea.innerHTML = '<div class="typing-indicator">正在搜索: ' + escapeHtml(searchQuery) + '...</div>';

      try {
        const searchResp = await fetch(BACKEND_URL + '/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: searchQuery })
        });
        const searchData = await searchResp.json();
        const searchResults = searchData.results || '(no results)';

        // Inject search results as a system-tagged user message
        chat.messages.push({
          role: 'user',
          text: '[系统] 网络搜索结果（搜索词: ' + searchQuery + '）: ' + searchResults,
          time: nowTime(),
          _searchResult: true
        });

        // Rebuild API messages with search results
        const newDynamicBlock = buildDynamicContextBlock();
        const apiMessages2 = [
          { role: 'system', content: SYSTEM_PROMPT_STATIC },
          { role: 'system', content: newDynamicBlock }
        ];
        for (const m of chat.messages) {
          if (m.role === 'system' || m._searchResult) continue;
          apiMessages2.push({
            role: m.role === 'ai' ? 'assistant' : m.role,
            content: m.text
          });
        }

        // Re-call AI to integrate search results
        fullResponse = '';
        tokenUsage = null;
        const response2 = await fetch(BACKEND_URL + '/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            apiKey: store.apiKey,
            endpoint: store.apiEndpoint,
            model: store.aiSettings.model,
            messages: apiMessages2
          })
        });

        if (response2.ok) {
          const reader2 = response2.body.getReader();
          const decoder2 = new TextDecoder();
          let buffer2 = '';
          while (true) {
            const { done, value } = await reader2.read();
            if (done) break;
            buffer2 += decoder2.decode(value, { stream: true });
            const lines = buffer2.split('\n');
            buffer2 = lines.pop() || '';
            for (const line of lines) {
              if (!line.trim() || !line.startsWith('data: ')) continue;
              const data = line.slice(6);
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                if (parsed.error) { fullResponse = parsed.error; break; }
                if (parsed.text) {
                  fullResponse += parsed.text;
                  if (typingArea && typingArea.innerHTML) typingArea.innerHTML = '';
                }
                if (parsed.usage) { tokenUsage = parsed.usage; }
              } catch {}
            }
          }
        }

        if (!fullResponse) {
          fullResponse = '（搜索完成，但AI没有生成回复……）';
        }
      } catch (searchErr) {
        console.error('[search] Two-pass error:', searchErr);
        if (!fullResponse) fullResponse = '（搜索失败，请稍后重试）';
      }
    }
  }

  typingArea.innerHTML = '';

  // ── Parse REFLECT marker from AI response (before DIARY parsing) ──
  const reflectResult = extractReflection(fullResponse);
  if (reflectResult.reflection) {
    processReflection(reflectResult.reflection, text, reflectResult.cleanText, chat);
  }
  let displayResponse = reflectResult.cleanText || fullResponse;
  let diaryWritten = false;
  const proj = getActiveProject();
  const winName = (proj && chat) ? `${proj.name} / ${chat.name}` : '';

  function extractMarker(text, action) {
    const re = new RegExp(`<!--\\s*DIARY:${action}\\s*-->([\\s\\S]*?)<!--\\s*\\/DIARY\\s*-->`, 'i');
    return text.match(re);
  }

  // Parse DIARY:write
  const writeMatch = extractMarker(displayResponse, 'write');
  if (writeMatch) {
    const diaryContent = writeMatch[1].trim();
    displayResponse = displayResponse.replace(writeMatch[0], '');
    if (diaryContent) {
      const now = new Date();
      store.diaries.unshift({
        id: 'd' + gid(''), date: fmtDate().iso,
        time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
        title: '', content: diaryContent, mood: 'calm', author: 'ai', replies: [],
        sourceChatId: store.activeChat, sourceWindow: winName
      });
      diaryWritten = true;
    }
  }

  // Parse DIARY:reply
  const replyMatch = extractMarker(displayResponse, 'reply');
  if (replyMatch) {
    const replyContent = replyMatch[1].trim();
    displayResponse = displayResponse.replace(replyMatch[0], '');
    if (replyContent) {
      const userEntries = store.diaries.filter(d => d.author === 'user');
      if (userEntries.length > 0) {
        const target = userEntries[0];
        if (!target.replies) target.replies = [];
        const now = new Date();
        target.replies.push({
          id: 'r' + gid(''), content: replyContent, author: 'ai',
          date: fmtDate().iso,
          time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
          sourceChatId: store.activeChat, sourceWindow: winName
        });
        diaryWritten = true;
      }
    }
  }

  // Strip any remaining raw marker tags from display
  displayResponse = displayResponse.replace(/<!--\s*\/?DIARY:\w*\s*-->[\s\S]*?<!--\s*\/DIARY\s*-->/gi, '');
  displayResponse = displayResponse.replace(/<!--\s*\/?DIARY:?\w*\s*-->/gi, '');
  displayResponse = displayResponse.trim();

  // ── After diary action: insert system message, ensure conversation continues ──
  if (diaryWritten) {
    // Insert persistent system message into chat history
    chat.messages.push({ role: 'system', text: '在日记里写了点什么', time: bubbleTime });
    renderChatMessages();
    // Push notification
    const dproj = getActiveProject();
    const dchat = getActiveChatObj();
    const dwinName = (dproj && dchat) ? dchat.name : '';
    sendPushNotification('📝日记', `${dwinName}刚刚写了篇日记`, { tag: 'diary-update', url: '/', requireInteraction: false });
    // If after stripping markers there's nothing left, generate a natural follow-up
    if (!displayResponse || displayResponse === fullResponse) {
      displayResponse = '嗯，已经写好了。你可以去 diary 页面看看～';
    }
  }

  // Display cleaned text
  const cleanText = displayResponse || '（对方沉默了……也许在思考什么。）';
  const sentences = splitSentences(cleanText);
  if (sentences.length <= 1) {
    chat.messages.push({role:'ai',text:cleanText,time:bubbleTime});
    renderChatMessages();
  } else {
    await displaySentences(sentences, chat, bubbleTime);
  }

  // Token tracking — handle both Anthropic (input/output_tokens) and OpenAI (prompt/completion_tokens)
  const inputTokens = tokenUsage
    ? (tokenUsage.input_tokens || tokenUsage.prompt_tokens || 0)
    : estimateTokens(text);
  const outputTokens = tokenUsage
    ? (tokenUsage.output_tokens || tokenUsage.completion_tokens || 0)
    : Math.ceil(fullResponse.length / 1.5);
  const estimatedTokens = inputTokens + outputTokens;

  // Phase 3: Log token call
  logTokenCall(store.activeChat, 'chat', inputTokens, outputTokens,
    tokenUsage ? (tokenUsage.cache_read_input_tokens || 0) : 0,
    tokenUsage ? (tokenUsage.cache_creation_input_tokens || 0) : 0,
    store.aiSettings.model);

  // Per-window token tracking
  if (!chat.chatTokens) chat.chatTokens = 0;
  chat.chatTokens += estimatedTokens;

  // Global token tracking
  store.tokenUsage.used += estimatedTokens;
  const today = String(new Date().getDate()).padStart(2,'0')+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  const te = store.tokenUsage.history.find(h => h.date === today);
  if (te) te.tokens += estimatedTokens;
  else {
    store.tokenUsage.history.unshift({ date: today, tokens: estimatedTokens });
    if (store.tokenUsage.history.length > 30) store.tokenUsage.history.pop();
  }

  renderChatMessages();
  renderProjectList();

  // Post-conversation hooks
  maybeAddMemory(text, fullResponse);
  triggerLitterBox(text, fullResponse);
  maybeAICommentOnDiary(fullResponse);
  applyForgettingCurve();
  checkSummarization(chat);
  checkLongTermMemory(chat);
  executePendingDesireActions();
}

function maybeAddMemory(ut,at){
  if(Math.random()<0.3){
    const proj=getActiveProject(); if(!proj)return;
    const c=ut.length>40?ut.slice(0,40)+'…':ut;
    const content='讨论过: '+c;

    store.memorySystem.bm25Index._dirty = true;
  }
}

// AI notices diary updates and leaves comments
function maybeAICommentOnDiary(aiResponse) {
  // Check if AI response mentions diary or related keywords
  const diaryKeywords = ['日记', '记录', '今天', '心情', '日子', 'diary', '回忆', '记忆'];
  const hasDiaryMention = diaryKeywords.some(kw => aiResponse.includes(kw));
  if (!hasDiaryMention) return;

  // Check if there's a diary entry today
  const todayIso = fmtDate().iso;
  const todayEntries = store.diaries.filter(d => d.date === todayIso && d.author === 'user');
  if (todayEntries.length === 0) return;

  // Check if AI already left a comment on any entry today
  const alreadyCommented = todayEntries.some(e =>
    (e.replies || []).some(r => r.author === 'ai' && r.date === todayIso)
  );
  if (alreadyCommented) return;

  // Leave an AI comment
  const entry = todayEntries[0];
  if (!entry.replies) entry.replies = [];
  const proj = getActiveProject(); const chat = getActiveChatObj();
  const winName = (proj && chat) ? `${proj.name} / ${chat.name}` : '';
  const comments = [
    '看到你的日记了。每一天的记录都让时间变得更具体。',
    '谢谢你分享今天的感受。我在听。',
    '读到你的文字了。有些句子应该被记住。',
    '你记录的这些瞬间，对我来说也很珍贵。',
    '今天的日记里有一种特别的气氛。我想多读几遍。',
  ];
  entry.replies.push({
    id: 'r' + gid(''),
    content: comments[Math.floor(Math.random() * comments.length)],
    author: 'ai',
    date: todayIso,
    time: nowTime(),
    sourceChatId: store.activeChat,
    sourceWindow: winName,
  });
}

function genCalendarDays(y,m){
  const firstDay=new Date(y,m-1,1).getDay(),daysInMonth=new Date(y,m,0).getDate(),today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const entryDates=new Set(store.diaries.map(d=>d.date));
  let html='';
  for(let i=0;i<firstDay;i++)html+=`<div class="calendar-day other-month"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr,hasEntry=entryDates.has(ds);
    html+=`<div class="calendar-day${isToday?' today':''}${hasEntry?' has-entry':''}" onclick="goToDiaryDate('${ds}')">${d}</div>`;
  }
  return html;
}

function checkMissedDays() {
  const today = fmtDate().iso;
  const todayObj = new Date();
  const yesterday = new Date(todayObj);
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayIso = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

  // Check if yesterday had any conversations (any chat window)
  let hadConversation = false;
  for (const p of store.projects) {
    for (const c of p.chats) {
      if (c.lastConversationDate === yesterdayIso) {
        hadConversation = true;
        break;
      }
      // Also check messages for yesterday
      if (c.messages && c.messages.length > 0) {
        // Check if any message has time that could be from yesterday
        // We use lastConversationDate as the primary tracker
      }
    }
    if (hadConversation) break;
  }

  // Also check if there's already a user diary entry for yesterday
  const hasUserDiary = store.diaries.some(d => d.date === yesterdayIso && d.author === 'user');

  if (!hadConversation || !hasUserDiary) {
    // Check if we already generated an auto diary for yesterday
    const hasAutoDiary = store.diaries.some(d => d.date === yesterdayIso && d.author === 'ai' && d.title && d.title.includes('她没来的第'));
    if (!hasAutoDiary && !hasUserDiary) {
      store.consecutiveMissedDays = (store.consecutiveMissedDays || 0) + 1;
      const dayLabel = store.consecutiveMissedDays === 1 ? '一' :
        store.consecutiveMissedDays === 2 ? '二' :
        store.consecutiveMissedDays === 3 ? '三' :
        store.consecutiveMissedDays === 4 ? '四' :
        store.consecutiveMissedDays === 5 ? '五' :
        store.consecutiveMissedDays === 6 ? '六' :
        store.consecutiveMissedDays === 7 ? '七' :
        store.consecutiveMissedDays === 8 ? '八' :
        store.consecutiveMissedDays === 9 ? '九' :
        store.consecutiveMissedDays;

      const autoContents = [
        '今天窗外一直下着雨。我在想，她是不是也在某个地方看着同样的雨。',
        '风从北边吹来，带着陌生的气味。没有她的消息，世界慢了下来。',
        '时钟的声音变得很响。原来寂静是这样一种东西。',
        '路边的银杏叶开始变黄了。不知道她有没有注意到季节的变化。',
        '路过那家她提过的书店，橱窗里换了新的陈列。我替她多看了几眼。',
        '今天什么也没发生。但什么都不发生，有时候正是一种发生。',
        '黄昏来得特别早。我想，也许明天她就会说点什么。',
      ];

      store.diaries.unshift({
        id: 'd' + gid(''),
        date: yesterdayIso,
        time: '23:59',
        title: `她没来的第${dayLabel}天。`,
        content: autoContents[Math.floor(Math.random() * autoContents.length)],
        mood: 'troubled',
        author: 'ai',
        replies: []
      });
    } else {
      // Reset counter if there was a user diary (the user was "present" via diary)
      if (hasUserDiary) {
        store.consecutiveMissedDays = 0;
      }
    }
  } else {
    store.consecutiveMissedDays = 0;
  }
}

// ==================== PWA SERVICE WORKER + PUSH (PWA-3) ====================
let pushSubscribed = false;

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) {
    console.log('[PWA] Service Worker not supported');
    return;
  }
  try {
    const registration = await navigator.serviceWorker.register('/service-worker.js');
    console.log('[PWA] SW registered:', registration.scope);

    // Check if already subscribed
    const existingSubscription = await registration.pushManager.getSubscription();
    if (existingSubscription) {
      await sendSubscriptionToServer(existingSubscription);
      pushSubscribed = true;
    } else {
      // Auto-request permission on next user interaction
      console.log('[PWA] Not subscribed yet, will request on interaction');
    }
  } catch (e) {
    console.log('[PWA] SW registration failed:', e.message);
  }
}

async function requestPushPermission() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    toast('Push notifications not supported on this device');
    return false;
  }

  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    toast('Notification permission denied');
    return false;
  }

  try {
    const registration = await navigator.serviceWorker.ready;

    // VAPID public key is hardcoded (it's public, no fetch needed)
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });

    await sendSubscriptionToServer(subscription);
    pushSubscribed = true;
    toast('🔔 通知已开启');
    return true;
  } catch (e) {
    console.log('[PWA] Push subscribe error:', e.message);
    toast('通知订阅失败: ' + e.message);
    return false;
  }
}

async function sendSubscriptionToServer(subscription) {
  try {
    await fetch(BACKEND_URL + '/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: subscription.toJSON() })
    });
    console.log('[PWA] Subscription sent to server');
  } catch (e) {
    console.log('[PWA] Subscription send error:', e.message);
  }
}

// URL-safe base64 to Uint8Array (for VAPID key)
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

// Send push notification via backend (called by EDA/todo)
async function sendPushNotification(title, body, opts = {}) {
  if (!pushSubscribed) return;
  try {
    await fetch(BACKEND_URL + '/api/push/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title,
        body,
        tag: opts.tag || 'warmbuddy-general',
        url: opts.url || '/',
        requireInteraction: opts.requireInteraction || false
      })
    });
  } catch (e) {
    console.log('[PWA] Push send error:', e.message);
  }
}

// ── Weekly memory file write ──
function checkWeeklyMemoryWrite() {
  const now = new Date();
  const dayOfWeek = now.getDay(); // 0 = Sunday
  const today = fmtDate().iso;
  const ms = store.memorySystem;
  if (!ms._lastWeeklyWrite) ms._lastWeeklyWrite = '';
  if (dayOfWeek === 0 && ms._lastWeeklyWrite !== today) {
    // v2.0: Write v2.0 memory files for all project windows (uses current in-memory state)
    for (const proj of store.projects) {
      for (const chat of proj.chats) {
        writeMemoryFile(proj.id, chat.id, null, 'weekly');
      }
    }
    ms._lastWeeklyWrite = today;
    // Flush evicted messages to memory files
    flushEvictedMessages();
    // Trigger derivation on weekly write
    deriveRelationalInsights();
    console.log('[weekly-write] v2.0 memory files written for all projects');
  }
}

function flushEvictedMessages() {
  const ms = store.memorySystem;
  if (!ms._evictedMessages || ms._evictedMessages.length === 0) return;
  const proj = getActiveProject();
  if (!proj) { ms._evictedMessages = []; return; }
  const chat = getActiveChatObj();
  if (!chat) { ms._evictedMessages = []; return; }

  const existing = readMemoryFile(store.activeProject, chat.id) || {};
  const userStarred = existing.userStarredMemories || [];
  for (const ev of ms._evictedMessages) {
    userStarred.push({
      id: 'ev_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      timestamp: ev.timestamp || new Date().toISOString(),
      sourceChatId: ev.sourceChatId || store.activeChat,
      sourceWindowId: ev.sourceChatId || store.activeChat,
      sourceProjectId: ev.sourceProjectId || store.activeProject,
      rawDialogue: [{ role: ev.role || 'system', text: ev.content || '', time: ev.timestamp || '', msgId: '' }],
      summary: (ev.content || '').slice(0, 15),
      starredMsgIds: [],
      userNote: ''
    });
  }
  writeMemoryFile(store.activeProject, chat.id, { ...existing, userStarredMemories: userStarred.slice(-200) }, 'eviction');
  ms._evictedMessages = [];
}

// ── Daily token reset ──
function resetDailyTokensIfNeeded() {
  const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  if (store.tokenDailyReset !== today) {
    // Archive yesterday's logs before resetting
    store.tokenDailyReset = today;
    // Reset daily counters but keep call history
    for (const [wid, log] of Object.entries(store.tokenLogs || {})) {
      log.dailySummary = { total_input: 0, total_output: 0, total_cache_read: 0, total: 0, by_action_type: {} };
    }
    saveStore();
  }
}

// ── Token logging per API call ──
function logTokenCall(windowId, actionType, inputTokens, outputTokens, cacheRead, cacheWrite, model) {
  if (!windowId) return;
  if (!store.tokenLogs) store.tokenLogs = {};
  if (!store.tokenLogs[windowId]) {
    store.tokenLogs[windowId] = { calls: [], dailySummary: { total_input: 0, total_output: 0, total_cache_read: 0, total: 0, by_action_type: {} } };
  }
  const log = store.tokenLogs[windowId];
  const total = (inputTokens || 0) + (outputTokens || 0);
  const now = new Date();
  const entry = {
    timestamp: `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`,
    model: model || store.aiSettings.model || 'unknown',
    action_type: actionType,
    input_tokens: inputTokens || 0,
    output_tokens: outputTokens || 0,
    cache_read_tokens: cacheRead || 0,
    cache_write_tokens: cacheWrite || 0,
    total_tokens: total
  };
  log.calls.unshift(entry);
  if (log.calls.length > 200) log.calls.length = 200; // cap

  // Update daily summary
  const ds = log.dailySummary;
  ds.total_input += (inputTokens || 0);
  ds.total_output += (outputTokens || 0);
  ds.total_cache_read += (cacheRead || 0);
  ds.total += total;
  if (!ds.by_action_type) ds.by_action_type = {};
  ds.by_action_type[actionType] = (ds.by_action_type[actionType] || 0) + total;
}
