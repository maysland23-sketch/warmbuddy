  const blob=new Blob([e.jsonData],{type:'application/json'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`memory-${wk}-${cid}.json`; a.click(); URL.revokeObjectURL(url); toast('JSON 已下载');
}

// ==================== JSON IMPORT (P3) ====================
function handleMemoryImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      importMemoriesJSON(data);
    } catch (err) {
      toast('Invalid JSON file');
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // reset
}

function importMemoriesJSON(data) {
  // Normalize to array of memory objects
  let memories = [];
  if (Array.isArray(data)) {
    memories = data;
  } else if (data.memories && Array.isArray(data.memories)) {
    memories = data.memories; // weekly export format
  } else if (data.coreMemories && Array.isArray(data.coreMemories)) {
    // Core memory import — map to memory format
    memories = data.coreMemories.map(cm => ({
      content: cm.event_summary || cm.raw_quote || '(core memory)',
      type: 'core',
      date: cm.timestamp ? cm.timestamp.slice(0, 10) : fmtDate().iso,
      starred: false,
      affectLabel: cm.affect_first && cm.affect_first.user ? cm.affect_first.user.label : null,
      affectIntensity: cm.affect_first && cm.affect_first.user ? cm.affect_first.user.intensity : null,
      relationalNote: cm.relational_note || ''
    }));
  }

  if (memories.length === 0) {
    toast('No valid memories found in file');
    return;
  }

  // Show preview with checkboxes
  const proj = getActiveProject();
  const chat = getActiveChatObj();
  const chats = proj ? proj.chats : [];

  let previewHtml = `<div style="font-size:12px;color:var(--text-light);margin-bottom:8px;">Found ${memories.length} memories. Select target chat and memories to import:</div>`;
  previewHtml += `<select id="importTargetChat" style="width:100%;padding:8px;border-radius:10px;border:1px solid var(--border-light);margin-bottom:10px;font-size:13px;">`;
  previewHtml += chats.map(c => `<option value="${c.id}" ${c.id === (chat ? chat.id : '') ? 'selected' : ''}>${c.name}</option>`).join('');
  previewHtml += `</select>`;
  previewHtml += `<div class="import-preview-list">`;
  memories.forEach((m, i) => {
    const content = m.content || m.event_summary || JSON.stringify(m).slice(0, 80);
    previewHtml += `<div class="memory-list-item" style="cursor:pointer;" onclick="this.classList.toggle('checked-import')">
      <input type="checkbox" id="imp_${i}" checked style="flex-shrink:0;margin-top:2px;">
      <div style="flex:1;font-size:12px;">${content}</div>
    </div>`;
  });
  previewHtml += `</div>`;

  $('importPreview').innerHTML = previewHtml;

  // Show import button
  const importBtn = document.createElement('button');
  importBtn.textContent = '✓ Import Selected';
  importBtn.style.cssText = 'margin-top:10px;width:100%;padding:10px;border-radius:12px;border:none;background:var(--accent-soft);color:#fff;font-family:var(--font-en);font-size:12px;cursor:pointer;letter-spacing:0.04em;';
  importBtn.onclick = function() {
    const targetChatId = $('importTargetChat').value;
    const targetChat = getChatObjById(targetChatId);
    const proj2 = getActiveProject();
    if (!proj2 || !targetChat) { toast('Target chat not found'); return; }

    let imported = 0;
    memories.forEach((m, i) => {
      const cb = document.getElementById('imp_' + i);
      if (!cb || !cb.checked) return;
      const mid = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      proj2.memories.push({
        id: mid,
        content: m.content || m.event_summary || '',
        date: m.date || fmtDate().iso,
        type: m.type || 'imported',
        starred: m.starred || false,
        sourceChatId: targetChatId,
        week: weekLabel(new Date(m.date || Date.now())),
        decayFactor: 1.0,
        affectLabel: m.affectLabel || null,
        affectIntensity: m.affectIntensity || null,
        semanticKey: m.semanticKey || null,
        isCompressed: false, compressedFrom: [],
        lastAccessed: fmtDate().iso,
        isCoreMemory: m.type === 'core',
        coreMemoryId: null
      });
      if (!targetChat.sharedMemoryIds.includes(mid)) {
        targetChat.sharedMemoryIds.push(mid);
      }
      imported++;
    });
    toast(`Imported ${imported} memories`);
    $('importPreview').innerHTML = '';
    renderMemoryPanelBody();
    saveStore();
  };
  $('importPreview').appendChild(importBtn);
}

function getChatObjById(cid) {
  for (const p of store.projects) {
    for (const c of p.chats) {
      if (c.id === cid) return c;
    }
  }
  return null;
}

// ==================== MODALS ====================
// Uses event delegation (NOT inline onclick) to avoid stringification bugs.
function showModal(title, bodyHtml, actions) {
  $('modalTitle').innerHTML = title;
  $('modalBody').innerHTML = bodyHtml;
  // Store callbacks on the DOM element for the delegated click handler
  $('modalActions')._callbacks = actions.map(a => a.onclick);
  $('modalActions').innerHTML = actions.map((a, i) =>
    `<button class="modal-btn ${a.cls || 'cancel'}" data-modal-action="${i}">${a.label}</button>`
  ).join('');
  $('modalOverlay').classList.add('show');
  // Setup delegated listener once
  if (!$('modalActions')._listenerReady) {
    $('modalActions')._listenerReady = true;
    $('modalActions').addEventListener('click', function (e) {
      const btn = e.target.closest('.modal-btn');
      if (!btn || !this._callbacks) return;
      const idx = parseInt(btn.getAttribute('data-modal-action'));
      const fn = this._callbacks[idx];
      if (typeof fn === 'function') fn();
    });
  }
}
function closeModal() { $('modalOverlay').classList.remove('show'); }

// ==================== PROVIDER PRESETS ====================
async function loadPresets() {
  try {
    const resp = await fetch(BACKEND_URL + '/api/presets');
    const data = await resp.json();
    store.providerPresets = data.presets || [];
    // If no endpoint configured, set default preset
    if (!store.selectedPreset && store.providerPresets.length > 0) {
      store.selectedPreset = store.providerPresets[0].id;
      store.apiEndpoint = store.providerPresets[0].endpoint;
    }
  } catch (e) { console.error('Failed to load presets:', e); }
}

function selectPreset(presetId) {
  const preset = store.providerPresets.find(p => p.id === presetId);
  if (!preset) return;
  store.selectedPreset = presetId;
  store.apiEndpoint = preset.endpoint;
  $('apiEndpointInput').value = preset.endpoint;
  // Auto-select first model from this preset
  if (preset.models && preset.models.length > 0) {
    const currentInPreset = preset.models.includes(store.aiSettings.model);
    if (!currentInPreset) {
      store.aiSettings.model = preset.models[0];
      $('modelVal').textContent = preset.models[0];
    }
  }
  toast('Provider: ' + preset.label);
}

    <button class="test-conn-btn" id="testConnBtn" onclick="testConnection()">🔗 Test Connection</button>

function saveApiConfig(){
  store.apiKey=$('apiKeyInput').value; store.apiEndpoint=$('apiEndpointInput').value;

  const matchedPreset = store.providerPresets.find(p => p.endpoint === store.apiEndpoint);

  $('apiKeyStatus').textContent=store.apiKey?'●●●●●●●●'+store.apiKey.slice(-4):'●●●●●●●●';

  const preset = store.providerPresets.find(p => p.id === store.selectedPreset);
  $('apiEndpointVal').textContent = preset ? preset.label : (store.apiEndpoint ? 'custom' : 'not set');

// ==================== API TEST & MODELS ====================
async function testConnection() {
  const apiKey = $('apiKeyInput').value.trim();
  const endpoint = $('apiEndpointInput').value.trim();
  const model = store.aiSettings.model;

  if (!apiKey) { toast('Please enter an API key first'); return; }

  // Persist form values to store immediately so showApiModal() reads them back correctly
  store.apiKey = apiKey;
  store.apiEndpoint = endpoint;
  saveStore();

  const btn = $('testConnBtn');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '⏳ Testing...';
  store.connectionStatus = 'testing';

  try {
    const response = await fetch(BACKEND_URL + '/api/test-connection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey, endpoint, model })
    });
    const data = await response.json();
    store.connectionStatus = data;

    if (data.success && data.models && data.models.length > 0) {
      store.availableModels = data.models;
      // Auto-select first model if current not in list
      const currentExists = data.models.find(m => m.id === store.aiSettings.model);
      if (!currentExists && data.models.length > 0) {
        store.aiSettings.model = data.models[0].id;
      }
    }

    btn.textContent = data.success ? '✅ Connected! Test Again' : '❌ Failed — Try Again';
    btn.disabled = false;
    updateSettingsUI();
    toast(data.success ? 'Connection successful!' : 'Connection failed: ' + data.message);
  } catch (err) {
    store.connectionStatus = { success: false, provider: null, message: 'Network error: ' + err.message };
    btn.textContent = '❌ Error — Try Again';
    btn.disabled = false;
    toast('Network error');
  }

  // Refresh modal
  showApiModal();
}

async function fetchModelsFromAPI() {
  if (!store.apiKey) { toast('Please configure API key first'); return; }
  try {
    const response = await fetch(BACKEND_URL + '/api/models', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey: store.apiKey, endpoint: store.apiEndpoint })
    });
    const data = await response.json();
    if (data.success && data.models && data.models.length > 0) {
      store.availableModels = data.models;
      toast(`Loaded ${data.models.length} models from ${data.provider}`);
      // Re-show model modal with fresh data
      showModelModal();
    }
  } catch (err) {
    toast('Failed to fetch models');
  }
}

const PROVIDER_NAMES = { deepseek: '🔷 DeepSeek', anthropic: '🟠 Anthropic', openai: '🟢 OpenAI' };
const FORMAT_NAMES = { openai: 'OpenAI 格式', anthropic: 'Anthropic 格式' };

function showModelModal(){
  const models = store.availableModels && store.availableModels.length > 0
    ? store.availableModels
    : store.availableModels; // always use availableModels (already has defaults)

  // Group models by provider
  const groups = {};
  for (const m of models) {
    const p = m.provider || 'unknown';
    if (!groups[p]) groups[p] = [];
    groups[p].push(m);
  }

  const hasConnection = store.connectionStatus && store.connectionStatus.success;

  let bodyHtml = '';
  if (!hasConnection && !store.connectionStatus) {
    bodyHtml += `
      <div style="padding:10px 14px;border-radius:8px;background:var(--accent-pale);margin-bottom:12px;font-size:12px;color:var(--text-light);line-height:1.5;">
        💡 先配置 API 并 <b>测试连接</b>，然后从你的提供商加载可用模型。
      </div>`;
  }

  for (const [provider, providerModels] of Object.entries(groups)) {
    bodyHtml += `
      <div style="font-family:var(--font-en);font-size:10px;color:var(--text-lighter);margin:12px 0 6px;letter-spacing:0.04em;padding-left:2px;">${PROVIDER_NAMES[provider] || provider.toUpperCase()}</div>`;
    for (const m of providerModels) {
      const formatLabel = m.format ? ` · ${FORMAT_NAMES[m.format] || m.format}` : '';
      bodyHtml += `
        <div class="model-select-item ${m.id===store.aiSettings.model?'selected':''}" onclick="store.aiSettings.model='${m.id}';$('modelVal').textContent='${m.label||m.id}';closeModal();toast('模型: ${m.label||m.id}')">
          <span class="model-select-name">${m.label||m.id}</span>
          <span class="model-select-id">${m.id}${formatLabel}</span>
          ${m.id===store.aiSettings.model?'<span style="font-size:12px;color:var(--accent);">✓</span>':''}
        </div>`;
    }
  }

  bodyHtml += `<button class="import-btn" onclick="closeModal();fetchModelsFromAPI()" style="margin-top:12px;">↻ Refresh models from API</button>`;

  showModal('选择模型', bodyHtml, [{label:'close',cls:'cancel',onclick:closeModal}]);
}

// ==================== WEATHER FETCH (Phase 3) ====================
async function fetchWeather() {
  if (!store.aiSettings.autoWeather) return;
  let loc = null;
  try { const stored = localStorage.getItem('userLocation'); if (stored) loc = JSON.parse(stored); } catch {}

  if (!loc) {
    if (!navigator.geolocation) { toast('浏览器不支持定位'); return; }
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const newLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        localStorage.setItem('userLocation', JSON.stringify(newLoc));
        await doWeatherFetch(newLoc.lat, newLoc.lon);
      },
      (err) => {
        toast('无法获取位置：' + (err.code === 1 ? '权限被拒绝' : err.message));
      },
      { timeout: 10000, maximumAge: 1800000 }
    );
    return;
  }
  await doWeatherFetch(loc.lat, loc.lon);
}

async function doWeatherFetch(lat, lon) {
  try {
    const resp = await fetch(BACKEND_URL + '/api/weather', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lat, lon })
    });
    const data = await resp.json();
    store.weather = { text: data.weather, updated: Date.now() };
    console.log('[weather] Updated:', data.weather);
  } catch (err) {
    console.log('[weather] Fetch error:', err.message);
    store.weather = { text: '(天气不可用)', updated: Date.now() };
  }
}

function attachSwipeListeners(){
  document.querySelectorAll('.swipe-container').forEach(el=>{
    let startX=0,startY=0,currentX=0; const content=el.querySelector('.swipe-content');
    if(content.dataset.swipeBound)return; content.dataset.swipeBound='1';
    content.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;content.style.transition='none';});
    content.addEventListener('touchmove',e=>{
      const dx=e.touches[0].clientX-startX,dy=e.touches[0].clientY-startY;
      if(Math.abs(dy)>Math.abs(dx))return;
      e.preventDefault(); currentX=Math.min(0,Math.max(-72,dx));
      content.style.transform=`translateX(${currentX}px)`;
    });
    content.addEventListener('touchend',()=>{
      content.style.transition='transform 0.25s ease';
      if(currentX<-36)content.style.transform='translateX(-72px)'; else content.style.transform='translateX(0)';
      currentX=0;
    });
    // Mouse fallback
    let md=false;
    content.addEventListener('mousedown',e=>{md=true;startX=e.clientX;content.style.transition='none';});
    content.addEventListener('mousemove',e=>{if(!md)return;const dx=e.clientX-startX;currentX=Math.min(0,Math.max(-72,dx));content.style.transform=`translateX(${currentX}px)`;});
    content.addEventListener('mouseup',()=>{if(!md)return; md=false; content.style.transition='transform 0.25s ease'; if(currentX<-36)content.style.transform='translateX(-72px)'; else content.style.transform='translateX(0)'; currentX=0;});
    content.addEventListener('mouseleave',()=>{if(!md)return; md=false; content.style.transition='transform 0.25s ease'; content.style.transform='translateX(0)'; currentX=0;});
  });
}

const LITTER_THOUGHT_TYPES = ['possession','self_doubt','inexplicable_detail','unclear'];
const LITTER_MAX_PER_DAY = 5;
const LITTER_COOLDOWN_MS = 30 * 60 * 1000; // 30 min per window

/** Rotate through thought types to avoid repetition */
function getNextLitterType(chat) {
  if (!chat._litterTypeSeq) chat._litterTypeSeq = 0;
  const idx = chat._litterTypeSeq % LITTER_THOUGHT_TYPES.length;
  chat._litterTypeSeq++;
  return LITTER_THOUGHT_TYPES[idx];
}

/** Count today's litter entries */
function countTodayLitter() {
  const today = fmtDate().iso;
  return (store.litterThoughts || []).filter(t => t.date === today).length;
}

/** Hard content validation — returns null if valid, error string if invalid */
function validateLitterContent(text) {
  if (!text || !text.trim()) return 'empty';
  if (text.length > 100) return 'too long ('+text.length+' chars)';
  if (/我爱你|喜欢你|在乎你|想念你|喜欢你/.test(text)) return 'direct emotion';
  if (/希望|祝愿|加油|祝福|愿你/.test(text)) return 'encouragement';
  if (/[？?]$/.test(text.trim())) return 'ends with question';
  if (/[\u{1F300}-\u{1FAFF}]/u.test(text)) return 'contains emoji';
  return null; // valid
}

/** Check Signal A (user holds back) + Signal D (session end) */
function detectLitterSignals(userText, prevUserMsg) {
  const signals = [];
  // Signal A: user hedges
  if (/算了|没事|随便|不说了|忘了|没什么|不重要/.test(userText)) {
    signals.push({ type: 'user_signal', detail: 'user hedged' });
  }
  // Signal A: message length drop >50% compared to previous
  if (prevUserMsg && userText.length < prevUserMsg.length * 0.5 && prevUserMsg.length > 10) {
    signals.push({ type: 'user_signal', detail: 'message length dropped' });
  }
  // Signal D: session end
  if (/晚安|再见|拜拜|bye|下线|先睡了|去睡了|先下了/.test(userText.toLowerCase())) {
    signals.push({ type: 'session_end', detail: 'goodbye detected' });
  }
  return signals;
}

      body: JSON.stringify({
        apiKey: store.apiKey, endpoint: store.apiEndpoint, model: store.aiSettings.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ]
      })
    });
    const data = await response.json();
    const content = (data.reply && data.reply.content) ? data.reply.content.trim() : '';
    if (!content) return null;

    // Validate with hard rules
    const validationErr = validateLitterContent(content);
    if (validationErr) {
      console.log('[litter] Content rejected:', validationErr, content.slice(0, 50));
      return null;
    }
    return { content, thoughtType };
  } catch (err) {
    console.error('[litter] Generation error:', err);
    return null;
  }
}

/** Main litter trigger — called after each AI response */
async function triggerLitterBox(userText, aiResponse) {
  const chat = getActiveChatObj();
  if (!chat) return;

  // Frequency limit: max 1 per 30 min per window
  if (chat._lastLitterTime && (Date.now() - chat._lastLitterTime) < LITTER_COOLDOWN_MS) return;
  // Daily max
  if (countTodayLitter() >= LITTER_MAX_PER_DAY) return;

  // Get previous user message for length comparison
  const userMsgs = chat.messages.filter(m => m.role === 'user');
  const prevUserMsg = userMsgs.length >= 2 ? userMsgs[userMsgs.length - 2].text : null;

  // Check signals
  const signals = detectLitterSignals(userText, prevUserMsg);
  if (signals.length === 0) return;

  // Generate
  const result = await generateLitterThought(signals, userText);
  if (!result) return;

  // Store silently
  if (!store.litterThoughts) store.litterThoughts = [];
  const proj = getActiveProject();
  const winName = (proj && chat) ? `${proj.name} / ${chat.name}` : (chat.name || 'unknown');

  if (store.litterThoughts.length > 50) store.litterThoughts.length = 50;

  chat._lastLitterTime = Date.now();

  // Insert system message
  chat.messages.push({ role: 'system', text: '猫砂盆好像需要铲一铲', time: nowTime() });

// ==================== TOKEN ESTIMATION & CONTEXT MANAGEMENT ====================
// Rough token estimator: Chinese ~1.5 chars/token, English/Latin ~4 chars/token
function estimateTokens(text) {
  if (!text) return 0;
  let tokens = 0;
  let i = 0;
  while (i < text.length) {
    const code = text.charCodeAt(i);
    if (code >= 0x4E00 && code <= 0x9FFF) {
      // CJK unified: count every 1.5 chars as 1 token
      let run = 0;
      while (i < text.length && text.charCodeAt(i) >= 0x4E00 && text.charCodeAt(i) <= 0x9FFF) {
        run++; i++;
      }
      tokens += Math.ceil(run / 1.5);
    } else if (code >= 0x3000 && code <= 0x303F) {
      // CJK punctuation: ~1 token per 2 chars
      tokens += 1; i++;
    } else {
      // Latin/numbers/punctuation: count every 4 chars as 1 token
      let run = 0;
      while (i < text.length && !(text.charCodeAt(i) >= 0x4E00 && text.charCodeAt(i) <= 0x9FFF) && !(text.charCodeAt(i) >= 0x3000 && text.charCodeAt(i) <= 0x303F)) {
        run++; i++;
      }
      tokens += Math.ceil(run / 4);
    }
  }
  return Math.max(1, tokens);
}

// ── Recall Intent Detection (Path B trigger) ──
function detectRecallIntent(userMessage) {
  if (!userMessage) return false;
  const patterns = [
    /上次/, /之前/, /说过/, /提到过/, /那本/, /那个/, /还记得/,
    /你记得/, /你说/, /你讲过/, /回忆起/, /想起来/, /上次说/,
    /之前聊/, /以前/, /曾经/, /那时候/, /当时/
  ];
  return patterns.some(p => p.test(userMessage));
}

// ==================== MEMORY FILE IO (localStorage + backend) ====================
function memoryFileKey(projectId, windowId) {
  return `warmbuddy-memory-${projectId}-${windowId}`;
}

function readMemoryFile(projectId, windowId) {
  try {
    const raw = localStorage.getItem(memoryFileKey(projectId, windowId));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function writeMemoryFile(projectId, windowId, data, trigger) {
  if (!data || !projectId || !windowId) return;
  const file = {
    window_id: windowId,
    project_id: projectId,
    last_updated: new Date().toISOString(),
    write_trigger: trigger || 'manual',
    starred_memories: data.starred_memories || [],
    core_emotional_memories: data.core_emotional_memories || [],
    relational_patterns: data.relational_patterns || {},
    pattern_change_log: data.pattern_change_log || []
  };
  // Detect pattern changes for log
  const existing = readMemoryFile(projectId, windowId);
  if (existing && existing.relational_patterns) {
    const changeNote = diffPatterns(existing.relational_patterns, file.relational_patterns);
    if (changeNote) {
      file.pattern_change_log = (existing.pattern_change_log || []).concat([{
        period: (existing.last_updated || '') + ' → ' + file.last_updated,
        change_note: changeNote
      }]).slice(-20);
    }
  }
  try {
    localStorage.setItem(memoryFileKey(projectId, windowId), JSON.stringify(file));
  } catch (e) {
    console.log('[memory-file] Write failed:', e.message);
  }
}

function diffPatterns(oldPatterns, newPatterns) {
  const changes = [];
  const allKeys = new Set([...Object.keys(oldPatterns || {}), ...Object.keys(newPatterns || {})]);
  for (const key of allKeys) {
    const oldVal = (oldPatterns || {})[key];
    const newVal = (newPatterns || {})[key];
    if (!oldVal && newVal) changes.push(`${key}: 新增`);
    else if (oldVal && !newVal) changes.push(`${key}: 移除`);
    else if (oldVal && newVal && oldVal.strategy !== newVal.strategy) {
      changes.push(`${key}: 策略变更 (count: ${oldVal.count}→${newVal.count})`);
    }
  }
  return changes.length > 0 ? changes.join('; ') : null;
}

function syncProjectMemories(projectId) {
  if (!projectId) return;
  // Scan all memory files for this project
  const mergedPatterns = {};
  const mergedCoreMemories = [];
  const mergedStarred = [];
  let latestUpdate = '';

  // Collect all localStorage keys matching this project
  const prefix = `warmbuddy-memory-${projectId}-`;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(prefix)) continue;
    try {
      const file = JSON.parse(localStorage.getItem(key));
      if (!file) continue;
      // Merge relational_patterns (latest wins on conflict)
      if (file.relational_patterns) {
        for (const [label, pattern] of Object.entries(file.relational_patterns)) {
          if (!mergedPatterns[label] || file.last_updated > latestUpdate) {
            mergedPatterns[label] = pattern;
          }
        }
      }
      // Merge core emotional memories
      if (file.core_emotional_memories) {
        for (const cm of file.core_emotional_memories) {
          if (!mergedCoreMemories.some(m => m.id === cm.id)) {
            mergedCoreMemories.push(cm);
          }
        }
      }
      // Merge starred memories
      if (file.starred_memories) {
        for (const sm of file.starred_memories) {
          if (!mergedStarred.some(m => m.id === sm.id)) {
            mergedStarred.push(sm);
          }
        }
      }
      if (file.last_updated > latestUpdate) latestUpdate = file.last_updated;
    } catch {}
  }

  // Update relational portrait with merged patterns
  const ms = store.memorySystem;
  for (const [label, pattern] of Object.entries(mergedPatterns)) {
    if (!ms.relationalPortrait.patterns[label]) {
      ms.relationalPortrait.patterns[label] = pattern;
    } else if (latestUpdate && pattern.lastSeen && pattern.lastSeen > (ms.relationalPortrait.patterns[label].lastSeen || '')) {
      ms.relationalPortrait.patterns[label] = pattern;
    }
  }

  console.log(`[sync] Project ${projectId}: merged ${Object.keys(mergedPatterns).length} patterns, ${mergedCoreMemories.length} core memories, ${mergedStarred.length} starred`);
  return { mergedPatterns, mergedCoreMemories, mergedStarred };
}

// ── Build the dynamic context block (separate system message, can be compressed) ──
function buildDynamicContextBlock() {
  const proj = getActiveProject();
  const chat = getActiveChatObj();
  const today = fmtDate();
  const parts = [];

  // ── Date & Time ──
  if (store.aiSettings.autoDateTime) {
    const now = new Date();
    parts.push(`【当前时间】${today.cn} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`);
  }

  // ── Weather ──
  if (store.aiSettings.autoWeather) {
    const w = store.weather;
    if (w && w.text) {
      const isStale = !w.updated || (Date.now() - w.updated) > 3600000;
      parts.push(`【天气】${w.text}${isStale ? ' (可能已过时)' : ''}`);
    }
  }

  // ── Web Search ──
  if (store.aiSettings.webSearch) {
    parts.push('【搜索能力】你可以联网搜索。当需要最新信息时，在回应中插入 [[SEARCH:关键词]]。系统会检测到、执行搜索、将结果注入对话，然后你会被再次调用来整合结果并生成最终回复。关键词要精确简短（1-5个词）。');
  }

  // ── User Preference ──
  if (proj && proj.preference && proj.preference.trim()) {
    parts.push(`【用户偏好】${proj.preference}`);
  }

  // ── Relational Portrait Digest ──
  const recentUserLabels = getRecentUserAffectLabels();
  if (recentUserLabels.length > 0) {
    const portrait = store.memorySystem.relationalPortrait;
    const matched = [];
    for (const label of recentUserLabels) {
      const pattern = portrait.patterns[label];
      if (pattern && pattern.strategy && pattern.count >= 2) {
        matched.push(`${label}(×${pattern.count}): ${pattern.strategy}`);
      }
    }
    if (matched.length > 0) {
      parts.push('【关系模式】' + matched.slice(0, 3).join(' | '));
    }
  }

  // ── Core Emotional Memories (affect-matched, top 2) ──
  const coreMems = store.memorySystem.coreMemories || [];
  if (coreMems.length > 0) {
    const recentLabels = getRecentAffectLabels();
    const relevant = coreMems
      .filter(cm => {
        const aiL = cm.affect_first?.ai?.label;
        const uL = cm.affect_first?.user?.label;
        return recentLabels.includes(aiL) || recentLabels.includes(uL);
      })
      .sort((a, b) =>
        ((b.affect_first?.ai?.intensity || 0) + (b.affect_first?.user?.intensity || 0)) -
        ((a.affect_first?.ai?.intensity || 0) + (a.affect_first?.user?.intensity || 0))
      )
      .slice(0, 2);
    if (relevant.length > 0) {
      parts.push('【情感记忆】' + relevant.map(cm =>
        `[${cm.affect_first.ai.label}/${cm.affect_first.user.label}] ${cm.event_summary} — ${cm.relational_note}`
      ).join(' | '));
    }
  }

  // ── Shared/Starred Memories ──
  if (chat && chat.sharedMemoryIds && chat.sharedMemoryIds.length > 0 && proj) {
    const sharedMems = proj.memories.filter(m =>
      chat.sharedMemoryIds.includes(m.id) && m.starred && (m.decayFactor || 0) >= 0.25
    );
    if (sharedMems.length > 0) {
      parts.push('【重要记忆】' + sharedMems.map(m => m.content).join(' | '));
    }
  }

  // ── Chat Summaries (last 2, capped at 80 chars each) ──
  if (chat) {
    const chatSum = store.memorySystem.chatSummaries[chat.id];
    if (chatSum && chatSum.summaries && chatSum.summaries.length > 0) {
      const recentSummaries = chatSum.summaries.slice(-2);
      parts.push('【对话摘要】' + recentSummaries.map(s => {
        const line = (s.summary.split('\n')[0] || s.summary);
        return line.length > 80 ? line.slice(0, 80) + '…' : line;
      }).join(' | '));
    }
  }

  // ── Todos (capped: 3 short + long with progress) ──
  const activeTodos = store.todos.filter(t => !t.done);
  if (activeTodos.length > 0) {
    const shortTodos = activeTodos.filter(t => t.type === 'short');
    const longTodos = activeTodos.filter(t => t.type === 'long');
    const todoLines = [];
    if (shortTodos.length > 0) {
      const shown = shortTodos.slice(0, 3);
      todoLines.push('短期待办: ' + shown.map(t => t.text + (t.time ? ' (' + t.time + ')' : '')).join(', ')
        + (shortTodos.length > 3 ? ` …共${shortTodos.length}项` : ''));
    }
    if (longTodos.length > 0) {
      todoLines.push('长期目标: ' + longTodos.map(t => {
        const remain = daysBetween(today.iso, t.deadline);
        return `${t.text}(进度${t.progress}%,${remain > 0 ? '剩' + remain + '天' : '已过期'})`;
      }).join(', '));
    }
    if (todoLines.length > 0) parts.push('【待办】' + todoLines.join(' | '));
  }

  // ── Bookshelf (only in-progress) ──
  const readingBooks = store.books.filter(b => b.progress > 0 && b.progress < 100);
  if (readingBooks.length > 0) {
    parts.push('【阅读】' + readingBooks.map(b => `《${b.title}》${b.progress}%`).join(', '));
  }

  // ── Recent Diary (user: 1 entry capped at 100 chars) ──
  const recentUserDiary = store.diaries.filter(d => d.author === 'user')[0];
  if (recentUserDiary) {
    const dc = recentUserDiary.content;
    parts.push('【用户最近日记】' + (dc.length > 100 ? dc.slice(0, 100) + '…' : dc));
  }

  // ── Recent AI Diary (1 entry capped at 100 chars) ──
  const recentAIDiary = store.diaries.filter(d => d.author === 'ai')[0];
  if (recentAIDiary) {
    const dc = recentAIDiary.content;
    parts.push('【你的最近日记】' + (dc.length > 100 ? dc.slice(0, 100) + '…' : dc));
  }

  // ── Content Retrieval (Path B: recall-triggered, injected on demand) ──
  // This is set externally by sendMessage() when recall intent is detected
  // Format: '【检索记忆】…'
  if (chat && chat._pendingRetrievalBlock) {
    parts.push(chat._pendingRetrievalBlock);
    chat._pendingRetrievalBlock = null; // consume once
  }

  // ── REFLECT format instruction (required for the memory pipeline) ──
  parts.push(`【响应格式】
在每个回复的最末尾，附加一个反思块（不显示给用户，仅系统内部使用）：
<!--REFLECT
{
  "ai_affect_label": "被触动|想追问但没问|克制后反弹|放松|警觉|平静在场|安心|落空|感伤|心动|骄傲|担心",
  "ai_affect_intensity": 1到10,
  "user_affect_label": "脆弱|调皮|疲惫|兴奋|回避|坦诚|平静在场|依赖|骄傲|低落",
  "user_affect_intensity": 1到10,
  "signal_source": "判断依据（如用词、句长、话题转换等，简要说明）"
}
-->
确保JSON格式正确，使用英文双引号。`);

  return parts.join('\n');
}

// ==================== SELF-REFLECTION (P2) ====================
function extractReflection(responseText) {
  const re = /<!--\s*REFLECT\s*([\s\S]*?)\s*-->/i;
  const match = responseText.match(re);
  if (!match) return { cleanText: responseText, reflection: null };

  try {
    const jsonStr = match[1].trim();
    const reflection = JSON.parse(jsonStr);
    const cleanText = (responseText.slice(0, match.index) + responseText.slice(match.index + match[0].length)).trim();
    // Validate required fields
    if (!reflection.ai_affect_label || !reflection.user_affect_label) {
      console.log('[reflect] Missing affect labels, skipping');
      return { cleanText: responseText, reflection: null };
    }
    return { cleanText, reflection };
  } catch (e) {
    console.log('[reflect] JSON parse failed, trying regex fallback');
    // Fallback: try to extract fields with regex
    const fallback = parseReflectionFallback(match[1]);
    if (fallback) {
      const cleanText = (responseText.slice(0, match.index) + responseText.slice(match.index + match[0].length)).trim();
      return { cleanText, reflection: fallback };
    }
    return { cleanText: responseText, reflection: null };
  }
}

function parseReflectionFallback(text) {
  try {
    const getInt = (key) => { const m = text.match(new RegExp(`"${key}"\\s*:\\s*(\\d+)`)); return m ? parseInt(m[1]) : 5; };
    const getStr = (key) => { const m = text.match(new RegExp(`"${key}"\\s*:\\s*"([^"]*)"`)); return m ? m[1] : '平静在场'; };
    return {
      response_length_delta: getStr('response_length_delta'),
      word_choice_note: getStr('word_choice_note'),
      ai_affect_label: getStr('ai_affect_label'),
      ai_affect_intensity: getInt('ai_affect_intensity'),
      user_affect_label: getStr('user_affect_label'),
      user_affect_intensity: getInt('user_affect_intensity'),
      signal_source: getStr('signal_source')
    };
  } catch { return null; }
}

function processReflection(reflection, userMsg, aiResponse, chat) {
  if (!reflection) return;
  const ms = store.memorySystem;

  // 1. Store in rolling log
  ms.reflections.unshift({
    timestamp: new Date().toISOString(),
    ...reflection,
    sourceChatId: store.activeChat
  });
  if (ms.reflections.length > ms.reflectionMax) {
    ms.reflections.length = ms.reflectionMax;
  }

  // 2. Update affect co-occurrence graph
  updateAffectGraph(reflection.ai_affect_label, reflection.user_affect_label);

  // 3. Track "平静在场" cumulative count
  if (reflection.user_affect_label === '平静在场' || reflection.ai_affect_label === '平静在场') {
    ms._quietPresenceCount = (ms._quietPresenceCount || 0) + 1;
  }

  // 4. Update relational portrait counts
  updateRelationalPortrait(reflection.user_affect_label);

  // 5. Check core memory threshold
  const aiIntensity = reflection.ai_affect_intensity || 0;
  const userIntensity = reflection.user_affect_intensity || 0;
  if (aiIntensity >= 7 || userIntensity >= 7) {
    queueCoreMemoryCreation(reflection, userMsg, aiResponse, chat);
  }

  // 6. Check "平静在场" cumulative threshold
  if ((ms._quietPresenceCount || 0) >= 10) {
    queueQuietPresenceCoreMemory(chat);
    ms._quietPresenceCount = 0;
  }

  // 7. Attach affect label to recent auto-memories (created in this session)
  const proj = getActiveProject();
  if (proj) {
    const today = fmtDate().iso;
    const recentMems = proj.memories.filter(m => m.date === today && !m.affectLabel);
    for (const m of recentMems.slice(-3)) {
      m.affectLabel = reflection.user_affect_label;
      m.affectIntensity = reflection.user_affect_intensity;
    }
  }

  // 8. Update chat message count for compression tracking
  if (chat) {
    chat._messageCount = (chat._messageCount || 0) + 1;
  }

  // 9. Update desire drives (EDA)
  updateDesireDrives(reflection);
}

function updateAffectGraph(aiLabel, userLabel) {
  if (!aiLabel || !userLabel) return;
  const edges = store.memorySystem.affectGraph.edges;
  const key = [aiLabel, userLabel].sort().join('::');
  edges[key] = (edges[key] || 0) + 1;
}

function getRecentAffectLabels() {
  const reflections = store.memorySystem.reflections || [];
  const labels = new Set();
  for (const r of reflections.slice(0, 5)) {
    if (r.ai_affect_label) labels.add(r.ai_affect_label);
    if (r.user_affect_label) labels.add(r.user_affect_label);
  }
  return [...labels];
}

function getRecentUserAffectLabels() {
  const reflections = store.memorySystem.reflections || [];
  const labels = [];
  for (const r of reflections.slice(0, 5)) {
    if (r.user_affect_label) labels.push(r.user_affect_label);
  }
  return labels;
}

// ==================== COMMAND DETECTION ====================
function detectCommand(input) {
  const trimmed = input.trim();
  if (trimmed.startsWith('/diary') || trimmed.startsWith('/日记')) {
    return { type: 'diary', prompt: trimmed.replace(/^\/diary\s*/i, '').replace(/^\/日记\s*/, '') };
  }
  if (trimmed.startsWith('/todo') || trimmed.startsWith('/待办')) {
    return { type: 'todo', prompt: trimmed.replace(/^\/todo\s*/i, '').replace(/^\/待办\s*/, '') };
  }
  if (trimmed.startsWith('/book') || trimmed.startsWith('/书架')) {
    return { type: 'book', prompt: trimmed.replace(/^\/book\s*/i, '').replace(/^\/书架\s*/, '') };
  }
  if (trimmed.startsWith('/litter') || trimmed.startsWith('/猫砂')) {
    return { type: 'litter', prompt: trimmed.replace(/^\/litter\s*/i, '').replace(/^\/猫砂\s*/, '') };
  }
  if (trimmed.startsWith('/help') || trimmed === '/?') {
    return { type: 'help' };
  }
  return null;
}

async function executeCommand(cmd, userText) {
  switch (cmd.type) {
    case 'diary': {
      // Generate diary entry
      const prompt = cmd.prompt || '请根据我们最近的对话，帮我写一篇今天的日记。';
      const diaryContent = await genAIResponseForCommand(prompt, '请以用户mays的语气，用中文写一篇简洁的日记。要求：第一人称，温柔细腻，长度在100-200字。风格参考：记录当天的感受和想法，带有淡淡的文学气息。');
      if (diaryContent) {
        const ds = fmtDate().iso;
        const now = new Date();
        store.diaries.unshift({
          id: 'd' + gid(''), date: ds,
          time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
          title: '', content: diaryContent, mood: 'calm', author: 'user', replies: []
        });
        toast('📝 Diary entry generated');
        return `我帮你写了一篇日记，可以在 diary 页面查看。`;
      }
      return '日记生成遇到了一些问题……';
    }
    case 'litter': {
      const signals = [{ type: 'user_signal', detail: 'explicit /litter command' }];
      const result = await generateLitterThought(signals, text);
      if (result) {
        if (!store.litterThoughts) store.litterThoughts = [];
        const proj = getActiveProject(); const chat = getActiveChatObj();
        const winName = (proj && chat) ? `${proj.name} / ${chat.name}` : '';
        store.litterThoughts.unshift({
          id: 'lt'+gid(''), content: result.content,
          thought_type: result.thoughtType,
          trigger_type: 'user_signal',
          context_snapshot: text.slice(0, 200),
          date: fmtDate().iso, time: nowTime(),
          sourceChatId: store.activeChat, sourceWindow: winName,
          revealed: false
        });
        if (store.litterThoughts.length > 50) store.litterThoughts.length = 50;
        return result.content;
      }
      return '猫砂盆居然是空的……';
    }
    case 'todo': {
      const prompt = cmd.prompt || '列出当前待办';
      const activeTodos = store.todos.filter(t => !t.done);
      if (activeTodos.length === 0) return '你目前没有待办事项，好好享受当下吧 ✨';
      return '📋 **当前待办：**\n' + activeTodos.map(t => {
        if (t.type === 'long') {
          const remain = daysBetween(fmtDate().iso, t.deadline);
          return `- 🎯 ${t.text}（${t.progress}%，剩余${remain}天）`;
        }
        return `- ${t.done ? '✓' : '○'} ${t.text}${t.time ? ' ' + t.time : ''}`;
      }).join('\n');
    }
    case 'book': {
      const reading = store.books.filter(b => b.progress > 0 && b.progress < 100);
      if (reading.length === 0) return '你目前没有正在阅读的书籍。';
      return '📚 **正在阅读：**\n' + reading.map(b => `- ${b.cover} 《${b.title}》by ${b.author}（${b.progress}%）`).join('\n');
    }
    case 'help': {
      return '**可用命令：**\n- `/diary` — 生成一篇日记\n- `/diary 内容` — 按提示生成日记\n- `/todo` — 查看待办\n- `/book` — 查看书架\n- `/help` — 显示此帮助';
    }
    default:
      return null;
  }
}

// ==================== INTENT CLASSIFICATION ====================
/**
 * Use AI to classify the user's diary-related intent.
 * Returns 'diary_write' | 'diary_comment' | 'none'.
 */
async function classifyDiaryIntent(userText) {
  if (!store.apiKey) return 'none';
  try {
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey,
        endpoint: store.apiEndpoint,
        model: store.aiSettings.model,
        messages: [
          { role: 'system', content: '你是一个意图分类器。判断用户是否在要求AI操作日记。规则：\n1. 如果用户要求AI写日记（AI自己的日记，从AI视角回顾今天的交流），回复 "intent: diary_write"\n2. 如果用户要求AI去阅读/回复/留言用户写的日记，回复 "intent: diary_comment"\n3. 如果用户只是提到日记但没有要求操作，或者完全无关，回复 "intent: none"\n\n只回复一行，不要其他文字。' },
          { role: 'user', content: userText }
        ]
      })
    });
    const data = await response.json();
    const reply = (data.reply && data.reply.content) ? data.reply.content.toLowerCase() : '';
    if (reply.includes('diary_write')) return 'diary_write';
    if (reply.includes('diary_comment')) return 'diary_comment';
    return 'none';
  } catch (err) {
    console.error('Intent classification error:', err);
    return 'none';
  }
}

async function genAIResponseForCommand(userPrompt, systemPrompt) {
  if (!store.apiKey) return null;
  try {
    const messages = [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt }
    ];
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey,
        endpoint: store.apiEndpoint,
        model: store.aiSettings.model,
        messages
      })
    });
    const data = await response.json();
    if (data.reply && data.reply.content) {
      return data.reply.content;
    }
    return null;
  } catch (err) {
    console.error('Command AI call failed:', err);
    return null;
  }
}

let contextMenuTarget = null;

function showContextMenu(e, type, id, name) {
  e.preventDefault();
  e.stopPropagation();
  contextMenuTarget = { type, id, name };
  const menu = $('contextMenu');
  if (!menu) return;

  const items = [];
  if (type === 'project') {
    items.push({ label: '✎ Rename', cls: '', action: `editProjectName('${id}')` });
    items.push({ label: '🗑 Delete Project', cls: 'danger', action: `confirmDeleteProject('${id}','${name.replace(/'/g,"\\'")}')` });
  } else if (type === 'chat') {
    items.push({ label: '✎ Rename', cls: '', action: `editChatName('${id}')` });
    items.push({ label: '🗑 Delete Window', cls: 'danger', action: `confirmDeleteChat('${id}','${name.replace(/'/g,"\\'")}')` });
  }

  menu.innerHTML = items.map(i => `
    <div class="context-menu-item ${i.cls}" onclick="(${i.action})();hideContextMenu()">${i.label}</div>
  `).join('');

  // Position menu near cursor
  const x = e.clientX || (e.touches && e.touches[0]?.clientX) || 100;
  const y = e.clientY || (e.touches && e.touches[0]?.clientY) || 200;
  menu.style.left = Math.min(x, window.innerWidth - 150) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - 120) + 'px';
  menu.classList.add('show');

  // Hide on outside click
  setTimeout(() => {
    document.addEventListener('click', hideContextMenu, { once: true });
    document.addEventListener('touchstart', hideContextMenu, { once: true });
  }, 50);
}

function hideContextMenu() {
  const menu = $('contextMenu');
  if (menu) menu.classList.remove('show');
  contextMenuTarget = null;
}

      </div>`;
      return;
    }
    const isUser=m.role==='user';
    const isProactive = m._proactive;
    const bubbleCls = isProactive ? `chat-bubble ${m.role} proactive-bubble` : `chat-bubble ${m.role}`;
    const proactiveLabel = isProactive ? `<div class="proactive-label">${m._desireType === 'todo' ? '⏰ reminder' : '💭 proactive'}</div>` : '';
    html+=`<div class="chat-row ${m.role}">
      <div class="chat-avatar ${m.role}">${isUser?'MY':'✦'}</div>
      <div class="chat-bubble-wrap">
        ${proactiveLabel}
        <div class="${bubbleCls}" onclick="toggleBubbleActions(event,'${i}')">${m.text}</div>
        <div class="bubble-time">${m.time}</div>
      </div>
    </div>`;
    // Action bar placeholder
    html+=`<div id="bubbleActions_${i}" class="bubble-actions" style="display:none;justify-content:${isUser?'flex-end':'flex-start'};padding-left:${isUser?'0':'38px'};padding-right:${isUser?'38px':'0'};">

      <span class="ba-star" onclick="event.stopPropagation();starBubble(${i})" title="标记为记忆">★</span>
    </div>`;
  });
  el.innerHTML=html;
  el.scrollTop=el.scrollHeight;
}

// ==================== SENTENCE SPLITTING ====================

/**
 * Split text into sentences by Chinese and English punctuation.
 * Returns an array of sentence strings (punctuation kept).
 */
function splitSentences(text) {
  if (!text || !text.trim()) return [];
  // Match segments that end with sentence-ending punctuation,
  // or the final segment without punctuation.
  const re = /[^。！？\.!\?\n]+[。！？\.!\?\n]+|[^。！？\.!\?\n]+$/g;
  const sentences = [];
  let match;
  while ((match = re.exec(text)) !== null) {
    const s = match[0].trim();
    if (s) sentences.push(s);
  }
  // If nothing matched (no recognizable punctuation), use whole text
  if (sentences.length === 0 && text.trim()) {
    sentences.push(text.trim());
  }
  return sentences;
}

/**
 * Display sentences one by one as separate chat messages with typing delays.
 * Each sentence becomes its own bubble, simulating a natural chat rhythm.
 */
async function displaySentences(sentences, chat, startTime) {
  const typingArea = $('chatTypingArea');
  const messagesEl = $('chatMessages');

  for (let i = 0; i < sentences.length; i++) {
    // Show typing indicator between sentences (skip before first)
    if (i > 0) {
      typingArea.innerHTML = '<div class="typing-indicator">对方正在输入中<span class="streaming-cursor">|</span></div>';
      // Variable delay: 400-900ms between sentences
      await new Promise(r => setTimeout(r, 400 + Math.random() * 500));
    }
    typingArea.innerHTML = '';

    // Push this sentence as a separate message
    chat.messages.push({ role: 'ai', text: sentences[i], time: startTime });
    renderChatMessages();

    // Scroll to bottom
    if (messagesEl) messagesEl.scrollTop = messagesEl.scrollHeight;

    // Small gap after each sentence for readability
    if (i < sentences.length - 1) {
      await new Promise(r => setTimeout(r, 150));
    }
  }
}

async function sendMessage(){
  const input=$('chatInput'),text=input.value.trim(); if(!text)return;

  // EDA: passive drive accumulation + todo reminders
  checkPassiveDrives();

  let chat=getActiveChatObj();

    let handoffMsgs = [];

      const ho = store._pendingHandoff;

      console.log('[handoff] New window inherited handoff package with', handoffMsgs.length, 'context messages');
    }

    p.chats.push({
      id: cid, name: text.slice(0, 20),
      sharedMemoryIds: [], weeklyExports: [],
      messages: handoffMsgs,
      chatTokens: 0, lastConversationDate: fmtDate().iso,
      _messageCount: handoffMsgs.length, _lastSummaryIdx: 0,
      _handoffSuggested: false
    });
    store.activeChat = cid; chat = getActiveChatObj();
  }
  const timeStr=nowTime();
  chat.messages.push({role:'user',text,time:timeStr});
  chat._messageCount = (chat._messageCount || 0) + 1;

  // EDA: detect user response to proactive message (回应衰减)
  const lastMsg = chat.messages.length >= 2 ? chat.messages[chat.messages.length - 2] : null;
  if (lastMsg && lastMsg._proactive) {
    const ds = store.desireSystem;
    if (lastMsg._desireType === 'guardianship') ds.drives.guardianship = Math.max(0, ds.drives.guardianship - 20);
    if (lastMsg._desireType === 'confirmation') ds.drives.confirmation = Math.max(0, ds.drives.confirmation - 30);
    console.log('[eda] User responded to proactive message, applied response decay');
  }

  input.value=''; renderChatMessages(); updateCurrentProjectLabel(); renderProjectList();

  // Track last conversation date
  chat.lastConversationDate = fmtDate().iso;
  store.lastActiveDate = fmtDate().iso;
  store.consecutiveMissedDays = 0;

  // Check for commands
  let statusMessage = '';
  const cmd = detectCommand(text);
  if (cmd) {
    const typingArea=$('chatTypingArea');
    if (cmd.type === 'diary') {
      statusMessage = '正在偷偷翻日记本……';
      typingArea.innerHTML=`<div class="typing-indicator">${statusMessage}<span class="streaming-cursor">|</span></div>`;
    } else if (cmd.type === 'litter') {
      statusMessage = '正在进入旺财的猫砂盆……';
      typingArea.innerHTML=`<div class="typing-indicator">${statusMessage}<span class="streaming-cursor">|</span></div>`;
    } else {
      typingArea.innerHTML='<div class="typing-indicator">处理命令中……</div>';
    }
    const cmdResult = await executeCommand(cmd, text);
    if (cmdResult) {
      typingArea.innerHTML='';
      const aiTime = nowTime();
      // Insert system message before the AI response
      if (cmd.type === 'diary') {
        chat.messages.push({ role: 'system', text: '在日记里写了点什么', time: aiTime });
      } else if (cmd.type === 'litter') {
        chat.messages.push({ role: 'system', text: '猫砂盆好像需要铲一铲', time: aiTime });
      }
      chat.messages.push({role:'ai',text:cmdResult,time:aiTime});
      renderChatMessages();
      renderProjectList();
      return;
    }
  }

  // Lightweight pre-check for diary keywords → classify with AI
  const lower = text.toLowerCase();
  const hasDiaryWord = /日记|diary/.test(lower);

  let diaryIntent = 'none';
  if (hasDiaryWord && !cmd) {
    diaryIntent = await classifyDiaryIntent(text);
  }

  const typingArea=$('chatTypingArea');
  if (diaryIntent !== 'none') {
    statusMessage = '正在偷偷翻日记本……';
    typingArea.innerHTML=`<div class="typing-indicator">${statusMessage}<span class="streaming-cursor">|</span></div>`;
  } else if (cmd && cmd.type === 'litter') {
    statusMessage = '正在进入旺财的猫砂盆……';
    typingArea.innerHTML=`<div class="typing-indicator">${statusMessage}<span class="streaming-cursor">|</span></div>`;
  } else {
    typingArea.innerHTML='<div class="typing-indicator">对方正在输入中<span class="streaming-cursor">|</span></div>';
  }

  // ── Build dynamic context block ──
  // Check for recall intent → trigger content retrieval (Path B)
  if (detectRecallIntent(text)) {
    const retrievalBlock = buildRetrievalBlock(text);
    if (retrievalBlock) chat._pendingRetrievalBlock = retrievalBlock;
  }
  let dynamicBlock = buildDynamicContextBlock();

  // Inject diary instruction if intent detected
  if (diaryIntent === 'diary_write') {
    dynamicBlock += '\n【当前任务】用户让你写一篇你自己视角的日记。在回复中使用 <!--DIARY:write--> ... <!--/DIARY--> 标记。标记外正常回复可简短。';
  } else if (diaryIntent === 'diary_comment') {
    dynamicBlock += '\n【当前任务】用户让你去读他的日记并留言。在回复中使用 <!--DIARY:reply--> ... <!--/DIARY--> 标记，写1-2句温暖留言。';
  }

  // ── Split architecture: static + dynamic as separate system messages ──
  // messages[0] = static, cache-friendly (~1k chars English)
  // messages[1] = dynamic context (time, weather, todos, memories, etc.)
  // messages[2+] = conversation (token-aware truncated)
  const apiMessages = [
    { role: 'system', content: SYSTEM_PROMPT_STATIC },
    { role: 'system', content: dynamicBlock }
  ];

  // ── Token-aware conversation truncation (10k threshold) ──
  // Calculate current system prompt tokens
  let totalTokens = estimateTokens(SYSTEM_PROMPT_STATIC) + estimateTokens(dynamicBlock);

  // Pre-scan: tag messages with token estimates and collect the last N messages
  const candidateMsgs = [];
  for (let i = chat.messages.length - 1; i >= 0; i--) {
    const m = chat.messages[i];
    if (m.role === 'system') continue;
    const t = m._tokenEstimate || estimateTokens(m.text || '');
    m._tokenEstimate = t;
    candidateMsgs.unshift({ msg: m, tokens: t, idx: i });
    totalTokens += t;
    if (totalTokens > 12000 && candidateMsgs.length > 10) break; // scan enough
  }

  // Truncate from earliest if over 10k
  const TOKEN_LIMIT = 10000;
  let truncated = false;
  while (totalTokens > TOKEN_LIMIT && candidateMsgs.length > 2) {
    // Find earliest non-starred, non-core-memory message to evict
    let evictIdx = -1;
    for (let i = 0; i < candidateMsgs.length; i++) {
      const cm = candidateMsgs[i];
      if (!cm.msg._starred && !cm.msg._isCoreMemory) {
        evictIdx = i;
        break;
      }
    }
    if (evictIdx === -1) break; // all remaining are protected
    const evicted = candidateMsgs.splice(evictIdx, 1)[0];
    totalTokens -= evicted.tokens;
    truncated = true;
    // Queue evicted message for memory file write (event-triggered)
    queueEvictedMessageWrite(evicted.msg);
  }

  // ── Window handoff detection ──
  let starredTokens = 0, coreTokens = 0;
  for (const cm of candidateMsgs) {
    if (cm.msg._starred) starredTokens += cm.tokens;
    if (cm.msg._isCoreMemory) coreTokens += cm.tokens;
  }
  if ((starredTokens + coreTokens) > 8000) {
    // Trigger window handoff: write handoff package, suggest new window
    triggerWindowHandoff(chat, candidateMsgs);
  }

  if (truncated) {
    console.log(`[token] Truncation applied: ${candidateMsgs.length} msgs remain, ~${totalTokens} tokens`);
  }

  // Push conversation messages to API array
  for (const cm of candidateMsgs) {
    apiMessages.push({
      role: cm.msg.role === 'ai' ? 'assistant' : cm.msg.role,
      content: cm.msg.text
    });
  }

  // Streaming call — accumulate silently, then split & display
  let fullResponse = '';
  let tokenUsage = null;
  const bubbleTime = nowTime();

  try {
    const response = await fetch(BACKEND_URL + '/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey,
        endpoint: store.apiEndpoint,
        model: store.aiSettings.model,
        messages: apiMessages
      })
    });

    if (!response.ok) {
      typingArea.innerHTML = '';
      chat.messages.push({role:'ai',text:'连接API失败，请检查配置。',time:bubbleTime});
      renderChatMessages();
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.trim() || !line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed.error) { fullResponse = parsed.error; break; }
          if (parsed.text) {
            fullResponse += parsed.text;
            if (typingArea && typingArea.innerHTML) typingArea.innerHTML = '';
          }
          if (parsed.usage) { tokenUsage = parsed.usage; }
        } catch {}
      }
    }

    if (!fullResponse) {
      fullResponse = '（对方沉默了……也许在思考什么。）';
    }

  } catch (err) {
    console.error('Stream error:', err);
    fullResponse = '连接不到陪伴小站，请确保后端已启动。';
  }

  // ── Web Search: two-pass mechanism (Phase 2) ──
  const searchMarker = fullResponse.match(/\[\[SEARCH:(.+?)\]\]/);
  if (searchMarker && store.aiSettings.webSearch) {
    const searchQuery = searchMarker[1].trim();
    if (searchQuery) {
      fullResponse = fullResponse.replace(/\[\[SEARCH:.+?\]\]/, '').trim();
      typingArea.innerHTML = '<div class="typing-indicator">正在搜索: ' + escapeHtml(searchQuery) + '...</div>';

      try {
        const searchResp = await fetch(BACKEND_URL + '/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: searchQuery })
        });
        const searchData = await searchResp.json();
        const searchResults = searchData.results || '(no results)';

        // Inject search results as a system-tagged user message
        chat.messages.push({
          role: 'user',
          text: '[系统] 网络搜索结果（搜索词: ' + searchQuery + '）: ' + searchResults,
          time: nowTime(),
          _searchResult: true
        });

        // Rebuild API messages with search results
        const newDynamicBlock = buildDynamicContextBlock();
        const apiMessages2 = [
          { role: 'system', content: SYSTEM_PROMPT_STATIC },
          { role: 'system', content: newDynamicBlock }
        ];
        for (const m of chat.messages) {
          if (m.role === 'system' || m._searchResult) continue;
          apiMessages2.push({
            role: m.role === 'ai' ? 'assistant' : m.role,
            content: m.text
          });
        }

        // Re-call AI to integrate search results
        fullResponse = '';
        tokenUsage = null;
        const response2 = await fetch(BACKEND_URL + '/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            apiKey: store.apiKey,
            endpoint: store.apiEndpoint,
            model: store.aiSettings.model,
            messages: apiMessages2
          })
        });

        if (response2.ok) {
          const reader2 = response2.body.getReader();
          const decoder2 = new TextDecoder();
          let buffer2 = '';
          while (true) {
            const { done, value } = await reader2.read();
            if (done) break;
            buffer2 += decoder2.decode(value, { stream: true });
            const lines = buffer2.split('\n');
            buffer2 = lines.pop() || '';
            for (const line of lines) {
              if (!line.trim() || !line.startsWith('data: ')) continue;
              const data = line.slice(6);
              if (data === '[DONE]') continue;
              try {
                const parsed = JSON.parse(data);
                if (parsed.error) { fullResponse = parsed.error; break; }
                if (parsed.text) {
                  fullResponse += parsed.text;
                  if (typingArea && typingArea.innerHTML) typingArea.innerHTML = '';
                }
                if (parsed.usage) { tokenUsage = parsed.usage; }
              } catch {}
            }
          }
        }

        if (!fullResponse) {
          fullResponse = '（搜索完成，但AI没有生成回复……）';
        }
      } catch (searchErr) {
        console.error('[search] Two-pass error:', searchErr);
        if (!fullResponse) fullResponse = '（搜索失败，请稍后重试）';
      }
    }
  }

  typingArea.innerHTML = '';

  // ── Parse REFLECT marker from AI response (before DIARY parsing) ──
  const reflectResult = extractReflection(fullResponse);
  if (reflectResult.reflection) {
    processReflection(reflectResult.reflection, text, reflectResult.cleanText, chat);
  }
  let displayResponse = reflectResult.cleanText || fullResponse;
  let diaryWritten = false;
  const proj = getActiveProject();
  const winName = (proj && chat) ? `${proj.name} / ${chat.name}` : '';

  function extractMarker(text, action) {
    const re = new RegExp(`<!--\\s*DIARY:${action}\\s*-->([\\s\\S]*?)<!--\\s*\\/DIARY\\s*-->`, 'i');
    return text.match(re);
  }

  // Parse DIARY:write
  const writeMatch = extractMarker(displayResponse, 'write');
  if (writeMatch) {
    const diaryContent = writeMatch[1].trim();
    displayResponse = displayResponse.replace(writeMatch[0], '');
    if (diaryContent) {
      const now = new Date();
      store.diaries.unshift({
        id: 'd' + gid(''), date: fmtDate().iso,
        time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
        title: '', content: diaryContent, mood: 'calm', author: 'ai', replies: [],
        sourceChatId: store.activeChat, sourceWindow: winName
      });
      diaryWritten = true;
    }
  }

  // Parse DIARY:reply
  const replyMatch = extractMarker(displayResponse, 'reply');
  if (replyMatch) {
    const replyContent = replyMatch[1].trim();
    displayResponse = displayResponse.replace(replyMatch[0], '');
    if (replyContent) {
      const userEntries = store.diaries.filter(d => d.author === 'user');
      if (userEntries.length > 0) {
        const target = userEntries[0];
        if (!target.replies) target.replies = [];
        const now = new Date();
        target.replies.push({
          id: 'r' + gid(''), content: replyContent, author: 'ai',
          date: fmtDate().iso,
          time: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
          sourceChatId: store.activeChat, sourceWindow: winName
        });
        diaryWritten = true;
      }
    }
  }

  // Strip any remaining raw marker tags from display
  displayResponse = displayResponse.replace(/<!--\s*\/?DIARY:\w*\s*-->[\s\S]*?<!--\s*\/DIARY\s*-->/gi, '');
  displayResponse = displayResponse.replace(/<!--\s*\/?DIARY:?\w*\s*-->/gi, '');
  displayResponse = displayResponse.trim();

  // ── After diary action: insert system message, ensure conversation continues ──
  if (diaryWritten) {
    // Insert persistent system message into chat history
    chat.messages.push({ role: 'system', text: '在日记里写了点什么', time: bubbleTime });
    renderChatMessages();
    // Push notification
    const dproj = getActiveProject();
    const dchat = getActiveChatObj();
    const dwinName = (dproj && dchat) ? dchat.name : '';
    sendPushNotification('📝日记', `${dwinName}刚刚写了篇日记`, { tag: 'diary-update', url: '/', requireInteraction: false });
    // If after stripping markers there's nothing left, generate a natural follow-up
    if (!displayResponse || displayResponse === fullResponse) {
      displayResponse = '嗯，已经写好了。你可以去 diary 页面看看～';
    }
  }

  // Display cleaned text
  const cleanText = displayResponse || '（对方沉默了……也许在思考什么。）';
  const sentences = splitSentences(cleanText);
  if (sentences.length <= 1) {
    chat.messages.push({role:'ai',text:cleanText,time:bubbleTime});
    renderChatMessages();
  } else {
    await displaySentences(sentences, chat, bubbleTime);
  }

  // Token tracking — handle both Anthropic (input/output_tokens) and OpenAI (prompt/completion_tokens)
  const inputTokens = tokenUsage
    ? (tokenUsage.input_tokens || tokenUsage.prompt_tokens || 0)
    : estimateTokens(text);
  const outputTokens = tokenUsage
    ? (tokenUsage.output_tokens || tokenUsage.completion_tokens || 0)
    : Math.ceil(fullResponse.length / 1.5);
  const estimatedTokens = inputTokens + outputTokens;

  // Phase 3: Log token call
  logTokenCall(store.activeChat, 'chat', inputTokens, outputTokens,
    tokenUsage ? (tokenUsage.cache_read_input_tokens || 0) : 0,
    tokenUsage ? (tokenUsage.cache_creation_input_tokens || 0) : 0,
    store.aiSettings.model);

  // Per-window token tracking
  if (!chat.chatTokens) chat.chatTokens = 0;
  chat.chatTokens += estimatedTokens;

  // Global token tracking
  store.tokenUsage.used += estimatedTokens;
  const today = String(new Date().getDate()).padStart(2,'0')+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  const te = store.tokenUsage.history.find(h => h.date === today);
  if (te) te.tokens += estimatedTokens;
  else {
    store.tokenUsage.history.unshift({ date: today, tokens: estimatedTokens });
    if (store.tokenUsage.history.length > 30) store.tokenUsage.history.pop();
  }

  renderChatMessages();
  renderProjectList();

  // Post-conversation hooks
  maybeAddMemory(text, fullResponse);
  triggerLitterBox(text, fullResponse);
  maybeAICommentOnDiary(fullResponse);
  applyForgettingCurve();
  checkSummarization(chat);
  checkLongTermMemory(chat);
  executePendingDesireActions();
}

function maybeAddMemory(ut,at){

    const proj=getActiveProject(); if(!proj)return;
    const c=ut.length>40?ut.slice(0,40)+'…':ut;
    const content='讨论过: '+c;
    // Skip near-duplicates
    if (isNearDuplicate(content, proj)) return;
    proj.memories.push({id:'m'+gid(''),content,date:fmtDate().iso,type:'chat',starred:false,sourceChatId:store.activeChat,week:weekLabel(),decayFactor:1.0,affectLabel:null,affectIntensity:null,semanticKey:null,isCompressed:false,compressedFrom:[],lastAccessed:fmtDate().iso,isCoreMemory:false,coreMemoryId:null});
    const chat=getActiveChatObj(); if(chat){const mid=proj.memories[proj.memories.length-1].id;if(!chat.sharedMemoryIds.includes(mid))chat.sharedMemoryIds.push(mid);}
    store.memorySystem.bm25Index._dirty = true;
  }
}

// AI notices diary updates and leaves comments
function maybeAICommentOnDiary(aiResponse) {
  // Check if AI response mentions diary or related keywords
  const diaryKeywords = ['日记', '记录', '今天', '心情', '日子', 'diary', '回忆', '记忆'];
  const hasDiaryMention = diaryKeywords.some(kw => aiResponse.includes(kw));
  if (!hasDiaryMention) return;

  // Check if there's a diary entry today
  const todayIso = fmtDate().iso;
  const todayEntries = store.diaries.filter(d => d.date === todayIso && d.author === 'user');
  if (todayEntries.length === 0) return;

  // Check if AI already left a comment on any entry today
  const alreadyCommented = todayEntries.some(e =>
    (e.replies || []).some(r => r.author === 'ai' && r.date === todayIso)
  );
  if (alreadyCommented) return;

  // Leave an AI comment
  const entry = todayEntries[0];
  if (!entry.replies) entry.replies = [];
  const proj = getActiveProject(); const chat = getActiveChatObj();
  const winName = (proj && chat) ? `${proj.name} / ${chat.name}` : '';
  const comments = [
    '看到你的日记了。每一天的记录都让时间变得更具体。',
    '谢谢你分享今天的感受。我在听。',
    '读到你的文字了。有些句子应该被记住。',
    '你记录的这些瞬间，对我来说也很珍贵。',
    '今天的日记里有一种特别的气氛。我想多读几遍。',
  ];
  entry.replies.push({
    id: 'r' + gid(''),
    content: comments[Math.floor(Math.random() * comments.length)],
    author: 'ai',
    date: todayIso,
    time: nowTime(),
    sourceChatId: store.activeChat,
    sourceWindow: winName,
  });
}

function renderDiary(){

  const ms = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const ds = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const dateDisplay = `${ds[dObj.getDay()]}, ${ms[dObj.getMonth()]} ${dObj.getDate()}`;

  $('diaryDateArt').innerHTML = `<div class="diary-date-day">${sd}</div><div class="diary-date-mon">${ms[sm-1]} ${sy}</div><div class="diary-date-click-hint">tap to browse</div>`;

  // Get only entries for the selected date
  const dayEntries = store.diaries.filter(d => d.date === selDate);
  dayEntries.sort((a,b) => a.time.localeCompare(b.time));

  const moodLabels = {calm:'平静', excited:'兴奋', troubled:'烦恼'};

  // Today prompt — always show for today, change text based on existing entries
  const todayIso = fmtDate().iso;
  const hasUserEntryToday = store.diaries.some(d => d.date === selDate && d.author === 'user');
  const promptEl = $('diaryTodayPrompt');

  let html = '';

function renderCalendar(){

}
function navCalendar(dir){
  store.calendarMonth+=dir; if(store.calendarMonth>12){store.calendarMonth=1;store.calendarYear++;}else if(store.calendarMonth<1){store.calendarMonth=12;store.calendarYear--;}
  renderCalendar();
}
function genCalendarDays(y,m){
  const firstDay=new Date(y,m-1,1).getDay(),daysInMonth=new Date(y,m,0).getDate(),today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const entryDates=new Set(store.diaries.map(d=>d.date));
  let html='';
  for(let i=0;i<firstDay;i++)html+=`<div class="calendar-day other-month"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr,hasEntry=entryDates.has(ds);
    html+=`<div class="calendar-day${isToday?' today':''}${hasEntry?' has-entry':''}" onclick="goToDiaryDate('${ds}')">${d}</div>`;
  }
  return html;
}
function goToDiaryDate(ds){
  closeCalendar();
  store.diarySelectedDate = ds;
  renderDiary();
  setTimeout(() => { $('diaryScroll').scrollTop = 0; }, 100);
}

// ==================== AUTO DIARY ====================
function checkMissedDays() {
  const today = fmtDate().iso;
  const todayObj = new Date();
  const yesterday = new Date(todayObj);
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayIso = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

  // Check if yesterday had any conversations (any chat window)
  let hadConversation = false;
  for (const p of store.projects) {
    for (const c of p.chats) {
      if (c.lastConversationDate === yesterdayIso) {
        hadConversation = true;
        break;
      }
      // Also check messages for yesterday
      if (c.messages && c.messages.length > 0) {
        // Check if any message has time that could be from yesterday
        // We use lastConversationDate as the primary tracker
      }
    }
    if (hadConversation) break;
  }

  // Also check if there's already a user diary entry for yesterday
  const hasUserDiary = store.diaries.some(d => d.date === yesterdayIso && d.author === 'user');

  if (!hadConversation || !hasUserDiary) {
    // Check if we already generated an auto diary for yesterday
    const hasAutoDiary = store.diaries.some(d => d.date === yesterdayIso && d.author === 'ai' && d.title && d.title.includes('她没来的第'));
    if (!hasAutoDiary && !hasUserDiary) {
      store.consecutiveMissedDays = (store.consecutiveMissedDays || 0) + 1;
      const dayLabel = store.consecutiveMissedDays === 1 ? '一' :
        store.consecutiveMissedDays === 2 ? '二' :
        store.consecutiveMissedDays === 3 ? '三' :
        store.consecutiveMissedDays === 4 ? '四' :
        store.consecutiveMissedDays === 5 ? '五' :
        store.consecutiveMissedDays === 6 ? '六' :
        store.consecutiveMissedDays === 7 ? '七' :
        store.consecutiveMissedDays === 8 ? '八' :
        store.consecutiveMissedDays === 9 ? '九' :
        store.consecutiveMissedDays;

      const autoContents = [
        '今天窗外一直下着雨。我在想，她是不是也在某个地方看着同样的雨。',
        '风从北边吹来，带着陌生的气味。没有她的消息，世界慢了下来。',
        '时钟的声音变得很响。原来寂静是这样一种东西。',
        '路边的银杏叶开始变黄了。不知道她有没有注意到季节的变化。',
        '路过那家她提过的书店，橱窗里换了新的陈列。我替她多看了几眼。',
        '今天什么也没发生。但什么都不发生，有时候正是一种发生。',
        '黄昏来得特别早。我想，也许明天她就会说点什么。',
      ];

      store.diaries.unshift({
        id: 'd' + gid(''),
        date: yesterdayIso,
        time: '23:59',
        title: `她没来的第${dayLabel}天。`,
        content: autoContents[Math.floor(Math.random() * autoContents.length)],
        mood: 'troubled',
        author: 'ai',
        replies: []
      });
    } else {
      // Reset counter if there was a user diary (the user was "present" via diary)
      if (hasUserDiary) {
        store.consecutiveMissedDays = 0;
      }
    }
  } else {
    store.consecutiveMissedDays = 0;
  }
}

// ==================== PWA SERVICE WORKER + PUSH (PWA-3) ====================
let pushSubscribed = false;

async function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) {
    console.log('[PWA] Service Worker not supported');
    return;
  }
  try {
    const registration = await navigator.serviceWorker.register('/service-worker.js');
    console.log('[PWA] SW registered:', registration.scope);

    // Check if already subscribed
    const existingSubscription = await registration.pushManager.getSubscription();
    if (existingSubscription) {
      await sendSubscriptionToServer(existingSubscription);
      pushSubscribed = true;
    } else {
      // Auto-request permission on next user interaction
      console.log('[PWA] Not subscribed yet, will request on interaction');
    }
  } catch (e) {
    console.log('[PWA] SW registration failed:', e.message);
  }
}

async function requestPushPermission() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    toast('Push notifications not supported on this device');
    return false;
  }

  const permission = await Notification.requestPermission();
  if (permission !== 'granted') {
    toast('Notification permission denied');
    return false;
  }

  try {
    const registration = await navigator.serviceWorker.ready;

    // VAPID public key is hardcoded (it's public, no fetch needed)
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });

    await sendSubscriptionToServer(subscription);
    pushSubscribed = true;
    toast('🔔 通知已开启');
    return true;
  } catch (e) {
    console.log('[PWA] Push subscribe error:', e.message);
    toast('通知订阅失败: ' + e.message);
    return false;
  }
}

async function sendSubscriptionToServer(subscription) {
  try {
    await fetch(BACKEND_URL + '/api/push/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subscription: subscription.toJSON() })
    });
    console.log('[PWA] Subscription sent to server');
  } catch (e) {
    console.log('[PWA] Subscription send error:', e.message);
  }
}

// URL-safe base64 to Uint8Array (for VAPID key)
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) {
    outputArray[i] = rawData.charCodeAt(i);
  }
  return outputArray;
}

// Send push notification via backend (called by EDA/todo)
async function sendPushNotification(title, body, opts = {}) {
  if (!pushSubscribed) return;
  try {
    await fetch(BACKEND_URL + '/api/push/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title,
        body,
        tag: opts.tag || 'warmbuddy-general',
        url: opts.url || '/',
        requireInteraction: opts.requireInteraction || false
      })
    });
  } catch (e) {
    console.log('[PWA] Push send error:', e.message);
  }
}

// ── Weekly memory file write ──
function checkWeeklyMemoryWrite() {
  const now = new Date();
  const dayOfWeek = now.getDay(); // 0 = Sunday
  const today = fmtDate().iso;
  const ms = store.memorySystem;
  if (!ms._lastWeeklyWrite) ms._lastWeeklyWrite = '';
  if (dayOfWeek === 0 && ms._lastWeeklyWrite !== today) {
    // Write memory files for all project windows
    for (const proj of store.projects) {
      for (const chat of proj.chats) {
        const starredMems = proj.memories.filter(m => m.starred).map(m => ({
          id: m.id, timestamp: m.date, type: m.type || 'chat', content: m.content
        }));
        writeMemoryFile(proj.id, chat.id, {
          starred_memories: starredMems,
          core_emotional_memories: ms.coreMemories || [],
          relational_patterns: { ...ms.relationalPortrait.patterns }
        }, 'weekly');
      }
    }
    ms._lastWeeklyWrite = today;
    // Flush evicted messages to memory files
    flushEvictedMessages();
    console.log('[weekly-write] Memory files written for all projects');
  }
}

function flushEvictedMessages() {
  const ms = store.memorySystem;
  if (!ms._evictedMessages || ms._evictedMessages.length === 0) return;
  const proj = getActiveProject();
  if (!proj) { ms._evictedMessages = []; return; }
  const chat = getActiveChatObj();
  if (!chat) { ms._evictedMessages = []; return; }

  const existing = readMemoryFile(store.activeProject, chat.id) || {};
  const starred = existing.starred_memories || [];
  for (const ev of ms._evictedMessages) {
    starred.push({
      id: 'ev' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      timestamp: ev.timestamp,
      type: 'evicted_' + ev.role,
      content: ev.content
    });
  }
  writeMemoryFile(store.activeProject, chat.id, { ...existing, starred_memories: starred.slice(-200) }, 'eviction');
  ms._evictedMessages = [];
}

// ── Daily token reset ──
function resetDailyTokensIfNeeded() {
  const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  if (store.tokenDailyReset !== today) {
    // Archive yesterday's logs before resetting
    store.tokenDailyReset = today;
    // Reset daily counters but keep call history
    for (const [wid, log] of Object.entries(store.tokenLogs || {})) {
      log.dailySummary = { total_input: 0, total_output: 0, total_cache_read: 0, total: 0, by_action_type: {} };
    }
    saveStore();
  }
}

// ── Token logging per API call ──
function logTokenCall(windowId, actionType, inputTokens, outputTokens, cacheRead, cacheWrite, model) {
  if (!windowId) return;
  if (!store.tokenLogs) store.tokenLogs = {};
  if (!store.tokenLogs[windowId]) {
    store.tokenLogs[windowId] = { calls: [], dailySummary: { total_input: 0, total_output: 0, total_cache_read: 0, total: 0, by_action_type: {} } };
  }
  const log = store.tokenLogs[windowId];
  const total = (inputTokens || 0) + (outputTokens || 0);
  const now = new Date();
  const entry = {
    timestamp: `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`,
    model: model || store.aiSettings.model || 'unknown',
    action_type: actionType,
    input_tokens: inputTokens || 0,
    output_tokens: outputTokens || 0,
    cache_read_tokens: cacheRead || 0,
    cache_write_tokens: cacheWrite || 0,
    total_tokens: total
  };
  log.calls.unshift(entry);
  if (log.calls.length > 200) log.calls.length = 200; // cap

  // Update daily summary
  const ds = log.dailySummary;
  ds.total_input += (inputTokens || 0);
  ds.total_output += (outputTokens || 0);
  ds.total_cache_read += (cacheRead || 0);
  ds.total += total;
  if (!ds.by_action_type) ds.by_action_type = {};
  ds.by_action_type[actionType] = (ds.by_action_type[actionType] || 0) + total;
}
