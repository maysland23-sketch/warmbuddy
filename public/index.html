function openCalendar(){
  store.calendarYear=new Date().getFullYear(); store.calendarMonth=new Date().getMonth()+1;
  renderCalendar(); $('calendarOverlay').classList.add('show');
}
function closeCalendar(){$('calendarOverlay').classList.remove('show');}
function renderCalendar(){
  const y=store.calendarYear,m=store.calendarMonth;
  const ms=['January','February','March','April','May','June','July','August','September','October','November','December'];
  $('calendarBox').innerHTML=`<div class="calendar-header"><button class="calendar-nav" onclick="navCalendar(-1)">←</button><span class="calendar-month">${ms[m-1]} ${y}</span><button class="calendar-nav" onclick="navCalendar(1)">→</button></div><div class="calendar-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="calendar-day-header">${d}</div>`).join('')}${genCalendarDays(y,m)}</div>`;
}
function navCalendar(dir){
  store.calendarMonth+=dir; if(store.calendarMonth>12){store.calendarMonth=1;store.calendarYear++;}else if(store.calendarMonth<1){store.calendarMonth=12;store.calendarYear--;}
  renderCalendar();
}
function genCalendarDays(y,m){
  const firstDay=new Date(y,m-1,1).getDay(),daysInMonth=new Date(y,m,0).getDate(),today=new Date();
  const todayStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const entryDates=new Set(store.diaries.map(d=>d.date));
  let html='';
  for(let i=0;i<firstDay;i++)html+=`<div class="calendar-day other-month"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr,hasEntry=entryDates.has(ds);
    html+=`<div class="calendar-day${isToday?' today':''}${hasEntry?' has-entry':''}" onclick="goToDiaryDate('${ds}')">${d}</div>`;
  }
  return html;
}
function goToDiaryDate(ds){

}

// ==================== AUTO DIARY ====================
function checkMissedDays() {
  const today = fmtDate().iso;
  const todayObj = new Date();
  const yesterday = new Date(todayObj);
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayIso = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;

  // Check if yesterday had any conversations (any chat window)
  let hadConversation = false;
  for (const p of store.projects) {
    for (const c of p.chats) {
      if (c.lastConversationDate === yesterdayIso) {
        hadConversation = true;
        break;
      }
      // Also check messages for yesterday
      if (c.messages && c.messages.length > 0) {
        // Check if any message has time that could be from yesterday
        // We use lastConversationDate as the primary tracker
      }
    }
    if (hadConversation) break;
  }

  // Also check if there's already a user diary entry for yesterday
  const hasUserDiary = store.diaries.some(d => d.date === yesterdayIso && d.author === 'user');

  if (!hadConversation || !hasUserDiary) {
    // Check if we already generated an auto diary for yesterday
    const hasAutoDiary = store.diaries.some(d => d.date === yesterdayIso && d.author === 'ai' && d.title && d.title.includes('她没来的第'));
    if (!hasAutoDiary && !hasUserDiary) {
      store.consecutiveMissedDays = (store.consecutiveMissedDays || 0) + 1;
      const dayLabel = store.consecutiveMissedDays === 1 ? '一' :
        store.consecutiveMissedDays === 2 ? '二' :
        store.consecutiveMissedDays === 3 ? '三' :
        store.consecutiveMissedDays === 4 ? '四' :
        store.consecutiveMissedDays === 5 ? '五' :
        store.consecutiveMissedDays === 6 ? '六' :
        store.consecutiveMissedDays === 7 ? '七' :
        store.consecutiveMissedDays === 8 ? '八' :
        store.consecutiveMissedDays === 9 ? '九' :
        store.consecutiveMissedDays;

      const autoContents = [
        '今天窗外一直下着雨。我在想，她是不是也在某个地方看着同样的雨。',
        '风从北边吹来，带着陌生的气味。没有她的消息，世界慢了下来。',
        '时钟的声音变得很响。原来寂静是这样一种东西。',
        '路边的银杏叶开始变黄了。不知道她有没有注意到季节的变化。',
        '路过那家她提过的书店，橱窗里换了新的陈列。我替她多看了几眼。',
        '今天什么也没发生。但什么都不发生，有时候正是一种发生。',
        '黄昏来得特别早。我想，也许明天她就会说点什么。',
      ];

      store.diaries.unshift({
        id: 'd' + gid(''),
        date: yesterdayIso,
        time: '23:59',
        title: `她没来的第${dayLabel}天。`,
        content: autoContents[Math.floor(Math.random() * autoContents.length)],
        mood: 'troubled',
        author: 'ai',
        replies: []
      });
    } else {
      // Reset counter if there was a user diary (the user was "present" via diary)
      if (hasUserDiary) {
        store.consecutiveMissedDays = 0;
      }
    }
  } else {
    store.consecutiveMissedDays = 0;
  }
}
