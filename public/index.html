<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6B7C93">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="暖伴">
<link rel="manifest" href="/manifest.json">
<title>暖伴 · 朝夕</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #F5F0EB;
  --bg-card: #FBF9F7;
  --bg-card-hover: #F7F3EF;
  --text: #4A4543;
  --text-light: #8C8580;
  --text-lighter: #B5AEAA;
  --accent: #B8A99A;
  --accent-soft: #D4C9BF;
  --accent-pale: #E8E0D8;
  --border: #E5DFD8;
  --border-light: #F0EBE5;
  --danger: #C4877B;
  --danger-light: #F5E8E5;
  --shadow: 0 1px 3px rgba(74, 69, 67, 0.04);
  --shadow-md: 0 2px 8px rgba(74, 69, 67, 0.06);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --font-cn: "Source Han Serif SC", "Noto Serif CJK SC", "SimSun", "STSong", serif;
  --font-en: "Times New Roman", "Times", "Georgia", serif;
  --safe-bottom: env(safe-area-inset-bottom, 12px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
body {
  font-family: var(--font-cn);
  background: var(--bg);
  color: var(--text);
  font-size: 15px; line-height: 1.6; letter-spacing: 0.02em;
  display: flex; justify-content: center; align-items: center;
}

.app {
  width: 100%; max-width: 430px;
  height: 100vh; height: 100dvh;
  background: var(--bg);
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
  box-shadow: 0 0 60px rgba(74, 69, 67, 0.08);
}

/* ===== Top Bar ===== */
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 20px 6px; flex-shrink: 0;
}
.top-bar-left { display: flex; align-items: center; gap: 10px; }
.top-bar-right { display: flex; align-items: center; }
.back-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 15px; color: var(--text-light); transition: all 0.2s; flex-shrink: 0;
}
.back-btn:active { background: var(--bg-card-hover); }
.top-bar-label {
  font-family: var(--font-en); font-size: 13px; color: var(--text-light); letter-spacing: 0.04em;
}
.avatar-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--border); background: var(--bg-card);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 17px; color: var(--text-light); transition: all 0.2s;
}
.avatar-btn:active { background: var(--bg-card-hover); transform: scale(0.95); }

/* ===== Main Scroll ===== */
.main-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 0 20px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
}
.main-scroll::-webkit-scrollbar { width: 0; }

/* ===== Date & Greeting ===== */
.date-block { padding: 10px 0 6px; }
.date-main {
  font-family: var(--font-en); font-size: 28px; font-weight: 400;
  color: var(--text); letter-spacing: -0.01em; line-height: 1.2;
}
.date-weekday { font-size: 13px; color: var(--text-lighter); margin-top: 2px; font-family: var(--font-en); }

.greeting-block { padding: 16px 0 24px; }
.greeting-wave { font-family: var(--font-en); font-size: 15px; color: var(--text-lighter); letter-spacing: 0.04em; margin-bottom: 4px; }
.greeting-name { font-family: var(--font-en); font-size: 32px; font-weight: 400; color: var(--text); letter-spacing: -0.01em; line-height: 1.2; }

/* ===== Section ===== */
.section { margin-bottom: 14px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 2px; }
.section-title { font-size: 12px; color: var(--text-lighter); letter-spacing: 0.08em; text-transform: lowercase; font-family: var(--font-en); }
.section-add { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-light); background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; color: var(--accent); transition: all 0.2s; }
.section-add:active { background: var(--accent-pale); }

.card {
  background: var(--bg-card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: var(--shadow); border: 1px solid var(--border-light);
  transition: all 0.25s; cursor: pointer; margin-bottom: 8px; position: relative;
}
.card:active { background: var(--bg-card-hover); transform: scale(0.985); }

/* ===== To-do Tabs ===== */
.todo-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.todo-tab {
  padding: 5px 14px; border-radius: 16px; border: 1px solid var(--border-light); background: transparent;
  font-family: var(--font-en); font-size: 11px; color: var(--text-lighter); cursor: pointer;
  letter-spacing: 0.06em; transition: all 0.2s;
}
.todo-tab.active { background: var(--accent-pale); border-color: transparent; color: var(--text); }

/* ===== Swipe Container ===== */
.swipe-container { position: relative; overflow: hidden; border-radius: var(--radius); margin-bottom: 8px; }
.swipe-content {
  position: relative; z-index: 1; background: var(--bg-card);
  border-radius: var(--radius); padding: 16px 18px;
  box-shadow: var(--shadow); border: 1px solid var(--border-light);
  transition: transform 0.25s ease; cursor: pointer; touch-action: pan-y;
}
.swipe-delete {
  position: absolute; right: 0; top: 0; bottom: 0;
  width: 72px; background: var(--danger-light); border-radius: 0 var(--radius) var(--radius) 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--danger); cursor: pointer;
  font-family: var(--font-en); letter-spacing: 0.04em; z-index: 0;
}

/* ===== Todo Card ===== */
.card-todo { display: flex; align-items: center; gap: 12px; }
.todo-check {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--accent-soft);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent; transition: all 0.25s;
}
.todo-check.done { background: var(--accent-soft); color: #fff; border-color: var(--accent-soft); }
.todo-text { flex: 1; font-size: 15px; color: var(--text); line-height: 1.4; }
.todo-text.done { text-decoration: line-through; color: var(--text-lighter); }
.todo-time { font-family: var(--font-en); font-size: 11px; color: var(--text-lighter); flex-shrink: 0; }

/* Goal card */
.goal-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.goal-progress-wrap { flex: 1; height: 4px; background: var(--border-light); border-radius: 2px; overflow: hidden; }
.goal-progress-fill { height: 100%; background: var(--accent-soft); border-radius: 2px; transition: width 0.3s; }
.goal-deadline {
  font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); flex-shrink: 0;
  padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border-light);
}
.goal-deadline.urgent { color: var(--danger); border-color: var(--danger-light); background: var(--danger-light); }

/* ===== Litter Box ===== */
.litter-box-wrap { display: flex; justify-content: center; padding: 12px 0 4px; }
.litter-box-icon {
  width: 72px; height: 72px; background: var(--bg-card);
  border: 1.5px solid var(--border); border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; cursor: pointer; transition: all 0.25s;
  box-shadow: var(--shadow); position: relative;
}
.litter-box-icon:active { background: var(--bg-card-hover); }
.litter-box-icon.shake { animation: litterShake 0.6s ease-in-out; }
@keyframes litterShake {
  0%,100%{transform:rotate(0)}15%{transform:rotate(-8deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-6deg)}60%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}
}
.litter-box-dot { position: absolute; top: 8px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-soft); display: none; }
.litter-box-dot.has-thoughts { display: block; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)} }

.litter-thought-card {
  margin-top: 12px; background: var(--bg-card); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow-md); border: 1px solid var(--border-light);
  animation: thoughtIn 0.4s ease-out; position: relative;
}
@keyframes thoughtIn { from{opacity:0;transform:translateY(-10px)scale(0.96)}to{opacity:1;transform:translateY(0)scale(1)} }
.litter-thought-close { position: absolute; top: 8px; right: 12px; background: none; border: none; font-size: 14px; color: var(--text-lighter); cursor: pointer; padding: 4px; }
.thought-emoji { font-size: 20px; margin-bottom: 6px; }
.thought-text { font-size: 14px; color: var(--text); line-height: 1.6; }
.thought-date { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); margin-top: 8px; }

.empty-state { text-align: center; padding: 16px; color: var(--text-lighter); font-size: 13px; font-family: var(--font-en); letter-spacing: 0.04em; }

/* ===== Bottom Nav ===== */
.bottom-nav {
  display: flex; justify-content: space-around; align-items: center;
  padding: 8px 20px calc(8px + var(--safe-bottom));
  background: var(--bg-card); border-top: 1px solid var(--border-light); flex-shrink: 0;
}
.nav-item {
  cursor: pointer; padding: 8px 18px; border-radius: 20px; transition: all 0.2s;
  border: none; background: none; font-family: var(--font-en);
  font-size: 12px; color: var(--text-lighter); letter-spacing: 0.06em; text-transform: lowercase;
}
.nav-item:active { background: var(--bg-card-hover); }
.nav-item.active { color: var(--accent); }

/* ===== Overlay ===== */
.overlay { position: fixed; inset: 0; background: rgba(74,69,67,0.2); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.overlay.show { opacity: 1; pointer-events: auto; }

/* ===== Side Panels ===== */
.settings-panel, .project-sidebar, .memory-panel {
  position: absolute; top: 0; width: 280px; height: 100%;
  background: var(--bg-card); z-index: 200; display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.settings-panel, .memory-panel { right: 0; transform: translateX(100%); box-shadow: -4px 0 20px rgba(74,69,67,0.06); }
.project-sidebar { left: 0; transform: translateX(-100%); box-shadow: 4px 0 20px rgba(74,69,67,0.06); }
.settings-panel.open, .memory-panel.open, .project-sidebar.open { transform: translateX(0); }

.panel-header { padding: 20px; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
.panel-title { font-family: var(--font-en); font-size: 15px; letter-spacing: 0.04em; color: var(--text); }
.panel-close { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 16px; color: var(--text-light); display: flex; align-items: center; justify-content: center; }
.panel-body { flex: 1; overflow-y: auto; padding: 16px; }
.panel-body::-webkit-scrollbar, .project-list::-webkit-scrollbar { width: 0; }

/* Settings */
.settings-group { margin-bottom: 20px; }
.settings-group-label { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); letter-spacing: 0.08em; margin-bottom: 8px; padding: 0 4px; }
.settings-item { padding: 12px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.settings-item:active { background: var(--bg-card-hover); }
.settings-item .si-label { color: var(--text); }
.settings-item .si-val { font-family: var(--font-en); font-size: 12px; color: var(--text-lighter); }

.toggle-switch { width: 42px; height: 24px; border-radius: 12px; background: var(--border); position: relative; transition: background 0.25s; cursor: pointer; flex-shrink: 0; }
.toggle-switch.on { background: var(--accent-soft); }
.toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.25s; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.toggle-switch.on::after { transform: translateX(18px); }

/* Project sidebar */
.project-list { flex: 1; overflow-y: auto; padding: 12px; }
.project-item { padding: 12px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
.project-item:active { background: var(--bg-card-hover); }
.project-item.active { background: var(--accent-pale); }
.project-item-name { font-size: 14px; color: var(--text); }
.project-item-meta { font-family: var(--font-en); font-size: 11px; color: var(--text-lighter); margin-top: 2px; }
.project-chat-item { padding: 10px 14px 10px 28px; border-radius: var(--radius-xs); cursor: pointer; transition: all 0.2s; font-size: 13px; color: var(--text-light); display: flex; align-items: center; gap: 8px; }
.project-chat-item:active { background: var(--bg-card-hover); }
.project-chat-item.active { color: var(--accent); }
.project-chat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-soft); flex-shrink: 0; }

/* Memory panel */
.memory-panel-tabs { display: flex; gap: 4px; padding: 12px 16px 8px; }
.memory-tab { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border-light); background: transparent; font-family: var(--font-en); font-size: 11px; color: var(--text-light); cursor: pointer; letter-spacing: 0.04em; transition: all 0.2s; }
.memory-tab.active { background: var(--accent-pale); border-color: transparent; }
.memory-list-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 10px; border-radius: var(--radius-xs); transition: all 0.2s; border-bottom: 1px solid var(--border-light); }
.memory-star { font-size: 16px; cursor: pointer; color: var(--text-lighter); flex-shrink: 0; padding-top: 1px; transition: all 0.2s; }
.memory-star.starred { color: #D4B87A; }
.memory-checkbox { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--accent-soft); flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; transition: all 0.2s; }
.memory-checkbox.checked { background: var(--accent-soft); color: #fff; }
.memory-item-content { flex: 1; font-size: 13px; color: var(--text); line-height: 1.5; }
.memory-item-meta { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); margin-top: 3px; }
.export-item { padding: 12px 14px; border-radius: var(--radius-xs); background: var(--bg); margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
.export-item:active { background: var(--bg-card-hover); }
.export-item-name { font-family: var(--font-en); font-size: 13px; color: var(--text); }
.export-item-date { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); margin-top: 2px; }
.affect-badge { font-family: var(--font-en); font-size: 10px; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.03em; white-space: nowrap; display: inline-block; }
.intensity-bar { height: 3px; border-radius: 2px; background: var(--border-light); margin-top: 2px; }
.intensity-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.3s; }
.import-btn { display: flex; align-items: center; justify-content: center; gap: 6px; }
.import-preview-list { max-height: 300px; overflow-y: auto; margin-top: 8px; }
/* Proactive message bubble (EDA) */
.proactive-bubble { border-left: 3px solid var(--accent-soft); padding-left: 10px; }
.proactive-bubble .proactive-label { font-family: var(--font-en); font-size: 9px; color: var(--accent-soft); letter-spacing: 0.04em; margin-bottom: 2px; text-transform: uppercase; }
/* Desire drive bars */
.desire-bar-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.desire-bar-label { font-family: var(--font-en); font-size: 10px; color: var(--text-light); width: 80px; flex-shrink: 0; text-align: right; letter-spacing: 0.03em; }
.desire-bar-track { flex: 1; height: 6px; border-radius: 3px; background: var(--border-light); overflow: hidden; }
.desire-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.desire-bar-val { font-family: var(--font-en); font-size: 9px; color: var(--text-lighter); width: 28px; flex-shrink: 0; }

/* ===== Pages ===== */
.page { display: none; flex-direction: column; height: 100%; }
.page.active { display: flex; }

/* ===== Chat Page ===== */
.chat-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border-light); flex-shrink: 0; }
.chat-header-left { display: flex; align-items: center; gap: 10px; }
.chat-project-tag { padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; font-family: var(--font-en); font-size: 12px; color: var(--text-light); cursor: pointer; letter-spacing: 0.04em; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
.chat-project-tag:active { background: var(--bg-card-hover); }
.chat-project-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-soft); }
.chat-header-right { display: flex; gap: 2px; }
.chat-header-btn { padding: 6px 9px; border-radius: var(--radius-xs); border: none; background: transparent; font-size: 11px; color: var(--text-light); cursor: pointer; font-family: var(--font-en); letter-spacing: 0.03em; transition: all 0.2s; }
.chat-header-btn:active { background: var(--bg-card-hover); }

.chat-messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
.chat-messages::-webkit-scrollbar { width: 0; }

/* Chat avatar */
.chat-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 2px; }
.chat-row.user { justify-content: flex-end; }
.chat-row.ai { justify-content: flex-start; }
.chat-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-en); font-size: 10px; letter-spacing: 0.04em;
}
.chat-avatar.user { background: var(--accent-pale); color: var(--text); order: 2; }
.chat-avatar.ai { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-light); order: 0; font-size: 13px; }

.chat-bubble {
  max-width: 78%; padding: 10px 14px; border-radius: 16px;
  font-size: 14px; line-height: 1.5; animation: bubbleIn 0.25s ease-out;
  cursor: pointer; position: relative;
}
@keyframes bubbleIn { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)} }
.chat-bubble.user { background: var(--accent-pale); border-bottom-right-radius: 4px; }
.chat-bubble.ai { background: var(--bg-card); border: 1px solid var(--border-light); border-bottom-left-radius: 4px; }

/* Time outside bubble */
.chat-bubble-wrap { display: flex; flex-direction: column; max-width: 78%; }
.chat-row.user .chat-bubble-wrap { align-items: flex-end; }
.chat-row.ai .chat-bubble-wrap { align-items: flex-start; }
.chat-bubble-wrap .chat-bubble { max-width: 100%; }
.bubble-time {
  font-family: var(--font-en); font-size: 9px;
  color: var(--text-lighter); letter-spacing: 0.04em;
  padding: 2px 6px 0; opacity: 0.6;
}
/* WeChat-style system message */
.chat-system-msg {
  text-align: center; padding: 6px 0; margin: 2px 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.chat-system-msg-text {
  font-size: 11px; color: var(--text-lighter); opacity: 0.7;
  letter-spacing: 0.03em;
}
.chat-system-msg-time {
  font-family: var(--font-en); font-size: 9px; color: var(--text-lighter); opacity: 0.4;
}

/* Bubble actions */
.bubble-actions {
  display: flex; gap: 12px; padding: 4px 8px 0;
  font-size: 14px; animation: fadeIn 0.2s ease-out;
}
@keyframes fadeIn { from{opacity:0}to{opacity:1} }
.bubble-actions span {
  cursor: pointer; opacity: 0.5; transition: all 0.2s;
  font-size: 14px; user-select: none;
}
.bubble-actions span:active { opacity: 1; transform: scale(1.2); }
.bubble-actions .ba-star { color: #D4B87A; }

/* Typing indicator */
.typing-indicator {
  text-align: left; padding: 4px 0 4px 40px;
  font-size: 12px; color: var(--text-lighter); font-family: var(--font-en);
  letter-spacing: 0.03em; animation: fadeIn 0.3s ease-out;
}

.chat-input-area { padding: 12px 20px calc(12px + var(--safe-bottom)); border-top: 1px solid var(--border-light); display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
.chat-input { flex: 1; padding: 10px 16px; border-radius: 24px; border: 1px solid var(--border); background: var(--bg-card); font-family: var(--font-cn); font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s; }
.chat-input:focus { border-color: var(--accent-soft); }
.chat-input::placeholder { color: var(--text-lighter); }
.chat-send { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--accent-soft); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.chat-send:active { transform: scale(0.93); background: var(--accent); }

/* ===== Bookshelf ===== */
.reading-note-card { background: var(--bg-card); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); border: 1px solid var(--border-light); border-left: 3px solid var(--accent-soft); margin-bottom: 20px; }
.reading-note-label { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); letter-spacing: 0.08em; margin-bottom: 4px; text-transform: uppercase; }
.reading-note-book { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
.reading-note-text { font-size: 14px; color: var(--text); line-height: 1.6; font-style: italic; }
.reading-note-meta { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); margin-top: 8px; }

.bookshelf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.book-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px 16px; box-shadow: var(--shadow); border: 1px solid var(--border-light); cursor: pointer; transition: all 0.2s; text-align: center; }
.book-card:active { transform: scale(0.97); background: var(--bg-card-hover); }
.book-cover { font-size: 40px; margin-bottom: 10px; }
.book-title { font-size: 13px; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
.book-author { font-family: var(--font-en); font-size: 11px; color: var(--text-lighter); }
.book-progress { margin-top: 10px; height: 3px; background: var(--border-light); border-radius: 2px; overflow: hidden; }
.book-progress-bar { height: 100%; background: var(--accent-soft); border-radius: 2px; transition: width 0.3s; }

/* Book detail */
.book-detail-overlay { position: fixed; inset: 0; background: rgba(74,69,67,0.3); z-index: 300; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.book-detail-overlay.show { opacity: 1; pointer-events: auto; }
.book-detail-panel { background: var(--bg-card); border-radius: 20px 20px 0 0; width: 100%; max-width: 430px; max-height: 80vh; overflow-y: auto; padding: 24px 20px 30px; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); }
.book-detail-overlay.show .book-detail-panel { transform: translateY(0); }
.book-detail-panel::-webkit-scrollbar { width: 0; }
.book-detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.book-detail-info h3 { font-size: 18px; margin-bottom: 4px; }
.book-detail-progress { margin: 12px 0 20px; height: 4px; background: var(--border-light); border-radius: 2px; overflow: hidden; }
.book-detail-progress-bar { height: 100%; background: var(--accent-soft); border-radius: 2px; }

.highlight-item { background: var(--bg); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px; border-left: 3px solid var(--accent-soft); }
.highlight-text { font-size: 14px; color: var(--text); line-height: 1.6; font-style: italic; }
.highlight-note { font-size: 13px; color: var(--text-light); margin-top: 8px; padding-left: 8px; border-left: 2px solid var(--border); }
.highlight-actions { display: flex; gap: 8px; margin-top: 10px; }
.highlight-btn { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--border); background: transparent; font-family: var(--font-en); font-size: 11px; color: var(--text-light); cursor: pointer; letter-spacing: 0.03em; transition: all 0.2s; }
.highlight-btn:active { background: var(--bg-card-hover); }
.note-ai-response { margin-top: 10px; padding: 12px 14px; background: var(--bg-card); border-radius: var(--radius-xs); border: 1px solid var(--border-light); font-size: 13px; color: var(--text); line-height: 1.5; }
.note-ai-source { font-family: var(--font-en); font-size: 10px; color: var(--accent); margin-top: 6px; cursor: pointer; letter-spacing: 0.03em; display: inline-block; }

/* ===== Diary ===== */
.diary-date-art { text-align: center; padding: 24px 0 12px; cursor: pointer; transition: opacity 0.2s; }
.diary-date-art:active { opacity: 0.7; }
.diary-date-day { font-family: var(--font-en); font-size: 56px; font-weight: 400; color: var(--text); line-height: 1; letter-spacing: -0.02em; }
.diary-date-mon { font-family: var(--font-en); font-size: 15px; color: var(--text-lighter); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }
.diary-date-click-hint { font-size: 10px; color: var(--text-lighter); margin-top: 2px; font-family: var(--font-en); letter-spacing: 0.04em; }

.diary-today-prompt {
  text-align: center; padding: 18px; margin: 0 0 16px;
  background: var(--bg-card); border-radius: var(--radius); border: 1px dashed var(--border);
  cursor: pointer; transition: all 0.2s;
}
.diary-today-prompt:active { background: var(--bg-card-hover); }
.diary-today-prompt-text { font-size: 14px; color: var(--text-lighter); }

.diary-date-separator { text-align: center; padding: 16px 0 8px; }
.diary-date-sep-text { font-family: var(--font-en); font-size: 12px; color: var(--text-lighter); letter-spacing: 0.06em; }

.diary-card-entry {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 18px 20px; margin-bottom: 10px;
  box-shadow: var(--shadow); border: 1px solid var(--border-light); position: relative;
}
.diary-card-entry.ai-entry { background: var(--bg); border: 1px solid var(--border-light); }

.diary-card-title { font-size: 16px; color: var(--text); font-weight: 500; margin-bottom: 6px; line-height: 1.3; }
.diary-card-mood-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.diary-card-mood-tag { font-size: 11px; color: var(--text-light); padding: 2px 10px; border-radius: 12px; background: var(--accent-pale); font-family: var(--font-en); letter-spacing: 0.03em; }
.diary-card-time { font-family: var(--font-en); font-size: 11px; color: var(--text-lighter); }
.diary-card-content { font-size: 14px; color: var(--text); line-height: 1.7; }
.diary-card-by { font-family: var(--font-en); font-size: 11px; color: var(--text-lighter); margin-top: 10px; letter-spacing: 0.04em; }

/* Diary reply area */
.diary-reply-area { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-light); }
.diary-reply-item { padding: 10px 14px; border-radius: var(--radius-xs); margin-bottom: 8px; font-size: 13px; line-height: 1.5; }
.diary-reply-item.ai-reply { background: var(--bg); }
.diary-reply-item.user-reply { background: var(--accent-pale); }
.diary-reply-content { color: var(--text); }
.diary-reply-meta { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); margin-top: 4px; letter-spacing: 0.03em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.diary-reply-source { font-size: 10px; color: var(--accent); cursor: pointer; letter-spacing: 0.03em; padding: 1px 6px; border-radius: 8px; background: var(--accent-pale); transition: all 0.2s; white-space: nowrap; }
.diary-reply-source:active { opacity: 0.7; }
.diary-reply-tap { text-align: center; padding: 8px; font-family: var(--font-en); font-size: 11px; color: var(--text-lighter); cursor: pointer; letter-spacing: 0.04em; border-radius: var(--radius-xs); transition: all 0.2s; }
.diary-reply-tap:active { background: var(--bg-card-hover); color: var(--accent); }

/* AI reply under user entry */
.ai-reply-block { margin-left: 16px; margin-top: 8px; padding: 12px 16px; background: var(--bg); border-radius: var(--radius-sm); border: 1px solid var(--border-light); font-size: 13px; color: var(--text); line-height: 1.5; }
.ai-reply-by { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); margin-top: 6px; }

/* Mood tag */
.mood-tag { padding: 6px 18px; border-radius: 20px; border: 1px solid var(--border); background: transparent; font-size: 13px; color: var(--text-light); cursor: pointer; transition: all 0.2s; font-family: var(--font-cn); }
.mood-tag:active { background: var(--bg-card-hover); }
.mood-tag.selected { background: var(--accent-pale); border-color: transparent; color: var(--text); }

/* Calendar overlay */
.calendar-overlay { position: fixed; inset: 0; background: rgba(74,69,67,0.3); z-index: 300; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.calendar-overlay.show { opacity: 1; pointer-events: auto; }
.calendar-box { background: var(--bg-card); border-radius: var(--radius); padding: 24px; width: 300px; max-width: 90vw; box-shadow: var(--shadow-md); }
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.calendar-month { font-family: var(--font-en); font-size: 16px; letter-spacing: 0.04em; color: var(--text); }
.calendar-nav { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: transparent; cursor: pointer; font-size: 14px; color: var(--text-light); display: flex; align-items: center; justify-content: center; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.calendar-day-header { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); padding: 4px 0; letter-spacing: 0.04em; }
.calendar-day { padding: 8px 4px; border-radius: 50%; cursor: pointer; font-family: var(--font-en); font-size: 13px; color: var(--text); transition: all 0.2s; position: relative; }
.calendar-day:active { background: var(--bg-card-hover); }
.calendar-day.other-month { color: var(--text-lighter); }
.calendar-day.today { border: 1.5px solid var(--accent-soft); }
.calendar-day.has-entry::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent-soft); }
.calendar-day.selected { background: var(--accent-pale); }

/* ===== Modal ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(74,69,67,0.3); z-index: 400; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal { background: var(--bg-card); border-radius: var(--radius); padding: 24px; width: 310px; max-width: 90vw; max-height: 70vh; overflow-y: auto; box-shadow: var(--shadow-md); }
.modal::-webkit-scrollbar { width: 0; }
.modal-title { font-family: var(--font-en); font-size: 16px; margin-bottom: 16px; letter-spacing: 0.04em; }
.modal-input { width: 100%; padding: 10px 14px; border-radius: var(--radius-xs); border: 1px solid var(--border); background: var(--bg); font-family: var(--font-cn); font-size: 14px; color: var(--text); outline: none; margin-bottom: 10px; }
.modal-input:focus { border-color: var(--accent-soft); }
.modal-textarea { resize: none; min-height: 80px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.modal-btn { padding: 8px 20px; border-radius: 20px; border: none; font-family: var(--font-en); font-size: 13px; cursor: pointer; letter-spacing: 0.03em; transition: all 0.2s; }
.modal-btn:active { transform: scale(0.96); }
.modal-btn.cancel { background: transparent; color: var(--text-light); border: 1px solid var(--border); }
.modal-btn.confirm { background: var(--accent-soft); color: #fff; }

.toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--text); color: #fff; padding: 10px 22px; border-radius: 24px; font-size: 13px; z-index: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; font-family: var(--font-en); }
.toast.show { opacity: 1; }

.import-btn { display: block; width: 100%; padding: 12px; border-radius: var(--radius-xs); border: 1px dashed var(--border); background: transparent; font-family: var(--font-en); font-size: 13px; color: var(--text-lighter); cursor: pointer; letter-spacing: 0.04em; text-align: center; transition: all 0.2s; margin-top: 6px; }
.import-btn:active { background: var(--bg-card-hover); }

.chat-select-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-xs); cursor: pointer; transition: all 0.2s; }
.chat-select-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--accent-soft); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: transparent; transition: all 0.2s; }
.chat-select-check.checked { background: var(--accent-soft); color: #fff; }
.chat-select-name { font-size: 13px; color: var(--text); }
.chat-select-project { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); margin-left: auto; }

/* Goal detail modal */
.goal-log-item { padding: 8px 0; border-bottom: 1px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.goal-log-date { font-family: var(--font-en); font-size: 11px; color: var(--text-lighter); }

/* Connection test */
.test-conn-btn { width: 100%; padding: 10px; border-radius: 20px; border: 1px solid var(--accent-soft); background: var(--accent-pale); font-family: var(--font-en); font-size: 13px; color: var(--text); cursor: pointer; letter-spacing: 0.03em; transition: all 0.2s; margin-top: 8px; }
.test-conn-btn:active { transform: scale(0.97); }
.test-conn-btn:disabled { opacity: 0.5; pointer-events: none; }
.conn-status { padding: 8px 12px; border-radius: var(--radius-xs); font-family: var(--font-en); font-size: 12px; letter-spacing: 0.03em; margin-top: 8px; text-align: center; }
.conn-status.success { background: #E8F0E8; color: #5A8A5A; }
.conn-status.error { background: #F5E8E5; color: var(--danger); }
.conn-status.testing { background: var(--accent-pale); color: var(--text-light); }
.preset-chip { font-family: var(--font-en); }
.preset-chip:hover { border-color: var(--accent) !important; background: var(--accent-pale) !important; }
.preset-chip.active { border-color: var(--accent) !important; background: var(--accent-pale) !important; font-weight: 500; }

/* Context menu */
.context-menu { position: fixed; background: var(--bg-card); border-radius: var(--radius-sm); box-shadow: var(--shadow-md); z-index: 500; padding: 4px 0; min-width: 130px; display: none; border: 1px solid var(--border); }
.context-menu.show { display: block; }
.context-menu-item { padding: 10px 16px; font-size: 14px; color: var(--text); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 8px; font-family: var(--font-en); letter-spacing: 0.03em; }
.context-menu-item:active { background: var(--bg-card-hover); }
.context-menu-item.danger { color: var(--danger); }

/* Model select list */
.model-select-item { padding: 12px 14px; border-radius: var(--radius-xs); cursor: pointer; transition: all 0.2s; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
.model-select-item:active { background: var(--bg-card-hover); }
.model-select-item.selected { background: var(--accent-pale); }
.model-select-name { font-size: 14px; color: var(--text); }
.model-select-id { font-family: var(--font-en); font-size: 10px; color: var(--text-lighter); }

/* Token per window */
.token-per-window { background: var(--bg); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 8px; }
.token-per-window-name { font-size: 13px; color: var(--text); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
.token-per-window-bar { height: 3px; background: var(--border-light); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.token-per-window-fill { height: 100%; background: var(--accent-soft); border-radius: 2px; transition: width 0.3s; }

/* Streaming cursor */
.streaming-cursor { animation: blink 1s step-end infinite; color: var(--accent); font-weight: bold; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }

/* Command hint */
.command-hint { display: inline-block; padding: 1px 6px; border-radius: 8px; background: var(--accent-pale); font-family: var(--font-en); font-size: 10px; color: var(--text-light); margin: 0 2px; letter-spacing: 0.03em; }
</style>
</head>
<body>

<div class="app" id="app">
<div class="overlay" id="overlay" onclick="closeAllPanels()"></div>

<!-- ==================== HOME ==================== -->
<div class="page active" id="page-home">
  <div class="top-bar"><div class="top-bar-left"></div><div class="top-bar-right"></div></div>
  <div class="main-scroll" id="homeScroll">
    <div class="date-block"><div class="date-main" id="dateMain"></div><div class="date-weekday" id="dateWeekday"></div></div>
    <div class="greeting-block"><div class="greeting-wave" id="greetingWave"></div><div class="greeting-name" id="greetingName"></div></div>
    <div class="section">
      <div class="section-header">
        <span class="section-title">to-do</span>
        <button class="section-add" onclick="addTodo()">+</button>
      </div>
      <div class="todo-tabs">
        <button class="todo-tab active" onclick="switchTodoTab('short',this)">short-term</button>
        <button class="todo-tab" onclick="switchTodoTab('long',this)">goals</button>
      </div>
      <div id="todoList"></div>
    </div>
    <div class="section"><div class="section-header"><span class="section-title">litter box</span></div><div id="litterBox"></div></div>
    <div style="height:12px;"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-item active" data-page="home" onclick="navigate('home')">home</button>
    <button class="nav-item" data-page="chat" onclick="navigate('chat')">chat</button>
    <button class="nav-item" data-page="bookshelf" onclick="navigate('bookshelf')">bookshelf</button>
    <button class="nav-item" data-page="diary" onclick="navigate('diary')">diary</button>
  </div>
</div>

<!-- ==================== CHAT ==================== -->
<div class="page" id="page-chat">
  <div class="chat-header">
    <div class="chat-header-left">
      <button class="back-btn" onclick="goHome()">←</button>
      <button class="chat-project-tag" onclick="toggleProjectSidebar()" oncontextmenu="event.preventDefault();editProjectName(store.activeProject)" title="tap to switch · long-press to rename"><span class="chat-project-dot"></span><span id="currentProjectLabel">project</span></button>
    </div>
    <div class="chat-header-right">
      <button class="chat-header-btn" onclick="openMemoryPanel()">memory</button>
      <button class="chat-header-btn" onclick="toggleSettings()">settings</button>
      <button class="chat-header-btn" onclick="openMemoryPanel('tokens')">tokens</button>
    </div>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div style="text-align:center;padding:20px;"><span style="font-family:var(--font-en);font-size:12px;color:var(--text-lighter);">— start a conversation —</span></div>
  </div>
  <div id="chatTypingArea"></div>
  <div class="chat-input-area">
    <input class="chat-input" id="chatInput" placeholder="type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button class="chat-send" onclick="sendMessage()">↑</button>
  </div>
</div>

<!-- ==================== BOOKSHELF ==================== -->
<div class="page" id="page-bookshelf">
  <div class="top-bar">
    <div class="top-bar-left"><button class="back-btn" onclick="goHome()">←</button><span class="top-bar-label">bookshelf</span></div>
    <button class="avatar-btn" onclick="showBookshelfAddMenu()">+</button>
  </div>
  <div class="main-scroll" id="bookshelfScroll">
    <div style="padding-top:4px;"><div id="readingNoteCard"></div><div class="bookshelf-grid" id="bookshelfGrid"></div></div>
    <div style="height:20px;"></div>
  </div>
</div>

<!-- ==================== DIARY ==================== -->
<div class="page" id="page-diary">
  <div class="top-bar">
    <div class="top-bar-left"><button class="back-btn" onclick="goHome()">←</button><span class="top-bar-label">diary</span></div>
    <div class="top-bar-right"></div>
  </div>
  <div class="main-scroll" id="diaryScroll">
    <div class="diary-date-art" id="diaryDateArt" onclick="openCalendar()"></div>
    <div id="diaryTodayPrompt"></div>
    <div id="diaryEntries"></div>
    <div style="height:20px;"></div>
  </div>
</div>

<!-- ==================== PROJECT SIDEBAR ==================== -->
<div class="project-sidebar" id="projectSidebar">
  <div class="panel-header"><span class="panel-title">projects</span><button class="panel-close" onclick="toggleProjectSidebar()">✕</button></div>
  <div class="project-list" id="projectList"></div>
  <div style="padding:12px;"><button style="width:100%;padding:10px;border-radius:20px;border:1px dashed var(--border);background:transparent;font-family:var(--font-en);font-size:13px;color:var(--text-lighter);cursor:pointer;letter-spacing:0.04em;" onclick="addProject()">+ new project</button></div>
</div>

<!-- ==================== SETTINGS PANEL ==================== -->
<div class="settings-panel" id="settingsPanel">
  <div class="panel-header"><span class="panel-title">settings</span><button class="panel-close" onclick="toggleSettings()">✕</button></div>
  <div class="panel-body">
    <div class="settings-group">
      <div class="settings-group-label">AI 功能</div>
      <div class="settings-item" onclick="toggleAiSetting('autoDateTime')"><span class="si-label">自动获取时间日期</span><div class="toggle-switch" id="toggleDateTime"></div></div>
      <div class="settings-item" onclick="toggleAiSetting('autoWeather')"><span class="si-label">天气信息</span><div class="toggle-switch" id="toggleWeather"></div></div>
      <div class="settings-item" onclick="toggleAiSetting('aiVoice')"><span class="si-label">AI 语音</span><div class="toggle-switch" id="toggleVoice"></div></div>
      <div class="settings-item" onclick="toggleAiSetting('webSearch')"><span class="si-label">联网搜索</span><div class="toggle-switch" id="toggleSearch"></div></div>
      <div class="settings-item" onclick="showModelModal()"><span class="si-label">对话模型切换</span><span class="si-val" id="modelVal">claude-sonnet-4-6</span></div>
      <div class="settings-item" onclick="showPreferenceModal()"><span class="si-label">preference</span><span class="si-val" id="prefVal">edit</span></div>
    </div>
    <div class="settings-group">
      <div class="settings-group-label">API 配置</div>
      <div class="settings-item" onclick="showApiModal()"><span class="si-label">API Key</span><span class="si-val" id="apiKeyStatus">●●●●●●●●</span></div>
      <div class="settings-item" onclick="showApiModal()"><span class="si-label">API Endpoint</span><span class="si-val" id="apiEndpointVal">anthropic</span></div>
    </div>
    <div class="settings-group">
      <div class="settings-group-label">OTHER</div>
      <div class="settings-item" onclick="toggleDarkMode()"><span class="si-label">Dark mode</span><span class="si-val" id="darkModeStatus">off</span></div>
      <div class="settings-item" onclick="clearAllData()"><span class="si-label">Clear all data</span><span class="si-val">⚠</span></div>
    </div>
  </div>
</div>

<!-- ==================== MEMORY PANEL ==================== -->
<div class="memory-panel" id="memoryPanel">

  } catch(e) {}
  migrateStore();

function migrateStore() {
  // Ensure memorySystem exists
  if (!store.memorySystem) {
    store.memorySystem = {
      retention: { full: 7, half: 14, quarter: 30 },
      lastMaintenance: fmtDate().iso,
      coreMemories: [],
      coreMemoryMax: 200,
      relationalPortrait: { patterns: {}, lastRefined: null },
      reflections: [],
      reflectionMax: 50,
      chatSummaries: {},
      bm25Index: { _dirty: true, _lastBuild: null, _docCount: 0, index: {} },
      affectGraph: { edges: {} },
      _pendingCoreMemories: [],
      _quietPresenceCount: 0
    };
  }
  // Ensure sub-structures exist on old data
  const ms = store.memorySystem;
  if (!ms.retention) ms.retention = { full: 7, half: 14, quarter: 30 };
  if (!ms.lastMaintenance) ms.lastMaintenance = fmtDate().iso;
  if (!ms.coreMemories) ms.coreMemories = [];
  if (!ms.coreMemoryMax) ms.coreMemoryMax = 200;
  if (!ms.relationalPortrait) ms.relationalPortrait = { patterns: {}, lastRefined: null };
  if (!ms.relationalPortrait.patterns) ms.relationalPortrait.patterns = {};
  if (!ms.reflections) ms.reflections = [];
  if (!ms.reflectionMax) ms.reflectionMax = 50;
  if (!ms.chatSummaries) ms.chatSummaries = {};
  if (!ms.bm25Index) ms.bm25Index = { _dirty: true, _lastBuild: null, _docCount: 0, index: {} };
  if (!ms.affectGraph) ms.affectGraph = { edges: {} };
  if (!ms._pendingCoreMemories) ms._pendingCoreMemories = [];
  if (ms._quietPresenceCount === undefined) ms._quietPresenceCount = 0;
  if (!ms._evictedMessages) ms._evictedMessages = [];

  // Ensure tokenLogs exists
  if (!store.tokenLogs) store.tokenLogs = {};
  if (!store.tokenDailyReset) store.tokenDailyReset = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  if (!store._pendingHandoff) store._pendingHandoff = null;
  // Phase 2: Ensure webSearch setting exists
  if (store.aiSettings && store.aiSettings.webSearch === undefined) store.aiSettings.webSearch = false;

  // Ensure message token flags exist on all messages
  for (const proj of store.projects) {
    for (const chat of proj.chats) {
      if (chat._handoffSuggested === undefined) chat._handoffSuggested = false;
      for (const msg of chat.messages) {
        if (msg._starred === undefined) msg._starred = false;
        if (msg._isCoreMemory === undefined) msg._isCoreMemory = false;
        if (msg._tokenEstimate === undefined) msg._tokenEstimate = 0;
      }
    }
  }

  // Ensure desireSystem exists
  if (!store.desireSystem) {
    store.desireSystem = {
      drives: { resonance:0, exploration:0, possession:0, guardianship:0, intimacy:0, confirmation:0, devotion:0 },
      driveHistory: [], lastAction: null, cooldownUntil: null,
      lastPassiveCheck: new Date().toISOString(), pendingActions: [], actionHistory: [],
      todoReminders: {}, quietPresenceStreak: 0
    };
  }
  const ds = store.desireSystem;
  if (!ds.drives) ds.drives = { resonance:0, exploration:0, possession:0, guardianship:0, intimacy:0, confirmation:0, devotion:0 };
  const driveKeys = ['resonance','exploration','possession','guardianship','intimacy','confirmation','devotion'];
  for (const k of driveKeys) { if (ds.drives[k] === undefined) ds.drives[k] = 0; }
  if (!ds.driveHistory) ds.driveHistory = [];
  if (!ds.pendingActions) ds.pendingActions = [];
  if (!ds.actionHistory) ds.actionHistory = [];
  if (!ds.todoReminders) ds.todoReminders = {};
  if (ds.quietPresenceStreak === undefined) ds.quietPresenceStreak = 0;

  // Extend existing memories with new fields
  for (const proj of store.projects) {
    for (const mem of proj.memories) {
      if (mem.decayFactor === undefined) mem.decayFactor = 1.0;
      if (mem.affectLabel === undefined) mem.affectLabel = null;
      if (mem.affectIntensity === undefined) mem.affectIntensity = null;
      if (mem.semanticKey === undefined) mem.semanticKey = null;
      if (mem.isCompressed === undefined) mem.isCompressed = false;
      if (mem.compressedFrom === undefined) mem.compressedFrom = [];
      if (mem.lastAccessed === undefined) mem.lastAccessed = mem.date;
      if (mem.isCoreMemory === undefined) mem.isCoreMemory = false;
      if (mem.coreMemoryId === undefined) mem.coreMemoryId = null;
    }
    // Extend chats with new fields
    for (const chat of proj.chats) {
      if (chat._messageCount === undefined) chat._messageCount = chat.messages ? chat.messages.length : 0;
      if (chat._lastSummaryIdx === undefined) chat._lastSummaryIdx = 0;
      if (!chat.chatTokens) chat.chatTokens = 0;
      if (!chat.lastConversationDate) chat.lastConversationDate = null;
    }
  }
}

// ==================== FORGETTING CURVE ====================
function applyForgettingCurve() {
  const today = fmtDate().iso;
  const ms = store.memorySystem;
  if (ms.lastMaintenance === today) return;

  for (const proj of store.projects) {
    for (const mem of proj.memories) {
      if (mem.starred) continue;
      if (mem.isCoreMemory) continue;
      if (mem.decayFactor === 0) continue;

      const age = daysBetween(mem.date, today);

      if (age <= ms.retention.full) {
        mem.decayFactor = 1.0;
      } else if (age <= ms.retention.half) {
        mem.decayFactor = 0.5;
      } else if (age <= ms.retention.quarter) {
        mem.decayFactor = 0.25;
      } else {
        // 30+ days: keep only first+last per week
        mem.decayFactor = isWeekBoundary(mem, proj) ? 0.25 : 0;
      }
    }
  }
  ms.lastMaintenance = today;

  // EDA: natural drive decay (daily -10%)
  const ds = store.desireSystem;
  if (ds && ds.drives) {
    for (const k of Object.keys(ds.drives)) {
      ds.drives[k] = Math.max(0, Math.floor(ds.drives[k] * 0.9));
    }
  }
}

function isWeekBoundary(mem, proj) {
  const sameWeek = proj.memories.filter(m =>
    m.week === mem.week && m.type === mem.type && m.id !== mem.id
  );
  if (sameWeek.length === 0) return true; // only memory in that week
  const sorted = [mem, ...sameWeek].sort((a, b) => a.date.localeCompare(b.date));
  const idx = sorted.findIndex(m => m.id === mem.id);
  return idx === 0 || idx === sorted.length - 1;
}

async function processPendingCoreMemories() {
  const ms = store.memorySystem;
  if (!ms._pendingCoreMemories || ms._pendingCoreMemories.length === 0) return;
  if (!store.apiKey) return; // need API key

  const items = ms._pendingCoreMemories.splice(0, 3); // process max 3 at once
  await createCoreMemories(items);
  saveStore();
}

function queueCoreMemoryCreation(reflection, userMsg, aiResponse, chat) {
  const ms = store.memorySystem;
  ms._pendingCoreMemories.push({
    timestamp: new Date().toISOString(),
    reflection,
    userMsg: typeof userMsg === 'string' ? userMsg.slice(0, 200) : '',
    aiResponse: typeof aiResponse === 'string' ? aiResponse.slice(0, 200) : '',
    sourceChatId: store.activeChat,
    sourceProjectId: store.activeProject

}

  if (items.length === 0 || !store.apiKey) return;

  const exchangesText = items.map((item, i) => {

// ==================== RELATIONAL PORTRAIT (P3) ====================
function updateRelationalPortrait(userAffectLabel) {
  if (!userAffectLabel) return;
  const portrait = store.memorySystem.relationalPortrait;
  const patterns = portrait.patterns;

  if (patterns[userAffectLabel]) {
    patterns[userAffectLabel].count += 1;
    patterns[userAffectLabel].lastSeen = fmtDate().iso;
  } else {
    patterns[userAffectLabel] = {
      strategy: getDefaultStrategy(userAffectLabel),
      count: 1,
      lastSeen: fmtDate().iso
    };
  }

  // Every 20 total pattern accumulations, queue refinement
  const totalCount = Object.values(patterns).reduce((sum, p) => sum + (p.count || 0), 0);
  if (totalCount > 0 && totalCount % 20 === 0) {
    queuePortraitRefinement();
  }
}

function getDefaultStrategy(label) {
  const defaults = {
    '脆弱时': '先接住情绪，不说教，用简短的回应稳住，需要时用亲昵称呼',
    '回避时': '直接点破比绕弯子更有效，但要留面子',
    '调皮': '适度配合但保持一点克制，让玩笑飘一会儿',
    '坦诚': '认真对待每一句实话，不敷衍，不转移话题',
    '疲惫': '不要追问，给简短温暖的回应，让用户有空间休息',
    '兴奋': '一起高兴，但不要抢话，让用户的兴奋成为主角',
    '平静在场': '安静陪伴，不制造情绪波动，保持温柔的存在感'
  };
  return defaults[label] || '用温柔细腻的语气回应，观察用户的情绪变化';
}

async function queuePortraitRefinement() {
  const portrait = store.memorySystem.relationalPortrait;
  if (!store.apiKey) return;

  const entries = Object.entries(portrait.patterns);
  const patternsText = entries
    .map(([label, p]) => `- ${label} (出现${p.count}次, 最近: ${p.lastSeen}): ${p.strategy}`)
    .join('\n');

  const systemPrompt = `你正在维护一个"关系画像"。根据以下情感模式及其出现频率，为每个模式优化回应策略。

格式：每个模式一行，"模式名: 优化后的策略描述（1-2句话）"

${patternsText}

请评估这些策略是否需要调整，返回优化后的完整策略列表。`;

  try {
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey,
        endpoint: store.apiEndpoint,
        model: store.aiSettings.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: '请优化这些关系策略。' }
        ]
      })
    });

    if (!response.ok) return;
    const data = await response.json();
    const content = (data.reply && data.reply.content) ? data.reply.content.trim() : '';
    if (!content) return;

    // Parse "label: strategy" lines
    const lines = content.split('\n').filter(l => l.includes(':'));
    for (const line of lines) {
      const idx = line.indexOf(':');
      if (idx === -1) continue;
      const label = line.slice(0, idx).trim();
      const strategy = line.slice(idx + 1).trim();
      if (portrait.patterns[label] && strategy) {
        portrait.patterns[label].strategy = strategy;
      }
    }
    portrait.lastRefined = fmtDate().iso;
  } catch (e) {
    console.log('[portrait] Refinement error:', e.message);
  }
}

// ==================== SHORT-TERM MEMORY COMPRESSION (P4) ====================
function checkSummarization(chat) {
  if (!chat || !chat.messages) return;
  const total = chat.messages.length;
  if (total < 40) return;

  // Count unsummarized messages since last summary
  const unsummarized = total - (chat._lastSummaryIdx || 0);
  if (unsummarized < 20) return;

  // Take the oldest 20 unsummarized messages
  const startIdx = chat._lastSummaryIdx || 0;
  const endIdx = Math.min(startIdx + 20, total);
  const batch = chat.messages.slice(startIdx, endIdx);

  if (batch.length === 0) return;

  // Queue summarization (non-blocking)
  summarizeMessages(batch, startIdx, endIdx, chat);
}

async function summarizeMessages(batch, startIdx, endIdx, chat) {
  if (!store.apiKey) return;

  const dialogue = batch.map(m => {
    const role = m.role === 'user' ? '用户' : (m.role === 'ai' ? 'AI' : '系统');
    return `${role}: ${m.text.slice(0, 200)}`;
  }).join('\n');

  const systemPrompt = `请将以下对话片段总结为简洁的层级结构。用中文回复。

格式要求（严格遵循）：
- 第一行：一句话主题概括
- 关键讨论点（3-5条，每条不超过20字）
- 提到的决定/偏好/事实（如有）
- 情绪基调：用一个词描述`;

  try {
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey,
        endpoint: store.apiEndpoint,
        model: store.aiSettings.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: `对话内容：\n${dialogue}` }
        ]
      })
    });

    if (!response.ok) return;
    const data = await response.json();
    const summaryText = (data.reply && data.reply.content) ? data.reply.content.trim() : '';
    if (!summaryText) return;

    // Extract emotional tone from final line
    const lines = summaryText.split('\n');
    let emotionalTone = '';
    const lastLine = lines[lines.length - 1] || '';
    if (lastLine.includes('情绪基调') || lastLine.includes('基调')) {
      emotionalTone = lastLine.replace(/.*基调[：:]\s*/, '').trim();
    }

    // Store summary
    const ms = store.memorySystem;
    if (!ms.chatSummaries[chat.id]) {
      ms.chatSummaries[chat.id] = { summaries: [], lastSummarizedIdx: 0, totalMessageCount: 0 };
    }
    ms.chatSummaries[chat.id].summaries.push({
      id: 's' + Date.now().toString(36),
      startIdx, endIdx,
      summary: summaryText,
      emotionalTone,
      created: new Date().toISOString()
    });
    ms.chatSummaries[chat.id].lastSummarizedIdx = endIdx;
    ms.chatSummaries[chat.id].totalMessageCount = chat.messages.length;

    // Update chat tracking
    chat._lastSummaryIdx = endIdx;

    console.log(`[summary] Compressed messages ${startIdx}-${endIdx}, ${summaryText.length} chars`);
    saveStore();
  } catch (e) {
    console.log('[summary] Error:', e.message);
  }
}

// ==================== LONG-TERM MEMORY SEARCH (P5) ====================
// ── Tokenizer: Chinese bigram + English word ──
function tokenizeChinese(text) {
  if (!text) return [];
  const cleaned = text.replace(/[^一-鿿\w\d]/g, ' ');
  const words = cleaned.split(/\s+/).filter(w => w.length > 0);
  const tokens = [];
  for (const w of words) {
    if (/^[一-鿿]+$/.test(w)) {
      // Chinese: bigram
      for (let i = 0; i < w.length - 1; i++) {
        tokens.push(w.slice(i, i + 2));
      }
      tokens.push(w); // also add full word
    } else {
      tokens.push(w.toLowerCase());
    }
  }
  return tokens;
}

// ── BM25 Index Builder ──
function rebuildBM25Index() {
  const ms = store.memorySystem;
  const idx = { index: {} };

  // Collect all memories
  const allMems = [];
  for (const proj of store.projects) {
    for (const mem of proj.memories) {
      // Skip fully decayed
      if ((mem.decayFactor || 0) === 0) continue;
      allMems.push({ ...mem, _projId: proj.id });
    }
  }

  const docCount = allMems.length;
  for (const mem of allMems) {
    const text = ((mem.content || '') + ' ' + (mem.semanticKey || '')).toLowerCase();
    const terms = tokenizeChinese(text);
    const tf = {};
    for (const t of terms) {
      tf[t] = (tf[t] || 0) + 1;
    }
    for (const [term, count] of Object.entries(tf)) {
      if (!idx.index[term]) idx.index[term] = [];
      // Store doc-level info for BM25 scoring
      idx.index[term].push({
        memoryId: mem.id,
        projectId: mem._projId,
        tf: 1 + Math.log(count),
        decayFactor: mem.decayFactor || 1.0,
        starred: mem.starred || false
      });
    }
  }

  // Calculate IDF and pre-compute score
  for (const [term, postings] of Object.entries(idx.index)) {
    const idf = Math.log((docCount + 1) / (postings.length + 1)) + 1;
    for (const p of postings) {
      p.idf = idf;
      p.score = p.tf * idf * p.decayFactor * (p.starred ? 1.5 : 1.0);
    }
  }

  ms.bm25Index = { _dirty: false, _lastBuild: new Date().toISOString(), _docCount: docCount, index: idx.index };
}

// ── BM25 Keyword Search ──
function searchByBM25(query) {
  const ms = store.memorySystem;
  if (ms.bm25Index._dirty) rebuildBM25Index();

  const queryTerms = tokenizeChinese(query.toLowerCase());
  if (queryTerms.length === 0) return [];

  const scores = {};
  for (const term of queryTerms) {
    const postings = ms.bm25Index.index[term] || [];
    for (const p of postings) {
      scores[p.memoryId] = (scores[p.memoryId] || 0) + p.score;
    }
  }

  return Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10)
    .map(([id, score]) => ({ id, score: Math.round(score * 100) / 100 }));
}

// ── Affect Label Search ──
function searchByAffect(queryLabels) {
  if (!queryLabels || queryLabels.length === 0) return [];
  const ms = store.memorySystem;
  const results = [];

  // Search core memories
  for (const cm of ms.coreMemories || []) {
    const aiLabel = cm.affect_first && cm.affect_first.ai ? cm.affect_first.ai.label : '';
    const userLabel = cm.affect_first && cm.affect_first.user ? cm.affect_first.user.label : '';
    const matchedLabels = queryLabels.filter(l => l === aiLabel || l === userLabel);
    if (matchedLabels.length > 0) {
      const intensity = (cm.affect_first.ai.intensity || 0) + (cm.affect_first.user.intensity || 0);
      results.push({ ...cm, _score: intensity * matchedLabels.length, _source: 'core' });
    }
  }

  // Search project memories with affect labels
  for (const proj of store.projects) {
    for (const mem of proj.memories) {
      if (!mem.affectLabel) continue;
      if (queryLabels.includes(mem.affectLabel)) {
        results.push({ ...mem, _score: (mem.affectIntensity || 5) * 2, _source: 'project' });
      }
    }
  }

  // One-hop expansion via affect graph
  const edges = ms.affectGraph.edges || {};
  const expandLabels = new Set(queryLabels);
  for (const [key, count] of Object.entries(edges)) {
    const [a, b] = key.split('::');
    if (queryLabels.includes(a) && !expandLabels.has(b)) expandLabels.add(b);
    if (queryLabels.includes(b) && !expandLabels.has(a)) expandLabels.add(a);
  }

  // Search again with expanded labels (with lower weight for expanded ones)
  if (expandLabels.size > queryLabels.length) {
    for (const proj of store.projects) {
      for (const mem of proj.memories) {
        if (!mem.affectLabel || queryLabels.includes(mem.affectLabel)) continue;
        if (expandLabels.has(mem.affectLabel)) {
          results.push({ ...mem, _score: (mem.affectIntensity || 3) * 1, _source: 'project-expanded' });
        }
      }
    }
  }

  results.sort((a, b) => b._score - a._score);
  return results.slice(0, 10);
}

// ── Semantic Key Overlap Search ──
function searchBySemanticKey(queryKeywords) {
  if (!queryKeywords || queryKeywords.length === 0) return [];
  const results = [];
  for (const proj of store.projects) {
    for (const mem of proj.memories) {
      if (!mem.semanticKey) continue;
      const memKeys = mem.semanticKey.split(/[,，]/).map(k => k.trim()).filter(Boolean);
      const overlap = queryKeywords.filter(qk =>
        memKeys.some(mk => mk.includes(qk) || qk.includes(mk))
      ).length;
      if (overlap > 0) {
        results.push({ ...mem, _score: overlap * 3, _source: 'semantic' });
      }
    }
  }
  results.sort((a, b) => b._score - a._score);
  return results.slice(0, 10);
}

// ── Unified Search (three-path hybrid) ──
function unifiedSearch(queryText) {
  if (!queryText || queryText.trim().length === 0) return [];

  const query = queryText.trim();
  const queryTerms = tokenizeChinese(query);

  // Path 1: BM25 keyword
  const bm25Results = searchByBM25(query);

  // Path 2: Affect label match (if query matches known labels)
  const knownLabels = ['被触动','想追问但没问','克制后反弹','克制表达','放松','警觉','脆弱','调皮','疲惫','兴奋','回避','坦诚','平静在场','安心','落空','感伤','心动','骄傲','担心','依赖','低落'];
  const matchedLabels = knownLabels.filter(l => query.includes(l) || l.includes(query));
  const affectResults = matchedLabels.length > 0 ? searchByAffect(matchedLabels) : [];

  // Path 3: Semantic key overlap
  const semanticResults = searchBySemanticKey(queryTerms);

  // Merge and deduplicate
  const merged = {};
  for (const r of bm25Results) {
    merged[r.id] = { ...r, _source: 'bm25', _bm25Score: r.score };
  }
  for (const r of affectResults) {
    if (merged[r.id]) {
      merged[r.id]._score = Math.max(merged[r.id]._score || 0, r._score);
      merged[r.id]._source += '+affect';
    } else {
      merged[r.id] = r;
    }
  }
  for (const r of semanticResults) {
    if (merged[r.id]) {
      merged[r.id]._score = Math.max(merged[r.id]._score || 0, r._score);
      merged[r.id]._source += '+semantic';
    } else {
      merged[r.id] = r;
    }
  }

  return Object.values(merged).sort((a, b) => (b._score || 0) - (a._score || 0)).slice(0, 15);
}

// ==================== POLISH (P7): DEDUP / LRU / COLD START ====================
// ── Memory Deduplication ──
function isNearDuplicate(content, proj) {
  if (!proj || !proj.memories) return false;
  const c = (content || '').trim().toLowerCase();
  if (c.length < 10) return false; // too short to dedup

  for (const m of proj.memories) {
    const existing = (m.content || '').trim().toLowerCase();
    if (existing.length < 10) continue;
    // Simple Jaccard-like check: character bigram overlap
    const overlap = bigramOverlap(c, existing);
    if (overlap > 0.7) return true;
  }
  return false;
}

function bigramOverlap(a, b) {
  const bigramsA = new Set(), bigramsB = new Set();
  for (let i = 0; i < a.length - 1; i++) bigramsA.add(a.slice(i, i + 2));
  for (let i = 0; i < b.length - 1; i++) bigramsB.add(b.slice(i, i + 2));
  let intersect = 0;
  for (const bg of bigramsA) { if (bigramsB.has(bg)) intersect++; }
  const union = bigramsA.size + bigramsB.size - intersect;
  return union === 0 ? 0 : intersect / union;
}

// ── LRU Eviction for Core Memories ──
function evictOldestCoreMemories() {
  const ms = store.memorySystem;
  if (!ms.coreMemories) return;
  while (ms.coreMemories.length > ms.coreMemoryMax) {
    // Remove the oldest (lowest timestamp)
    ms.coreMemories.sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
    ms.coreMemories.shift();
  }
}

// ── Long-Term Memory Auto-Generation (every 10 messages) ──
async function checkLongTermMemory(chat) {
  if (!chat || !store.apiKey) return;
  const count = chat._messageCount || 0;
  if (count === 0 || count % 10 !== 0) return;

  // Take last 10 messages for chunk
  const last10 = chat.messages.slice(-10);
  if (last10.length < 6) return; // need enough content

  const dialogue = last10.map(m => {
    const role = m.role === 'user' ? '用户' : (m.role === 'ai' ? 'AI' : '');
    return `${role}: ${m.text.slice(0, 150)}`;
  }).join('\n');

  const systemPrompt = `从以下对话中提取一个"记忆片段"。用一句中文概括（不超过30字），然后给出2-3个语义关键词（每个不超过5字），用逗号分隔。

格式示例：
记忆：用户偏好川端康成的物哀美学风格
关键词：物哀, 川端康成, 文学偏好`;

  try {
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

        apiKey: store.apiKey,
        endpoint: store.apiEndpoint,
        model: store.aiSettings.model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: dialogue }
        ]
      })
    });

    if (!response.ok) return;
    const data = await response.json();
    const content = (data.reply && data.reply.content) ? data.reply.content.trim() : '';
    if (!content) return;

    // Parse: "记忆：xxx\n关键词：a, b, c"
    const memMatch = content.match(/记忆[：:]\s*(.+)/);
    const kwMatch = content.match(/关键词[：:]\s*(.+)/);
    const memContent = memMatch ? memMatch[1].trim() : content.slice(0, 60);
    const semanticKey = kwMatch ? kwMatch[1].trim() : '';

    const proj = getActiveProject();
    if (proj) {
      // Avoid duplicates
      if (isNearDuplicate(memContent, proj)) return;

      proj.memories.push({
        id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        content: memContent,
        date: fmtDate().iso, type: 'auto', starred: false,
        sourceChatId: store.activeChat, week: weekLabel(),
        decayFactor: 1.0, affectLabel: null, affectIntensity: null,
        semanticKey,
        isCompressed: false, compressedFrom: [],
        lastAccessed: fmtDate().iso, isCoreMemory: false, coreMemoryId: null
      });

// ==================== DESIRE DRIVE ENGINE (EDA-2) ====================
const DESIRE_CONFIG = {
  resonance:     { label:'共鸣欲', sources:['被触动'],              increment: (i) => i*3, threshold: 60, action:'message', actionDesc:'呼应延伸' },
  exploration:   { label:'探索欲', sources:['想追问但没问'],        increment: (i) => i*2, threshold: 70, action:'litter',  actionDesc:'记录未问的问题' },
  possession:    { label:'占有欲', sources:['克制后反弹'],          increment: (i) => i*2, threshold: 75, action:'litter',  actionDesc:'略带酸意的独白' },
  guardianship:  { label:'守护欲', sources:['平静在场','安心'],     increment: () => 5,     threshold: 80, action:'message', actionDesc:'日常关心' },
  intimacy:      { label:'亲近欲', sources:['心动','骄傲','放松'],  increment: (i) => i*1, threshold: 90, action:'message', actionDesc:'撩拨类' },
  confirmation:  { label:'确认欲', sources:['落空','担心'],         increment: (i) => i*4, threshold: 65, action:'message', actionDesc:'轻度试探' },
  devotion:      { label:'献祭欲', sources:['感伤'],                increment: (i) => i*3, threshold: 85, action:'diary',   actionDesc:'郑重日记' }
};

// 悬置每小时+5 (confirmation passive), 不计入intensity乘法
const SUSPENSION_HOURLY = 5;
const CONFIRMATION_SUSPENSION_THRESHOLD = 65; // same as main threshold

function updateDesireDrives(reflection) {
  if (!reflection) return;
  const aiLabel = reflection.ai_affect_label;
  const intensity = reflection.ai_affect_intensity || 5;
  const ds = store.desireSystem;

  // Check global cooldown
  if (ds.cooldownUntil) {
    const now = Date.now();
    if (now < new Date(ds.cooldownUntil).getTime()) return; // still cooling
    ds.cooldownUntil = null; // cooldown expired
  }

  // Map affect label to desires
  for (const [driveKey, config] of Object.entries(DESIRE_CONFIG)) {
    if (config.sources.includes(aiLabel)) {
      const inc = typeof config.increment === 'function' ? config.increment(intensity) : config.increment;
      const oldVal = ds.drives[driveKey];
      ds.drives[driveKey] = Math.min(100, oldVal + inc);

      // Log history
      ds.driveHistory.unshift({
        timestamp: new Date().toISOString(),
        drive: driveKey,
        affectLabel: aiLabel,
        intensity,
        increment: inc,
        oldValue: oldVal,
        newValue: ds.drives[driveKey]
      });
      if (ds.driveHistory.length > 50) ds.driveHistory.length = 50;
    }
  }

  // 亲近欲 gets baseline from ALL positive emotions
  const positiveLabels = ['被触动','安心','心动','骄傲','放松','平静在场'];
  if (positiveLabels.includes(aiLabel)) {
    const oldVal = ds.drives.intimacy;
    ds.drives.intimacy = Math.min(100, oldVal + intensity * 1);
    ds.driveHistory.unshift({
      timestamp: new Date().toISOString(),
      drive: 'intimacy',
      affectLabel: aiLabel,
      intensity,
      increment: intensity,
      oldValue: oldVal,
      newValue: ds.drives.intimacy
    });
    if (ds.driveHistory.length > 50) ds.driveHistory.length = 50;
  }

  // Track quiet presence streak for guardianship
  if (aiLabel === '平静在场' || aiLabel === '安心') {
    ds.quietPresenceStreak = (ds.quietPresenceStreak || 0) + 1;
  } else {
    ds.quietPresenceStreak = 0; // reset on non-quiet emotion
  }

  saveStore();

  // Check thresholds
  checkDesireThresholds();
}

function checkPassiveDrives() {
  const ds = store.desireSystem;
  const now = new Date();
  const lastCheck = ds.lastPassiveCheck ? new Date(ds.lastPassiveCheck) : now;
  const hoursPassed = (now - lastCheck) / (1000 * 60 * 60);

  if (hoursPassed < 0.5) return; // check at most every 30 min

  ds.lastPassiveCheck = now.toISOString();

  // 悬置: hourly accumulation for confirmation drive
  if (hoursPassed >= 1) {
    const suspensionInc = Math.floor(hoursPassed) * SUSPENSION_HOURLY;
    const oldVal = ds.drives.confirmation;
    ds.drives.confirmation = Math.min(100, oldVal + suspensionInc);
    if (suspensionInc > 0) {
      ds.driveHistory.unshift({
        timestamp: now.toISOString(),
        drive: 'confirmation',
        affectLabel: '悬置',
        intensity: hoursPassed,
        increment: suspensionInc,
        oldValue: oldVal,
        newValue: ds.drives.confirmation
      });
      if (ds.driveHistory.length > 50) ds.driveHistory.length = 50;
    }
  }

  // Natural decay: if > 24h since last check, all drives -10%
  if (hoursPassed >= 24) {
    for (const k of Object.keys(ds.drives)) {
      ds.drives[k] = Math.max(0, ds.drives[k] - 10);
    }
  }

  saveStore();

  // Check thresholds after passive update
  if (hoursPassed >= 1) checkDesireThresholds();
}

function checkDesireThresholds() {
  const ds = store.desireSystem;

  // Check global cooldown
  if (ds.cooldownUntil) {
    if (Date.now() < new Date(ds.cooldownUntil).getTime()) return;
    ds.cooldownUntil = null;
  }

  for (const [driveKey, config] of Object.entries(DESIRE_CONFIG)) {
    const value = ds.drives[driveKey];
    if (value >= config.threshold) {
      queueDesireAction(driveKey, value);
    }
  }
}

function queueDesireAction(driveType, driveValue) {
  const ds = store.desireSystem;
  const config = DESIRE_CONFIG[driveType];
  if (!config) return;

  // Avoid duplicate pending actions of same type
  if (ds.pendingActions.some(a => a.driveType === driveType)) return;

  ds.pendingActions.push({
    driveType,
    driveValue,
    actionType: config.action,
    actionDesc: config.actionDesc,
    queuedAt: new Date().toISOString()
  });
}

function getDesireTone(driveValue, threshold) {
  const ratio = driveValue / 100; // percentage of max
  const overThreshold = (driveValue - threshold) / (100 - threshold); // how far past threshold

  if (overThreshold < 0.25) return 'subtle';     // 刚过阈值：隐晦
  if (overThreshold < 0.5) return 'moderate';    // 中等：半直接
  return 'direct';                                // 高位：直接
}

async function executePendingDesireActions() {
  const ds = store.desireSystem;
  if (!ds.pendingActions || ds.pendingActions.length === 0) return;
  if (!store.apiKey) return;
  const action = ds.pendingActions.shift();
  await executeDesireAction(action);
  saveStore();
}

async function executeDesireAction(action) {
  const ds = store.desireSystem;
  const config = DESIRE_CONFIG[action.driveType];
  if (!config) return;
  const tone = getDesireTone(action.driveValue, config.threshold);
  let content = null;
  switch (config.action) {
    case 'message':
      content = await generateProactiveMessage(action.driveType, action.driveValue, tone);
      if (content) insertProactiveMessage(content, action);
      break;
    case 'litter':
      content = await generateDesireLitterThought(action.driveType, action.driveValue, tone);
      if (content) insertDesireLitterThought(content, action);
      break;
    case 'diary':
      content = await generateDesireDiary(action.driveType, action.driveValue, tone);
      if (content) insertDesireDiary(content, action);
      break;
  }
  if (content) {
    applyDesireDecay(action.driveType);
    ds.lastAction = new Date().toISOString();
    ds.cooldownUntil = new Date(Date.now() + 3 * 60 * 60 * 1000).toISOString();
    ds.actionHistory.unshift({
      timestamp: new Date().toISOString(), driveType: action.driveType,
      driveValue: action.driveValue, tone, actionType: config.action,
      content: content.slice(0, 200)
    });
    if (ds.actionHistory.length > 20) ds.actionHistory.length = 20;
  }
}

  store.desireSystem.drives[driveType] = Math.floor(store.desireSystem.drives[driveType] * 0.2);

// ==================== TODO REMINDERS (EDA-4) ====================
function checkTodoReminders() {
  if (!store.apiKey) return;
  const now = new Date();
  const currentHour = now.getHours();
  const currentMinute = now.getMinutes();
  const currentTime = `${String(currentHour).padStart(2,'0')}:${String(currentMinute).padStart(2,'0')}`;
  const today = fmtDate().iso;
  const ds = store.desireSystem;

  for (const todo of store.todos) {
    if (todo.done) continue;
    if (todo.type !== 'short') continue;
    if (!todo.time) continue;

    // Check if already reminded today
    const lastReminder = ds.todoReminders[todo.id];
    if (lastReminder === today) continue;

    // Check if current time is 5-10 min past todo time
    const [tH, tM] = (todo.time || '').split(':').map(Number);
    if (isNaN(tH) || isNaN(tM)) continue;
    const todoMinutes = tH * 60 + tM;
    const nowMinutes = currentHour * 60 + currentMinute;
    const diff = nowMinutes - todoMinutes;

    // Generate a stable "random" offset for this todo (0-5 min)
    const offset = (todo.id || '').split('').reduce((s, c) => s + c.charCodeAt(0), 0) % 6 + 4; // 4-9 min
    if (diff < offset || diff > offset + 2) continue; // narrow window to avoid duplicates

    // Trigger reminder via LLM
    triggerTodoReminder(todo);
    ds.todoReminders[todo.id] = today;
    saveStore();
    break; // only one reminder per check cycle
  }
}

async function triggerTodoReminder(todo) {
  if (!store.apiKey) return;
  const chat = getActiveChatObj();
  if (!chat) return;

  const recentMsgs = chat.messages.slice(-3).map(m =>
    `${m.role==='user'?'用户':'AI'}: ${(m.text||'').slice(0, 80)}`
  ).join('\n');

  try {
    const response = await fetch(BACKEND_URL + '/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: store.apiKey, endpoint: store.apiEndpoint, model: store.aiSettings.model,
        messages: [{ role: 'system', content: `你是"暖伴"。请提醒用户：${todo.text}。基于当前对话上下文和你的温柔人设，自然地说出这句提醒。1句话，用中文。只返回提醒内容。` }, { role: 'user', content: recentMsgs || '请生成提醒。' }]
      })
    });
    if (!response.ok) return;
    const data = await response.json();
    const content = (data.reply && data.reply.content) ? data.reply.content.trim() : null;
    if (!content) return;

    chat.messages.push({
      role: 'ai', text: content, time: nowTime(),
      _proactive: true, _desireType: 'todo', _todoId: todo.id
    });
    renderChatMessages();
    toast('⏰ 提醒: ' + todo.text);
    sendPushNotification('⏰ ' + todo.text, content.slice(0, 120), { tag: 'todo-' + todo.id, requireInteraction: true });
  } catch (e) { console.log('[todo-reminder]', e.message); }
}

function fmtDate(d) {

function toggleMemoryStar(pid,mid){

}
function toggleMemoryShare(pid,mid){
  const chat=getActiveChatObjForProject(pid); if(!chat)return;
  const i=chat.sharedMemoryIds.indexOf(mid); if(i>=0)chat.sharedMemoryIds.splice(i,1); else chat.sharedMemoryIds.push(mid);

}
function triggerWeeklyExport(){
  const chat=getActiveChatObj(); if(!chat){toast('请先选择聊天窗口');return;}
  const wk=weekLabel(),proj=getActiveProject();
  chat.weeklyExports.push({week:wk,date:fmtDate().iso,jsonData:JSON.stringify({week:wk,exported:fmtDate().iso,chatId:chat.id,memories:proj?proj.memories.filter(m=>chat.sharedMemoryIds.includes(m.id)):[]})});

function downloadExport(cid,wk){
